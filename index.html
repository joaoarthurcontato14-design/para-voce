<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#283b54"
>

<title>para você.</title>


<style>

/* =========================================================
   CONFIGURAÇÕES GERAIS
========================================================= */

:root {

  --blue: #283b54;
  --blue-dark: #1b293b;

  --paper: #f5f1e7;
  --paper-dark: #e8e1d2;

  --ink: #262626;

  --white: #ffffff;

}


* {

  box-sizing: border-box;

  margin: 0;

  padding: 0;

}


html,
body {

  width: 100%;
  height: 100%;

  overflow: hidden;

}


body {

  background:
    var(--blue);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color:
    white;

}


/* =========================================================
   APP
========================================================= */

#app {

  width: 100vw;
  height: 100vh;

  position: relative;

  overflow: hidden;

}


/* =========================================================
   TELA DE CARREGAMENTO
========================================================= */

.loading {

  position: fixed;

  inset: 0;

  z-index: 9999;

  background:
    #283b54;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;

}


.loader-title {

  font-family:
    Georgia,
    serif;

  font-size:
    clamp(25px, 4vw, 42px);

  letter-spacing:
    .5px;

  margin-bottom:
    12px;

}


.loader-sub {

  font-size:
    13px;

  opacity:
    .65;

}


.loader-line {

  width:
    80px;

  height:
    1px;

  background:
    rgba(255,255,255,.6);

  margin-top:
    25px;

  animation:
    loaderLine 2s ease-in-out infinite;

}


@keyframes loaderLine {

  0% {
    transform: scaleX(.25);
    opacity: .25;
  }

  50% {
    transform: scaleX(1);
    opacity: 1;
  }

  100% {
    transform: scaleX(.25);
    opacity: .25;
  }

}


.hidden {

  display:
    none !important;

}


/* =========================================================
   INTERFACE PRINCIPAL
========================================================= */

.main-interface {

  position: absolute;

  inset: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  background:
    var(--blue);

}


/*
   A imagem ocupa a tela inteira,
   mas preserva sua proporção.
*/

.interface-image {

  width: 100vw;
  height: 100vh;

  object-fit: cover;

  object-position: center;

  display: block;

  user-select: none;

  -webkit-user-drag: none;

}


/* =========================================================
   HOTSPOTS
========================================================= */

.hotspot {

  position: absolute;

  border: none;

  padding: 0;

  margin: 0;

  background: transparent;

  cursor: pointer;

  z-index: 50;

  outline: none;

  transform:
    translate(-50%, -50%);

}


/*
   IMPORTANTE:

   Os valores abaixo são relativos à tela.
   Eles foram feitos para que os hotspots
   permaneçam pequenos e discretos.
*/


/* -------------------------
   GLOBO
------------------------- */

.globe-hotspot {

  left: 24.5%;
  top: 47%;

  width: 42px;
  height: 42px;

  border-radius: 50%;

}


/* -------------------------
   CALENDÁRIO
------------------------- */

.calendar-hotspot {

  left: 79%;
  top: 28%;

  width: 58px;
  height: 48px;

}


/* -------------------------
   CADILLAC
------------------------- */

.car-hotspot {

  left: 78%;
  top: 72%;

  width: 105px;
  height: 60px;

  border-radius:
    20px;

}


/* -------------------------
   LIVRO
------------------------- */

.book-hotspot {

  left: 50%;
  top: 52%;

  width: 235px;
  height: 295px;

  border-radius:
    15px;

}


/* -------------------------
   CANETA
------------------------- */

.pen-hotspot {

  left: 72%;
  top: 76%;

  width: 95px;
  height: 30px;

  border-radius:
    30px;

}


/*
   Pequeno feedback visual.
*/

.hotspot:hover {

  background:
    rgba(255,255,255,.025);

}


.hotspot:active {

  transform:
    translate(-50%, -50%)
    scale(.96);

}


/* =========================================================
   POP-UP DO GLOBO
========================================================= */

.globe-popup-overlay {

  position: fixed;

  inset: 0;

  z-index: 1000;

  background:
    rgba(10,18,28,.70);

  backdrop-filter:
    blur(10px);

  -webkit-backdrop-filter:
    blur(10px);

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

}


.globe-popup {

  width:
    min(430px, 90vw);

  padding:
    48px 38px 42px;

  position: relative;

  background:
    rgba(247,244,236,.98);

  color:
    #222;

  border-radius:
    24px;

  box-shadow:
    0 30px 80px
    rgba(0,0,0,.45);

  text-align:
    center;

  animation:
    popupIn .3s ease;

}


@keyframes popupIn {

  from {

    opacity: 0;

    transform:
      translateY(15px)
      scale(.96);

  }

  to {

    opacity: 1;

    transform:
      translateY(0)
      scale(1);

  }

}


.globe-popup-close {

  position: absolute;

  top: 13px;
  right: 13px;

  width: 34px;
  height: 34px;

  border: none;

  border-radius: 50%;

  background:
    rgba(40,59,84,.08);

  color:
    #283b54;

  font-size:
    23px;

  cursor: pointer;

}


.globe-popup-title {

  font-family:
    Georgia,
    serif;

  font-size:
    23px;

  margin-bottom:
    22px;

}


.globe-popup-line {

  width:
    45px;

  height:
    1px;

  margin:
    0 auto 22px;

  background:
    rgba(40,59,84,.3);

}


.globe-popup-place {

  font-size:
    15px;

  line-height:
    1.5;

}


.globe-popup-arrow {

  margin:
    10px 0;

  color:
    var(--blue);

}


/* =========================================================
   MODAL DA SENHA
========================================================= */

.password-overlay {

  position: fixed;

  inset: 0;

  z-index: 1100;

  background:
    rgba(10,18,28,.82);

  backdrop-filter:
    blur(10px);

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

}


.password-modal {

  width:
    min(420px, 90vw);

  padding:
    38px;

  border-radius:
    24px;

  background:
    rgba(247,244,236,.98);

  color:
    #222;

  text-align:
    center;

  box-shadow:
    0 30px 80px
    rgba(0,0,0,.45);

}


.password-modal h2 {

  font-family:
    Georgia,
    serif;

  font-size:
    24px;

  margin-bottom:
    10px;

}


.password-modal p {

  color:
    #666;

  font-size:
    14px;

  line-height:
    1.5;

  margin-bottom:
    22px;

}


.password-modal input {

  width: 100%;

  height: 50px;

  padding:
    0 16px;

  border:
    1px solid #d6d0c3;

  border-radius:
    14px;

  background:
    #fffdf8;

  font-size:
    17px;

  text-align:
    center;

  letter-spacing:
    2px;

  outline:
    none;

  margin-bottom:
    14px;

}


.password-modal input:focus {

  border-color:
    var(--blue);

}


.modal-buttons {

  display:
    flex;

  justify-content:
    center;

  gap:
    8px;

}


.modal-buttons button {

  border:
    none;

  border-radius:
    999px;

  padding:
    12px 20px;

  background:
    var(--blue);

  color:
    white;

  cursor:
    pointer;

}


.modal-buttons .secondary {

  background:
    transparent;

  border:
    1px solid #d1c9ba;

  color:
    #333;

}


.password-error {

  color:
    #9c4040 !important;

  min-height:
    20px;

  margin:
    12px 0 0 !important;

}


/* =========================================================
   CARTA
========================================================= */

.letter-overlay {

  position: fixed;

  inset: 0;

  z-index: 1200;

  background:
    rgba(24,37,54,.96);

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  padding:
    25px;

}


.letter-container {

  position:
    relative;

  width:
    min(720px, 90vw);

  height:
    min(82vh, 850px);

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

}


.letter-page {

  display:
    none;

  width:
    100%;

  height:
    100%;

  object-fit:
    contain;

  object-position:
    center;

  background:
    white;

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.5);

}


.letter-page.active {

  display:
    block;

}


/* -------------------------
   FECHAR CARTA
------------------------- */

.close-button {

  position:
    fixed;

  top:
    20px;

  right:
    20px;

  z-index:
    1300;

  width:
    40px;

  height:
    40px;

  padding:
    0;

  border:
    none;

  border-radius:
    50%;

  background:
    rgba(0,0,0,.55);

  color:
    white;

  font-size:
    25px;

  cursor:
    pointer;

}


/* -------------------------
   CONTROLES DA CARTA
------------------------- */

.letter-controls {

  position:
    absolute;

  left:
    50%;

  bottom:
    -25px;

  transform:
    translateX(-50%);

  display:
    flex;

  align-items:
    center;

  gap:
    10px;

  padding:
    6px 8px;

  border-radius:
    999px;

  background:
    rgba(0,0,0,.78);

}


.letter-controls button {

  width:
    34px;

  height:
    34px;

  padding:
    0;

  border:
    none;

  border-radius:
    50%;

  background:
    rgba(255,255,255,.12);

  color:
    white;

  font-size:
    17px;

  cursor:
    pointer;

}


.letter-controls button:disabled {

  opacity:
    .3;

  cursor:
    default;

}


.page-number {

  min-width:
    50px;

  color:
    white;

  font-size:
    12px;

  text-align:
    center;

}


/* -------------------------
   AVISO ÚLTIMA PÁGINA
------------------------- */

.last-note {

  position:
    absolute;

  left:
    50%;

  bottom:
    35px;

  transform:
    translateX(-50%);

  max-width:
    80%;

  padding:
    10px 17px;

  border-radius:
    999px;

  background:
    rgba(40,59,84,.95);

  color:
    white;

  font-size:
    12px;

  text-align:
    center;

}


/* =========================================================
   MENSAGENS
========================================================= */

.messages-overlay {

  position: fixed;

  inset: 0;

  z-index: 1400;

  background:
    rgba(30,43,60,.94);

  backdrop-filter:
    blur(8px);

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  padding:
    20px;

}


/*
   Folha principal.
*/

.paper {

  position:
    relative;

  width:
    min(760px, 92vw);

  height:
    min(78vh, 720px);

  background:
    var(--paper);

  color:
    var(--ink);

  padding:
    48px 50px 125px;

  border-radius:
    3px;

  box-shadow:
    0 30px 90px
    rgba(0,0,0,.48);

  overflow:
    hidden;

}


/*
   Textura sutil do papel.
*/

.paper::before {

  content:
    "";

  position:
    absolute;

  inset:
    18px;

  border:
    1px solid
    rgba(40,40,40,.08);

  pointer-events:
    none;

}


/* -------------------------
   TÍTULO
------------------------- */

.paper h1 {

  position:
    relative;

  z-index:
    2;

  font-family:
    Georgia,
    serif;

  font-weight:
    normal;

  font-size:
    22px;

  line-height:
    1.3;

  text-align:
    center;

  margin-bottom:
    25px;

}


/* -------------------------
   FECHAR
------------------------- */

.messages-close {

  position:
    absolute;

  right:
    17px;

  top:
    17px;

  z-index:
    5;

  width:
    34px;

  height:
    34px;

  padding:
    0;

  border:
    none;

  border-radius:
    50%;

  background:
    rgba(40,59,84,.1);

  color:
    var(--blue);

  font-size:
    22px;

  cursor:
    pointer;

}


/* -------------------------
   MENSAGENS
------------------------- */

.messages {

  position:
    relative;

  height:
    calc(100% - 50px);

  overflow-y:
    auto;

  padding:
    5px 8px;

  scrollbar-width:
    thin;

}


.message {

  padding:
    12px 4px 15px;

  border-bottom:
    1px dashed
    rgba(30,30,30,.14);

}


.message-name {

  font-family:
    "Segoe Print",
    "Bradley Hand",
    cursive;

  font-weight:
    bold;

  font-size:
    16px;

  margin-bottom:
    4px;

}


.message-text {

  font-family:
    "Segoe Print",
    "Bradley Hand",
    cursive;

  font-size:
    15px;

  line-height:
    1.5;

  white-space:
    pre-wrap;

  word-break:
    break-word;

}


.message-date {

  margin-top:
    5px;

  font-family:
    sans-serif;

  font-size:
    10px;

  opacity:
    .45;

}


/* -------------------------
   FORMULÁRIO
------------------------- */

.message-form {

  position:
    absolute;

  left:
    35px;

  right:
    35px;

  bottom:
    22px;

  z-index:
    5;

  display:
    grid;

  grid-template-columns:
    150px 1fr auto;

  gap:
    8px;

}


.message-form input,
.message-form textarea {

  width:
    100%;

  border:
    1px solid
    #d2cbbb;

  background:
    #fffdf8;

  color:
    #222;

  border-radius:
    12px;

  padding:
    11px 13px;

  font-family:
    inherit;

  font-size:
    14px;

  outline:
    none;

}


.message-form input {

  height:
    44px;

}


.message-form textarea {

  height:
    44px;

  resize:
    none;

}


.message-form input:focus,
.message-form textarea:focus {

  border-color:
    var(--blue);

}


.message-form button {

  height:
    44px;

  padding:
    0 18px;

  border:
    none;

  border-radius:
    12px;

  background:
    var(--blue);

  color:
    white;

  cursor:
    pointer;

}


/* -------------------------
   FOLHAS ANTERIORES
------------------------- */

.archive-button {

  position:
    absolute;

  left:
    20px;

  top:
    18px;

  z-index:
    5;

  border:
    none;

  border-radius:
    999px;

  padding:
    8px 13px;

  background:
    rgba(40,59,84,.1);

  color:
    var(--blue);

  font-size:
    11px;

  cursor:
    pointer;

}


/* =========================================================
   ARQUIVO
========================================================= */

.archive {

  position:
    fixed;

  inset:
    0;

  z-index:
    1500;

  background:
    rgba(24,37,54,.97);

  display:
    flex;

  flex-direction:
    column;

  align-items:
    center;

  justify-content:
    center;

  padding:
    25px;

}


.archive h2 {

  font-family:
    Georgia,
    serif;

  font-weight:
    normal;

  margin-bottom:
    20px;

}


.archive-list {

  display:
    flex;

  flex-wrap:
    wrap;

  justify-content:
    center;

  gap:
    10px;

  max-width:
    600px;

}


.archive-list button {

  border:
    none;

  border-radius:
    999px;

  padding:
    10px 16px;

  background:
    var(--paper);

  color:
    #222;

  cursor:
    pointer;

}


.archive-close {

  position:
    absolute;

  right:
    20px;

  top:
    20px;

  border:
    none;

  border-radius:
    999px;

  padding:
    10px 16px;

  background:
    rgba(255,255,255,.12);

  color:
    white;

  cursor:
    pointer;

}


/* =========================================================
   CELULAR
========================================================= */

@media (max-width: 700px) {


  /*
     INTERFACE
  */

  .interface-image {

    width:
      100vw;

    height:
      100vh;

    object-fit:
      cover;

  }


  /*
     HOTSPOTS
  */

  .globe-hotspot {

    left:
      24.5%;

    top:
      47%;

    width:
      32px;

    height:
      32px;

  }


  .calendar-hotspot {

    left:
      79%;

    top:
      28%;

    width:
      45px;

    height:
      36px;

  }


  .car-hotspot {

    left:
      78%;

    top:
      72%;

    width:
      78px;

    height:
      45px;

  }


  .book-hotspot {

    left:
      50%;

    top:
      52%;

    width:
      175px;

    height:
      230px;

  }


  .pen-hotspot {

    left:
      72%;

    top:
      76%;

    width:
      70px;

    height:
      23px;

  }


  /*
     CARTA
  */

  .letter-overlay {

    padding:
      12px;

  }


  .letter-container {

    width:
      94vw;

    height:
      78vh;

  }


  .letter-page {

    width:
      100%;

    height:
      100%;

    object-fit:
      contain;

  }


  .letter-controls {

    bottom:
      -15px;

  }


  .last-note {

    bottom:
      32px;

    font-size:
      10px;

    max-width:
      88%;

  }


  /*
     MENSAGENS
  */

  .messages-overlay {

    padding:
      12px;

  }


  .paper {

    width:
      94vw;

    height:
      88vh;

    padding:
      45px 22px 125px;

  }


  .paper h1 {

    font-size:
      19px;

  }


  .message-form {

    left:
      20px;

    right:
      20px;

    grid-template-columns:
      1fr;

    gap:
      6px;

  }


  .message-form input,
  .message-form textarea {

    height:
      40px;

  }


  .message-form button {

    height:
      40px;

  }


  .archive-button {

    left:
      15px;

    top:
      15px;

  }


}


/* =========================================================
   ACESSIBILIDADE
========================================================= */

button {

  -webkit-tap-highlight-color:
    transparent;

}


button:focus-visible {

  outline:
    2px solid
    rgba(255,255,255,.7);

  outline-offset:
    3px;

}

</style>

</head>


<body>


<div id="app">


<!-- =======================================================
     CARREGAMENTO
======================================================= -->

<div
  class="loading"
  id="loading"
>

  <div class="loader-title">
    Um Ano Depois...
  </div>

  <div class="loader-sub">
    Feito por João Arthur.
  </div>

  <div class="loader-line"></div>

</div>


<!-- =======================================================
     INTERFACE
======================================================= -->

<main class="main-interface">

  <img
    class="interface-image"
    src="assets/interface.png"
    alt="Mesa com globo, livro, calendário, Cadillac e caneta"
  >


  <!-- GLOBO -->

  <button
    class="hotspot globe-hotspot"
    id="globeHotspot"
    aria-label="Abrir informações sobre o globo"
  ></button>


  <!-- CALENDÁRIO -->

  <button
    class="hotspot calendar-hotspot"
    id="calendarHotspot"
    aria-label="Calendário"
  ></button>


  <!-- CADILLAC -->

  <button
    class="hotspot car-hotspot"
    id="carHotspot"
    aria-label="Cadillac"
  ></button>


  <!-- LIVRO -->

  <button
    class="hotspot book-hotspot"
    id="book"
    aria-label="Abrir carta"
  ></button>


  <!-- CANETA -->

  <button
    class="hotspot pen-hotspot"
    id="pen"
    aria-label="Escrever mensagem"
  ></button>

</main>


<!-- =======================================================
     POP-UP DO GLOBO
======================================================= -->

<div
  class="globe-popup-overlay hidden"
  id="globePopupOverlay"
>

  <div class="globe-popup">

    <button
      class="globe-popup-close"
      id="closeGlobePopup"
      aria-label="Fechar"
    >
      ×
    </button>

    <div class="globe-popup-title">
      Um ano de distância.
    </div>

    <div class="globe-popup-line"></div>

    <div class="globe-popup-place">
      Costa Marques/Cacoal - RO
    </div>

    <div class="globe-popup-arrow">
      ↓
    </div>

    <div class="globe-popup-place">
      Recife - PE
    </div>

  </div>

</div>


<!-- =======================================================
     SENHA
======================================================= -->

<div
  class="password-overlay hidden"
  id="passwordOverlay"
>

  <div class="password-modal">

    <h2>
      Teu aniversário
    </h2>

    <p>
      Para continuar, digite a data
      somente com números.
    </p>

    <input
      id="passwordInput"
      type="password"
      inputmode="numeric"
      maxlength="8"
      placeholder="DDMMAAAA"
      autocomplete="off"
    >

    <div class="modal-buttons">

      <button id="unlockButton">
        abrir
      </button>

      <button
        class="secondary"
        id="cancelPassword"
      >
        cancelar
      </button>

    </div>

    <p
      class="password-error"
      id="passwordError"
    ></p>

  </div>

</div>


<!-- =======================================================
     CARTA
======================================================= -->

<div
  class="letter-overlay hidden"
  id="letterOverlay"
>

  <button
    class="close-button"
    id="closeLetter"
    aria-label="Fechar carta"
  >
    ×
  </button>


  <div class="letter-container">


    <!-- PÁGINA 1 -->

    <img
      class="letter-page active"
      src="assets/page-1.png"
      alt="Página 1 da carta"
    >


    <!-- PÁGINA 2 -->

    <img
      class="letter-page"
      src="assets/page-2.png"
      alt="Página 2 da carta"
    >


    <!-- PÁGINA 3 -->

    <img
      class="letter-page"
      src="assets/page-3.png"
      alt="Página 3 da carta"
    >


    <!-- PÁGINA 4 -->

    <img
      class="letter-page"
      src="assets/page-4.png"
      alt="Página 4 da carta"
    >


    <!-- CONTROLES -->

    <div class="letter-controls">

      <button
        id="previousPage"
        aria-label="Página anterior"
      >
        ←
      </button>

      <span
        class="page-number"
        id="pageNumber"
      >
        1 / 4
      </span>

      <button
        id="nextPage"
        aria-label="Próxima página"
      >
        →
      </button>

    </div>


    <!-- AVISO FINAL -->

    <div
      class="last-note hidden"
      id="lastNote"
    >
      Deixe uma mensagem ou comentário
      na caneta encima da mesa
    </div>

  </div>

</div>


<!-- =======================================================
     MENSAGENS
======================================================= -->

<div
  class="messages-overlay hidden"
  id="messagesOverlay"
>

  <div class="paper">


    <button
      class="archive-button"
      id="archiveButton"
    >
      folhas anteriores
    </button>


    <button
      class="messages-close"
      id="closeMessages"
      aria-label="Fechar mensagens"
    >
      ×
    </button>


    <h1>

      if u have something to say,<br>
      say it here.

    </h1>


    <div
      class="messages"
      id="messages"
    ></div>


    <div class="message-form">

      <input
        id="nameInput"
        type="text"
        maxlength="80"
        placeholder="teu nome"
      >

      <textarea
        id="messageInput"
        maxlength="2000"
        placeholder="escreva aqui..."
      ></textarea>

      <button
        id="sendButton"
      >
        enviar
      </button>

    </div>


  </div>

</div>


<!-- =======================================================
     ARQUIVO DE FOLHAS
======================================================= -->

<div
  class="archive hidden"
  id="archive"
>

  <button
    class="archive-close"
    id="closeArchive"
  >
    fechar
  </button>

  <h2>
    folhas anteriores
  </h2>

  <div
    class="archive-list"
    id="archiveList"
  ></div>

</div>


</div>


<script>

/* =========================================================
   CONFIGURAÇÕES
========================================================= */


/*
   SENHA
*/

const PASSWORD = "25102008";


/*
   URL DO GOOGLE APPS SCRIPT

   Mantida conforme a configuração
   que você já estava utilizando.
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbz7mUY2SZA9sdeXLLVdheKYA4rVh7AbnDojfyLPxEXy204IGUwnARLYkXhh7pr7DWCcaw/exec";


/*
   QUANTIDADE DE MENSAGENS POR FOLHA
*/

const MESSAGES_PER_SHEET = 6;


/* =========================================================
   ELEMENTOS
========================================================= */

const loading =
  document.getElementById("loading");

const book =
  document.getElementById("book");

const pen =
  document.getElementById("pen");

const passwordOverlay =
  document.getElementById("passwordOverlay");

const passwordInput =
  document.getElementById("passwordInput");

const passwordError =
  document.getElementById("passwordError");

const unlockButton =
  document.getElementById("unlockButton");

const cancelPassword =
  document.getElementById("cancelPassword");

const letterOverlay =
  document.getElementById("letterOverlay");

const closeLetter =
  document.getElementById("closeLetter");

const pages =
  document.querySelectorAll(".letter-page");

const previousPage =
  document.getElementById("previousPage");

const nextPage =
  document.getElementById("nextPage");

const pageNumber =
  document.getElementById("pageNumber");

const lastNote =
  document.getElementById("lastNote");

const messagesOverlay =
  document.getElementById("messagesOverlay");

const closeMessages =
  document.getElementById("closeMessages");

const messagesContainer =
  document.getElementById("messages");

const nameInput =
  document.getElementById("nameInput");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const archiveButton =
  document.getElementById("archiveButton");

const archive =
  document.getElementById("archive");

const archiveList =
  document.getElementById("archiveList");

const closeArchive =
  document.getElementById("closeArchive");

const globeHotspot =
  document.getElementById("globeHotspot");

const globePopupOverlay =
  document.getElementById("globePopupOverlay");

const closeGlobePopup =
  document.getElementById("closeGlobePopup");


/* =========================================================
   ESTADO
========================================================= */

let unlocked = false;

let currentPage = 0;

let allMessages = [];

let currentMessageSheet = 0;


/* =========================================================
   CARREGAMENTO
========================================================= */

/*
   Mantém a tela inicial durante 5 segundos.
*/

window.addEventListener(
  "load",
  function() {

    setTimeout(
      function() {

        loading.classList.add("hidden");

      },
      5000
    );

  }
);


/* =========================================================
   GLOBO
========================================================= */

globeHotspot.addEventListener(
  "click",
  function(event) {

    event.stopPropagation();

    globePopupOverlay
      .classList
      .remove("hidden");

  }
);


closeGlobePopup.addEventListener(
  "click",
  function() {

    globePopupOverlay
      .classList
      .add("hidden");

  }
);


globePopupOverlay.addEventListener(
  "click",
  function(event) {

    if (
      event.target ===
      globePopupOverlay
    ) {

      globePopupOverlay
        .classList
        .add("hidden");

    }

  }
);


/* =========================================================
   LIVRO
========================================================= */

book.addEventListener(
  "click",
  function() {

    if (!unlocked) {

      abrirSenha();

      return;

    }

    abrirCarta();

  }
);


/* =========================================================
   CANETA
========================================================= */

pen.addEventListener(
  "click",
  function() {

    if (!unlocked) {

      abrirSenha();

      return;

    }

    abrirMensagens();

  }
);


/* =========================================================
   SENHA
========================================================= */

function abrirSenha() {

  passwordOverlay
    .classList
    .remove("hidden");

  passwordInput.focus();

}


unlockButton.addEventListener(
  "click",
  verificarSenha
);


passwordInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      verificarSenha();

    }

  }
);


function verificarSenha() {

  const value =
    passwordInput.value.trim();


  if (
    value === PASSWORD
  ) {

    unlocked = true;

    passwordOverlay
      .classList
      .add("hidden");

    passwordInput.value = "";

    passwordError.textContent = "";


    /*
       Depois da senha, abrimos o livro.
    */

    abrirCarta();

  } else {

    passwordError.textContent =
      "A senha não está correta.";

    passwordInput.select();

  }

}


cancelPassword.addEventListener(
  "click",
  function() {

    passwordOverlay
      .classList
      .add("hidden");

    passwordInput.value = "";

    passwordError.textContent = "";

  }
);


/* =========================================================
   CARTA
========================================================= */

function abrirCarta() {

  currentPage = 0;

  atualizarPagina();

  letterOverlay
    .classList
    .remove("hidden");

}


function atualizarPagina() {

  pages.forEach(
    function(page, index) {

      page.classList.toggle(
        "active",
        index === currentPage
      );

    }
  );


  pageNumber.textContent =
    `${currentPage + 1} / ${pages.length}`;


  previousPage.disabled =
    currentPage === 0;


  nextPage.disabled =
    currentPage === pages.length - 1;


  if (
    currentPage ===
    pages.length - 1
  ) {

    lastNote
      .classList
      .remove("hidden");

  } else {

    lastNote
      .classList
      .add("hidden");

  }

}


previousPage.addEventListener(
  "click",
  function() {

    if (
      currentPage > 0
    ) {

      currentPage--;

      atualizarPagina();

    }

  }
);


nextPage.addEventListener(
  "click",
  function() {

    if (
      currentPage <
      pages.length - 1
    ) {

      currentPage++;

      atualizarPagina();

    }

  }
);


closeLetter.addEventListener(
  "click",
  function() {

    letterOverlay
      .classList
      .add("hidden");

  }
);


/* =========================================================
   MENSAGENS
========================================================= */

async function abrirMensagens() {

  messagesOverlay
    .classList
    .remove("hidden");

  await carregarMensagens();

}


closeMessages.addEventListener(
  "click",
  function() {

    messagesOverlay
      .classList
      .add("hidden");

  }
);


/* =========================================================
   CARREGAR MENSAGENS
========================================================= */

async function carregarMensagens() {

  try {

    const response =
      await fetch(
        API_URL +
        "?action=messages&time=" +
        Date.now()
      );


    const data =
      await response.json();


    if (
      data.success &&
      Array.isArray(data.messages)
    ) {

      allMessages =
        data.messages;

    } else {

      allMessages = [];

    }

  } catch (error) {

    console.error(
      "Erro ao carregar mensagens:",
      error
    );

    allMessages = [];

  }


  renderizarFolhaAtual();

}


/* =========================================================
   FOLHAS
========================================================= */

function obterFolhas() {

  const sheets = [];


  for (
    let i = 0;
    i < allMessages.length;
    i += MESSAGES_PER_SHEET
  ) {

    sheets.push(
      allMessages.slice(
        i,
        i + MESSAGES_PER_SHEET
      )
    );

  }


  if (
    sheets.length === 0
  ) {

    sheets.push([]);

  }


  return sheets;

}


/* =========================================================
   FOLHA ATUAL
========================================================= */

function renderizarFolhaAtual() {

  const sheets =
    obterFolhas();


  currentMessageSheet =
    sheets.length - 1;


  renderizarSheet(
    currentMessageSheet
  );


  atualizarArquivo(
    sheets
  );

}


/* =========================================================
   RENDERIZAR FOLHA
========================================================= */

function renderizarSheet(index) {

  const sheets =
    obterFolhas();


  const sheet =
    sheets[index] || [];


  messagesContainer.innerHTML =
    "";


  if (
    sheet.length === 0
  ) {

    const empty =
      document.createElement("div");


    empty.style.cssText =
      `
        text-align:center;
        margin-top:100px;
        opacity:.45;
        font-family:Georgia,serif;
      `;


    empty.textContent =
      "ainda não há mensagens.";


    messagesContainer.appendChild(
      empty
    );


    return;

  }


  sheet.forEach(
    function(item) {

      const wrapper =
        document.createElement("div");


      wrapper.className =
        "message";


      const name =
        document.createElement("div");


      name.className =
        "message-name";


      name.textContent =
        item.name || "anônimo";


      const text =
        document.createElement("div");


      text.className =
        "message-text";


      text.textContent =
        item.message || "";


      const date =
        document.createElement("div");


      date.className =
        "message-date";


      date.textContent =
        formatarData(
          item.timestamp
        );


      wrapper.appendChild(
        name
      );


      wrapper.appendChild(
        text
      );


      wrapper.appendChild(
        date
      );


      messagesContainer.appendChild(
        wrapper
      );

    }
  );

}


/* =========================================================
   ARQUIVO
========================================================= */

function atualizarArquivo(
  sheets
) {

  archiveList.innerHTML =
    "";


  const oldSheets =
    sheets.length - 1;


  if (
    oldSheets <= 0
  ) {

    const text =
      document.createElement("p");


    text.style.opacity =
      ".6";


    text.textContent =
      "Ainda não existem folhas anteriores.";


    archiveList.appendChild(
      text
    );


    return;

  }


  for (
    let i = oldSheets - 1;
    i >= 0;
    i--
  ) {

    const button =
      document.createElement("button");


    button.textContent =
      `folha ${i + 1}`;


    button.addEventListener(
      "click",
      function() {

        currentMessageSheet =
          i;


        renderizarSheet(
          i
        );


        archive
          .classList
          .add("hidden");

      }
    );


    archiveList.appendChild(
      button
    );

  }

}


archiveButton.addEventListener(
  "click",
  function() {

    const sheets =
      obterFolhas();


    atualizarArquivo(
      sheets
    );


    archive
      .classList
      .remove("hidden");

  }
);


closeArchive.addEventListener(
  "click",
  function() {

    archive
      .classList
      .add("hidden");

  }
);


/* =========================================================
   ENVIAR MENSAGEM
========================================================= */

sendButton.addEventListener(
  "click",
  enviarMensagem
);


messageInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      event.shiftKey === false
    ) {

      event.preventDefault();

      enviarMensagem();

    }

  }
);


async function enviarMensagem() {

  const name =
    nameInput.value.trim();


  const message =
    messageInput.value.trim();


  if (!name) {

    alert(
      "Antes de enviar, coloque seu nome."
    );

    nameInput.focus();

    return;

  }


  if (!message) {

    alert(
      "Escreva uma mensagem."
    );

    messageInput.focus();

    return;

  }


  sendButton.disabled =
    true;


  sendButton.textContent =
    "enviando...";


  try {

    const response =
      await fetch(
        API_URL,
        {
          method:
            "POST",

          headers:
            {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

          body:
            JSON.stringify(
              {
                name:
                  name,

                message:
                  message
              }
            )
        }
      );


    const data =
      await response.json();


    if (
      !data.success
    ) {

      throw new Error(
        data.error ||
        "Erro ao salvar."
      );

    }


    nameInput.value =
      "";

    messageInput.value =
      "";


    await carregarMensagens();


    alert(
      "Mensagem guardada."
    );


  } catch (error) {

    console.error(
      error
    );


    alert(
      "Não foi possível salvar a mensagem. Verifique o Google Apps Script."
    );

  }


  sendButton.disabled =
    false;


  sendButton.textContent =
    "enviar";

}


/* =========================================================
   DATA
========================================================= */

function formatarData(
  value
) {

  if (!value) {

    return "";

  }


  try {

    const date =
      new Date(value);


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return "";

    }


    return date.toLocaleString(
      "pt-BR",
      {
        day:
          "2-digit",

        month:
          "2-digit",

        year:
          "numeric",

        hour:
          "2-digit",

        minute:
          "2-digit"
      }
    );

  } catch {

    return "";

  }

}


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key !== "Escape"
    ) {

      return;

    }


    passwordOverlay
      .classList
      .add("hidden");


    globePopupOverlay
      .classList
      .add("hidden");


    letterOverlay
      .classList
      .add("hidden");


    messagesOverlay
      .classList
      .add("hidden");


    archive
      .classList
      .add("hidden");

  }
);

</script>

</body>

</html>
