<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#283b54"
>

<title>para você.</title>


<style>

/* =========================================================
   CONFIGURAÇÕES GERAIS
========================================================= */

:root {

  --blue: #283b54;
  --blue-dark: #1d2c40;

  --paper: #f7f4ec;
  --paper-dark: #ebe6d9;

  --ink: #242424;

  --white: #ffffff;

}


* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}


html,
body {

  width: 100%;
  height: 100%;

}


body {

  overflow: hidden;

  background:
    var(--blue);

  color:
    white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

}


/* =========================================================
   APP
========================================================= */

#app {

  position: fixed;

  inset: 0;

  width: 100vw;
  height: 100vh;

  overflow: hidden;

}


/* =========================================================
   TELA DE CARREGAMENTO
========================================================= */

.loading {

  position: fixed;

  inset: 0;

  z-index: 9999;

  background:
    var(--blue);

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;

  transition:
    opacity .8s ease,
    visibility .8s ease;

}


.loading.hidden {

  opacity: 0;

  visibility: hidden;

  pointer-events: none;

}


.loader-title {

  font-family:
    Georgia,
    serif;

  font-size:
    clamp(24px, 5vw, 38px);

  letter-spacing:
    .5px;

  margin-bottom:
    12px;

  animation:
    loaderFade 1.8s ease infinite alternate;

}


.loader-sub {

  font-size:
    12px;

  letter-spacing:
    1.5px;

  opacity:
    .55;

}


.loader-line {

  width:
    90px;

  height:
    1px;

  margin-top:
    28px;

  background:
    rgba(255,255,255,.55);

  animation:
    loaderLine 2s ease-in-out infinite;

}


@keyframes loaderFade {

  from {
    opacity: .55;
  }

  to {
    opacity: 1;
  }

}


@keyframes loaderLine {

  0% {
    transform: scaleX(.2);
    opacity: .2;
  }

  50% {
    transform: scaleX(1);
    opacity: .8;
  }

  100% {
    transform: scaleX(.2);
    opacity: .2;
  }

}


/* =========================================================
   INTERFACE PRINCIPAL
========================================================= */

.scene {

  position: absolute;

  inset: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  background:
    var(--blue);

}


/*
   A imagem inteira é mantida dentro da tela.

   contain = nada da interface será cortado.
*/

.interface-image {

  position: absolute;

  width: 100vw;

  height: 100vh;

  object-fit: contain;

  object-position: center;

  user-select: none;

  -webkit-user-drag: none;

  pointer-events: none;

}


/* =========================================================
   HOTSPOTS
========================================================= */

/*
   Os botões são transparentes.

   Eles ficam por cima da imagem e servem somente
   para detectar o clique.
*/

.hotspot {

  position: absolute;

  z-index: 20;

  border: none;

  background: transparent;

  cursor: pointer;

  padding: 0;

  outline: none;

  -webkit-tap-highlight-color:
    transparent;

}


/*
   Ao passar o mouse NÃO colocamos uma caixa gigante.
   Apenas um pequeno brilho discreto.
*/

.hotspot::after {

  content: "";

  position: absolute;

  inset: -4px;

  border-radius: 50%;

  background:
    rgba(255,255,255,0);

  transition:
    background .2s ease;

}


.hotspot:hover::after {

  background:
    rgba(255,255,255,.08);

}


/* =========================================================
   LIVRO
========================================================= */

/*
   IMPORTANTE:

   Estes valores representam a posição do livro
   na interface.png.

   Se precisar ajustar posteriormente, alteraremos
   somente estes números.
*/

.book-hotspot {

  /*
     centro aproximado do livro
  */

  left: 50%;

  top: 50%;

  width: 19vw;

  height: 28vw;

  max-width: 230px;

  max-height: 330px;

  transform:
    translate(-50%, -50%);

}


/* =========================================================
   CANETA
========================================================= */

/*
   Área pequena e centralizada sobre a caneta.
*/

.pen-hotspot {

  /*
     posição aproximada da caneta
  */

  left: 68%;

  top: 73%;

  width: 12vw;

  height: 4vw;

  max-width: 150px;

  max-height: 45px;

  transform:
    translate(-50%, -50%)
    rotate(-25deg);

}


/* =========================================================
   OUTROS HOTSPOTS
========================================================= */

/*
   Mantidos pequenos para não atrapalhar a interface.
*/

.globe-hotspot {

  left: 21%;

  top: 35%;

  width: 11vw;

  height: 11vw;

  max-width: 150px;

  max-height: 150px;

  transform:
    translate(-50%, -50%);

}


.calendar-hotspot {

  right: 18%;

  top: 24%;

  width: 12vw;

  height: 7vw;

  max-width: 160px;

  max-height: 100px;

  transform:
    translate(50%, -50%);

}


.car-hotspot {

  right: 17%;

  bottom: 20%;

  width: 14vw;

  height: 7vw;

  max-width: 190px;

  max-height: 90px;

  transform:
    translate(50%, 50%);

}


/* =========================================================
   MODAL DE SENHA
========================================================= */

.overlay {

  position: fixed;

  inset: 0;

  z-index: 500;

  background:
    rgba(15,24,36,.86);

  backdrop-filter:
    blur(15px);

  -webkit-backdrop-filter:
    blur(15px);

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

}


.overlay.hidden {

  display: none;

}


.modal {

  width:
    min(420px, 92vw);

  padding:
    34px;

  border-radius:
    24px;

  background:
    rgba(247,244,236,.98);

  color:
    #222;

  text-align:
    center;

  box-shadow:
    0 30px 80px
    rgba(0,0,0,.45);

}


.modal h2 {

  font-family:
    Georgia,
    serif;

  font-weight:
    500;

  font-size:
    24px;

  margin-bottom:
    12px;

}


.modal p {

  color:
    #666;

  line-height:
    1.5;

  margin-bottom:
    22px;

}


.modal input {

  width: 100%;

  border:
    1px solid #d3cec2;

  background:
    #fffdf8;

  color:
    #222;

  border-radius:
    14px;

  padding:
    14px 16px;

  font-size:
    16px;

  outline:
    none;

  text-align:
    center;

  margin-bottom:
    15px;

}


.modal input:focus {

  border-color:
    var(--blue);

}


.modal button {

  border:
    none;

  border-radius:
    999px;

  padding:
    12px 22px;

  background:
    var(--blue);

  color:
    white;

  cursor:
    pointer;

  font-size:
    14px;

}


.modal button.secondary {

  background:
    transparent;

  color:
    #333;

  border:
    1px solid #ccc6b9;

  margin-left:
    7px;

}


.error {

  color:
    #a23d3d !important;

  min-height:
    18px;

  margin:
    13px 0 0 !important;

  font-size:
    13px;

}


/* =========================================================
   CARTA
========================================================= */

.letter-overlay {

  position: fixed;

  inset: 0;

  z-index: 600;

  background:
    rgba(22,34,50,.97);

  display: flex;

  align-items: center;

  justify-content: center;

  padding:
    18px;

}


.letter-overlay.hidden {

  display: none;

}


.letter {

  position: relative;

  width:
    min(88vw, 760px);

  height:
    min(88vh, 760px);

  display: flex;

  align-items: center;

  justify-content: center;

}


/*
   A página NÃO ocupa mais a tela inteira.

   Ela é limitada pelo tamanho da janela.
*/

.letter-page {

  display: none;

  max-width:
    100%;

  max-height:
    calc(100vh - 100px);

  width:
    auto;

  height:
    auto;

  object-fit:
    contain;

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.5);

  user-select:
    none;

}


.letter-page.active {

  display:
    block;

}


/* =========================================================
   BOTÃO FECHAR CARTA
========================================================= */

.close-button {

  position: fixed;

  top: 18px;

  right: 18px;

  z-index: 700;

  width: 38px;

  height: 38px;

  border: none;

  border-radius: 50%;

  background:
    rgba(0,0,0,.6);

  color:
    white;

  font-size:
    23px;

  line-height:
    38px;

  padding: 0;

  cursor: pointer;

}


/* =========================================================
   CONTROLES DA CARTA
========================================================= */

.letter-controls {

  position: fixed;

  left: 50%;

  bottom: 18px;

  transform:
    translateX(-50%);

  z-index: 710;

  display: flex;

  align-items: center;

  gap: 8px;

  padding:
    6px 8px;

  border-radius:
    999px;

  background:
    rgba(0,0,0,.75);

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.3);

}


.letter-controls button {

  width:
    34px;

  height:
    34px;

  padding: 0;

  border: none;

  border-radius:
    50%;

  background:
    rgba(255,255,255,.12);

  color:
    white;

  font-size:
    18px;

  cursor:
    pointer;

}


.letter-controls button:disabled {

  opacity:
    .25;

  cursor:
    default;

}


.page-number {

  min-width:
    55px;

  text-align:
    center;

  font-size:
    12px;

  color:
    rgba(255,255,255,.85);

}


/* =========================================================
   TEXTO DA ÚLTIMA PÁGINA
========================================================= */

.last-note {

  position: absolute;

  left: 50%;

  bottom: 75px;

  transform:
    translateX(-50%);

  z-index: 720;

  max-width:
    min(520px, 80vw);

  padding:
    10px 17px;

  border-radius:
    999px;

  background:
    rgba(40,59,84,.95);

  color:
    white;

  text-align:
    center;

  font-size:
    13px;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.25);

}


.hidden {

  display:
    none !important;

}


/* =========================================================
   MENSAGENS
========================================================= */

.messages-overlay {

  position: fixed;

  inset: 0;

  z-index: 800;

  background:
    rgba(24,37,54,.97);

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  padding:
    18px;

}


.messages-overlay.hidden {

  display:
    none;

}


.paper {

  position: relative;

  width:
    min(900px, 94vw);

  height:
    min(86vh, 820px);

  background:
    var(--paper);

  color:
    var(--ink);

  padding:
    50px;

  box-shadow:
    0 30px 90px
    rgba(0,0,0,.5);

  overflow:
    hidden;

}


.paper::before {

  content: "";

  position: absolute;

  inset:
    24px;

  border:
    1px solid
    rgba(50,50,50,.08);

  pointer-events:
    none;

}


.paper h1 {

  position: relative;

  z-index: 2;

  text-align:
    center;

  font-family:
    Georgia,
    serif;

  font-size:
    22px;

  font-weight:
    500;

  line-height:
    1.4;

  margin-bottom:
    20px;

}


/* =========================================================
   MENSAGENS EXISTENTES
========================================================= */

.messages {

  position: relative;

  z-index: 2;

  height:
    calc(100% - 150px);

  overflow-y:
    auto;

  padding:
    10px 15px;

}


.message {

  font-family:
    "Segoe Print",
    "Bradley Hand",
    "Comic Sans MS",
    cursive;

  margin-bottom:
    22px;

  line-height:
    1.45;

  transform:
    rotate(var(--rotation));

}


.message-name {

  font-weight:
    bold;

  font-size:
    17px;

}


.message-text {

  white-space:
    pre-wrap;

  font-size:
    16px;

  word-break:
    break-word;

}


.message-date {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  font-size:
    10px;

  opacity:
    .45;

  margin-top:
    3px;

}


/* =========================================================
   FORMULÁRIO
========================================================= */

.message-form {

  position:
    absolute;

  z-index:
    5;

  left:
    50%;

  bottom:
    18px;

  transform:
    translateX(-50%);

  width:
    calc(100% - 70px);

  display:
    flex;

  align-items:
    center;

  gap:
    8px;

}


.message-form input,
.message-form textarea {

  margin: 0;

  border:
    1px solid #d3cec2;

  background:
    #fffdf8;

  color:
    #222;

  border-radius:
    12px;

  padding:
    11px 13px;

  outline:
    none;

  font-family:
    inherit;

}


.message-form input {

  width:
    150px;

}


.message-form textarea {

  flex:
    1;

  height:
    42px;

  min-height:
    42px;

  resize:
    none;

}


.message-form button {

  height:
    42px;

  border:
    none;

  border-radius:
    999px;

  padding:
    0 18px;

  background:
    var(--blue);

  color:
    white;

  cursor:
    pointer;

}


/* =========================================================
   BOTÕES DAS MENSAGENS
========================================================= */

.archive-button {

  position:
    absolute;

  top:
    18px;

  left:
    18px;

  z-index:
    10;

  border:
    none;

  border-radius:
    999px;

  padding:
    8px 14px;

  background:
    var(--blue);

  color:
    white;

  font-size:
    12px;

  cursor:
    pointer;

}


.messages-close {

  position:
    absolute;

  top:
    18px;

  right:
    18px;

  z-index:
    10;

  width:
    36px;

  height:
    36px;

  padding:
    0;

  border:
    none;

  border-radius:
    50%;

  background:
    rgba(0,0,0,.15);

  color:
    #222;

  font-size:
    21px;

  cursor:
    pointer;

}


/* =========================================================
   ARQUIVO
========================================================= */

.archive {

  position: fixed;

  inset: 0;

  z-index: 900;

  background:
    rgba(24,37,54,.98);

  display:
    flex;

  flex-direction:
    column;

  align-items:
    center;

  justify-content:
    center;

  padding:
    25px;

}


.archive.hidden {

  display:
    none;

}


.archive h2 {

  font-family:
    Georgia,
    serif;

  margin-bottom:
    20px;

}


.archive-list {

  display:
    flex;

  flex-wrap:
    wrap;

  justify-content:
    center;

  gap:
    10px;

  max-width:
    700px;

}


.archive-list button {

  border:
    none;

  border-radius:
    999px;

  padding:
    10px 16px;

  background:
    var(--paper);

  color:
    #222;

  cursor:
    pointer;

}


.archive-close {

  position:
    absolute;

  top:
    18px;

  right:
    18px;

  border:
    none;

  border-radius:
    999px;

  padding:
    9px 15px;

  background:
    rgba(255,255,255,.15);

  color:
    white;

  cursor:
    pointer;

}


/* =========================================================
   CELULAR
========================================================= */

@media (max-width: 700px) {


  /*
     A interface continua inteira na tela.
  */

  .interface-image {

    width:
      100vw;

    height:
      100vh;

    object-fit:
      contain;

  }


  /*
     LIVRO — menor no celular.
  */

  .book-hotspot {

    width:
      24vw;

    height:
      32vw;

    max-width:
      125px;

    max-height:
      190px;

  }


  /*
     CANETA — área pequena.
  */

  .pen-hotspot {

    width:
      17vw;

    height:
      5vw;

    max-width:
      90px;

    max-height:
      30px;

  }


  /*
     Carta.

     O limite de altura é o que impede
     a página de ficar gigante.
  */

  .letter {

    width:
      96vw;

    height:
      82vh;

  }


  .letter-page {

    max-width:
      92vw;

    max-height:
      calc(100vh - 125px);

  }


  .letter-controls {

    bottom:
      12px;

  }


  .last-note {

    bottom:
      62px;

    font-size:
      11px;

  }


  /*
     Folha de mensagens.
  */

  .paper {

    width:
      94vw;

    height:
      90vh;

    padding:
      45px 22px 100px;

  }


  .paper h1 {

    font-size:
      19px;

  }


  .messages {

    height:
      calc(100% - 130px);

  }


  .message-form {

    width:
      calc(100% - 30px);

    flex-wrap:
      wrap;

  }


  .message-form input {

    width:
      105px;

  }


  .message-form textarea {

    min-width:
      0;

    flex:
      1;

  }


  .message-form button {

    width:
      100%;

  }

}


/* =========================================================
   ACESSIBILIDADE
========================================================= */

button:focus-visible {

  outline:
    2px solid
    rgba(255,255,255,.8);

  outline-offset:
    3px;

}


</style>

</head>


<body>


<div id="app">


<!-- =====================================================
     CARREGAMENTO
===================================================== -->

<div
  class="loading"
  id="loading"
>

  <div class="loader-title">
    Um Ano Depois...
  </div>

  <div class="loader-sub">
    Feito por João Arthur.
  </div>

  <div class="loader-line"></div>

</div>


<!-- =====================================================
     CENA PRINCIPAL
===================================================== -->

<div class="scene">


  <!--
       ESTA É A IMAGEM PRINCIPAL.

       Ela deve estar em:

       assets/interface.png
  -->

  <img
    class="interface-image"
    src="assets/interface.png"
    alt="Mesa com livro, globo, calendário, Cadillac e caneta"
  >


  <!-- ===================================================
       GLOBO
  ==================================================== -->

  <button
    class="hotspot globe-hotspot"
    id="globeHotspot"
    aria-label="Globo"
    title="Globo"
  ></button>


  <!-- ===================================================
       CALENDÁRIO
  ==================================================== -->

  <button
    class="hotspot calendar-hotspot"
    id="calendarHotspot"
    aria-label="Calendário"
    title="Calendário"
  ></button>


  <!-- ===================================================
       CADILLAC
  ==================================================== -->

  <button
    class="hotspot car-hotspot"
    id="carHotspot"
    aria-label="Cadillac"
    title="Cadillac"
  ></button>


  <!-- ===================================================
       LIVRO
  ==================================================== -->

  <button
    class="hotspot book-hotspot"
    id="book"
    aria-label="Abrir carta"
    title="Abrir carta"
  ></button>


  <!-- ===================================================
       CANETA
  ==================================================== -->

  <button
    class="hotspot pen-hotspot"
    id="pen"
    aria-label="Escrever mensagem"
    title="Escrever mensagem"
  ></button>


</div>


<!-- =====================================================
     SENHA
===================================================== -->

<div
  class="overlay hidden"
  id="passwordOverlay"
>

  <div class="modal">

    <h2>
      Teu aniversário
    </h2>

    <p>
      Para continuar, digite a data
      somente com números.
    </p>

    <input
      id="passwordInput"
      type="password"
      inputmode="numeric"
      maxlength="8"
      placeholder="DDMMAAAA"
      autocomplete="off"
    >

    <div>

      <button
        id="unlockButton"
      >
        abrir
      </button>

      <button
        class="secondary"
        id="cancelPassword"
      >
        cancelar
      </button>

    </div>

    <p
      class="error"
      id="passwordError"
    ></p>

  </div>

</div>


<!-- =====================================================
     CARTA
===================================================== -->

<div
  class="letter-overlay hidden"
  id="letterOverlay"
>


  <button
    class="close-button"
    id="closeLetter"
    aria-label="Fechar carta"
  >
    ×
  </button>


  <div class="letter">


    <!-- ================================================
         PÁGINA 1
    ================================================= -->

    <img
      class="letter-page active"
      src="assets/page-1.png"
      alt="Página 1 da carta"
    >


    <!-- ================================================
         PÁGINA 2
    ================================================= -->

    <img
      class="letter-page"
      src="assets/page-2.png"
      alt="Página 2 da carta"
    >


    <!-- ================================================
         PÁGINA 3
    ================================================= -->

    <img
      class="letter-page"
      src="assets/page-3.png"
      alt="Página 3 da carta"
    >


    <!-- ================================================
         PÁGINA 4
    ================================================= -->

    <img
      class="letter-page"
      src="assets/page-4.png"
      alt="Página 4 da carta"
    >


    <!-- ================================================
         CONTROLES
    ================================================= -->

    <div class="letter-controls">


      <button
        id="previousPage"
        aria-label="Página anterior"
      >
        ←
      </button>


      <span
        class="page-number"
        id="pageNumber"
      >
        1 / 4
      </span>


      <button
        id="nextPage"
        aria-label="Próxima página"
      >
        →
      </button>


    </div>


    <!-- ================================================
         AVISO DA ÚLTIMA PÁGINA
    ================================================= -->

    <div
      class="last-note hidden"
      id="lastNote"
    >
      Deixe uma mensagem ou comentário na caneta encima da mesa
    </div>


  </div>

</div>


<!-- =====================================================
     MENSAGENS
===================================================== -->

<div
  class="messages-overlay hidden"
  id="messagesOverlay"
>


  <div class="paper">


    <button
      class="archive-button"
      id="archiveButton"
    >
      folhas anteriores
    </button>


    <button
      class="messages-close"
      id="closeMessages"
      aria-label="Fechar mensagens"
    >
      ×
    </button>


    <h1>

      if u have something to say,<br>
      say it here.

    </h1>


    <div
      class="messages"
      id="messages"
    ></div>


    <div class="message-form">


      <input
        id="nameInput"
        maxlength="80"
        placeholder="teu nome"
      >


      <textarea
        id="messageInput"
        maxlength="2000"
        placeholder="escreva aqui..."
      ></textarea>


      <button
        id="sendButton"
      >
        enviar
      </button>


    </div>


  </div>

</div>


<!-- =====================================================
     ARQUIVO DE FOLHAS
===================================================== -->

<div
  class="archive hidden"
  id="archive"
>


  <button
    class="archive-close"
    id="closeArchive"
  >
    fechar
  </button>


  <h2>
    folhas anteriores
  </h2>


  <div
    class="archive-list"
    id="archiveList"
  ></div>


</div>


</div>


<script>

/* =========================================================
   CONFIGURAÇÕES
========================================================= */


/*
   SENHA DO LIVRO E DA CANETA
*/

const PASSWORD = "25102008";


/*
   URL DO GOOGLE APPS SCRIPT

   Se você já criou o Apps Script,
   mantenha a URL correta aqui.
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbz7mUY2SZA9sdeXLLVdheKYA4rVh7AbnDojfyLPxEXy204IGUwnARLYkXhh7pr7DWCcaw/exec";


/*
   Quantidade de mensagens por folha.
*/

const MESSAGES_PER_SHEET = 6;


/* =========================================================
   ELEMENTOS
========================================================= */

const loading =
document.getElementById("loading");

const book =
document.getElementById("book");

const pen =
document.getElementById("pen");

const passwordOverlay =
document.getElementById("passwordOverlay");

const passwordInput =
document.getElementById("passwordInput");

const passwordError =
document.getElementById("passwordError");

const unlockButton =
document.getElementById("unlockButton");

const cancelPassword =
document.getElementById("cancelPassword");

const letterOverlay =
document.getElementById("letterOverlay");

const closeLetter =
document.getElementById("closeLetter");

const pages =
document.querySelectorAll(".letter-page");

const previousPage =
document.getElementById("previousPage");

const nextPage =
document.getElementById("nextPage");

const pageNumber =
document.getElementById("pageNumber");

const lastNote =
document.getElementById("lastNote");

const messagesOverlay =
document.getElementById("messagesOverlay");

const closeMessages =
document.getElementById("closeMessages");

const messagesContainer =
document.getElementById("messages");

const nameInput =
document.getElementById("nameInput");

const messageInput =
document.getElementById("messageInput");

const sendButton =
document.getElementById("sendButton");

const archiveButton =
document.getElementById("archiveButton");

const archive =
document.getElementById("archive");

const archiveList =
document.getElementById("archiveList");

const closeArchive =
document.getElementById("closeArchive");


/* =========================================================
   ESTADO
========================================================= */

let unlocked = false;

let currentPage = 0;

let allMessages = [];

let currentMessageSheet = 0;


/* =========================================================
   CARREGAMENTO
========================================================= */

window.addEventListener(
  "load",
  function() {

    setTimeout(
      function() {

        loading.classList.add("hidden");

      },
      5000
    );

  }
);


/* =========================================================
   ABRIR LIVRO
========================================================= */

book.addEventListener(
  "click",
  function() {

    if (!unlocked) {

      abrirSenha();

      return;

    }

    abrirCarta();

  }
);


/* =========================================================
   ABRIR CANETA
========================================================= */

pen.addEventListener(
  "click",
  function() {

    if (!unlocked) {

      abrirSenha();

      return;

    }

    abrirMensagens();

  }
);


/* =========================================================
   SENHA
========================================================= */

function abrirSenha() {

  passwordOverlay
    .classList
    .remove("hidden");

  passwordError.textContent = "";

  passwordInput.value = "";

  setTimeout(
    function() {

      passwordInput.focus();

    },
    100
  );

}


unlockButton.addEventListener(
  "click",
  verificarSenha
);


passwordInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      verificarSenha();

    }

  }
);


function verificarSenha() {

  const value =
    passwordInput.value.trim();


  if (value === PASSWORD) {

    unlocked = true;

    passwordOverlay
      .classList
      .add("hidden");

    passwordInput.value = "";

    passwordError.textContent = "";

    abrirCarta();

  } else {

    passwordError.textContent =
      "A senha não está correta.";

    passwordInput.select();

  }

}


cancelPassword.addEventListener(
  "click",
  function() {

    passwordOverlay
      .classList
      .add("hidden");

    passwordInput.value = "";

    passwordError.textContent = "";

  }
);


/* =========================================================
   CARTA
========================================================= */

function abrirCarta() {

  currentPage = 0;

  atualizarPagina();

  letterOverlay
    .classList
    .remove("hidden");

}


function atualizarPagina() {

  pages.forEach(
    function(page, index) {

      page.classList.toggle(
        "active",
        index === currentPage
      );

    }
  );


  pageNumber.textContent =
    `${currentPage + 1} / ${pages.length}`;


  previousPage.disabled =
    currentPage === 0;


  nextPage.disabled =
    currentPage === pages.length - 1;


  if (
    currentPage === pages.length - 1
  ) {

    lastNote
      .classList
      .remove("hidden");

  } else {

    lastNote
      .classList
      .add("hidden");

  }

}


/* =========================================================
   PÁGINA ANTERIOR
========================================================= */

previousPage.addEventListener(
  "click",
  function() {

    if (currentPage > 0) {

      currentPage--;

      atualizarPagina();

    }

  }
);


/* =========================================================
   PRÓXIMA PÁGINA
========================================================= */

nextPage.addEventListener(
  "click",
  function() {

    if (
      currentPage <
      pages.length - 1
    ) {

      currentPage++;

      atualizarPagina();

    }

  }
);


/* =========================================================
   FECHAR CARTA
========================================================= */

closeLetter.addEventListener(
  "click",
  function() {

    letterOverlay
      .classList
      .add("hidden");

  }
);


/* =========================================================
   ABRIR MENSAGENS
========================================================= */

async function abrirMensagens() {

  messagesOverlay
    .classList
    .remove("hidden");

  await carregarMensagens();

}


/* =========================================================
   FECHAR MENSAGENS
========================================================= */

closeMessages.addEventListener(
  "click",
  function() {

    messagesOverlay
      .classList
      .add("hidden");

  }
);


/* =========================================================
   CARREGAR MENSAGENS
========================================================= */

async function carregarMensagens() {

  try {

    const response =
      await fetch(
        API_URL +
        "?action=messages&time=" +
        Date.now()
      );


    const data =
      await response.json();


    if (
      data.success &&
      Array.isArray(data.messages)
    ) {

      allMessages =
        data.messages;

    } else {

      allMessages = [];

    }

  } catch (error) {

    console.error(
      "Erro ao carregar mensagens:",
      error
    );

    allMessages = [];

  }


  renderizarFolhaAtual();

}


/* =========================================================
   ORGANIZAR FOLHAS
========================================================= */

function obterFolhas() {

  const sheets = [];


  for (
    let i = 0;
    i < allMessages.length;
    i += MESSAGES_PER_SHEET
  ) {

    sheets.push(
      allMessages.slice(
        i,
        i + MESSAGES_PER_SHEET
      )
    );

  }


  if (sheets.length === 0) {

    sheets.push([]);

  }


  return sheets;

}


/* =========================================================
   RENDERIZAR FOLHA ATUAL
========================================================= */

function renderizarFolhaAtual() {

  const sheets =
    obterFolhas();


  currentMessageSheet =
    sheets.length - 1;


  renderizarSheet(
    currentMessageSheet
  );


  atualizarArquivo(
    sheets
  );

}


/* =========================================================
   RENDERIZAR FOLHA
========================================================= */

function renderizarSheet(index) {

  const sheets =
    obterFolhas();


  const sheet =
    sheets[index] || [];


  messagesContainer.innerHTML =
    "";


  if (sheet.length === 0) {

    const empty =
      document.createElement("div");


    empty.style.cssText =
      `
        text-align:center;
        margin-top:100px;
        opacity:.45;
        font-family:Georgia,serif;
      `;


    empty.textContent =
      "ainda não há mensagens.";


    messagesContainer.appendChild(
      empty
    );


    return;

  }


  sheet.forEach(
    function(item) {

      const wrapper =
        document.createElement("div");


      wrapper.className =
        "message";


      const rotation =
        (
          Math.random() * 2 - 1
        ).toFixed(2);


      wrapper.style.setProperty(
        "--rotation",
        rotation + "deg"
      );


      const name =
        document.createElement("div");


      name.className =
        "message-name";


      name.textContent =
        item.name || "";


      const text =
        document.createElement("div");


      text.className =
        "message-text";


      text.textContent =
        item.message || "";


      const date =
        document.createElement("div");


      date.className =
        "message-date";


      date.textContent =
        formatarData(
          item.timestamp
        );


      wrapper.appendChild(name);

      wrapper.appendChild(text);

      wrapper.appendChild(date);


      messagesContainer.appendChild(
        wrapper
      );

    }
  );

}


/* =========================================================
   ARQUIVO
========================================================= */

function atualizarArquivo(sheets) {

  archiveList.innerHTML =
    "";


  const oldSheets =
    sheets.length - 1;


  if (oldSheets <= 0) {

    const text =
      document.createElement("p");


    text.style.opacity =
      ".6";


    text.textContent =
      "Ainda não existem folhas anteriores.";


    archiveList.appendChild(
      text
    );


    return;

  }


  for (
    let i = oldSheets - 1;
    i >= 0;
    i--
  ) {

    const button =
      document.createElement("button");


    button.textContent =
      `folha ${i + 1}`;


    button.addEventListener(
      "click",
      function() {

        currentMessageSheet =
          i;


        renderizarSheet(i);


        archive.classList.add(
          "hidden"
        );

      }
    );


    archiveList.appendChild(
      button
    );

  }

}


/* =========================================================
   ABRIR ARQUIVO
========================================================= */

archiveButton.addEventListener(
  "click",
  function() {

    const sheets =
      obterFolhas();


    atualizarArquivo(
      sheets
    );


    archive.classList
      .remove("hidden");

  }
);


/* =========================================================
   FECHAR ARQUIVO
========================================================= */

closeArchive.addEventListener(
  "click",
  function() {

    archive.classList
      .add("hidden");

  }
);


/* =========================================================
   ENVIAR MENSAGEM
========================================================= */

sendButton.addEventListener(
  "click",
  enviarMensagem
);


messageInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      enviarMensagem();

    }

  }
);


async function enviarMensagem() {

  const name =
    nameInput.value.trim();


  const message =
    messageInput.value.trim();


  if (!name) {

    alert(
      "Antes de enviar, coloque seu nome."
    );

    nameInput.focus();

    return;

  }


  if (!message) {

    alert(
      "Escreva uma mensagem."
    );

    messageInput.focus();

    return;

  }


  sendButton.disabled =
    true;


  sendButton.textContent =
    "enviando...";


  try {

    const response =
      await fetch(
        API_URL,
        {

          method:
            "POST",

          headers:
            {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

          body:
            JSON.stringify({
              name:
                name,

              message:
                message
            })

        }
      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.error ||
        "Erro ao salvar."
      );

    }


    nameInput.value =
      "";

    messageInput.value =
      "";


    await carregarMensagens();


    alert(
      "Mensagem guardada."
    );


  } catch (error) {

    console.error(
      "Erro ao enviar:",
      error
    );


    alert(
      "Não foi possível salvar a mensagem. Verifique o Google Apps Script."
    );

  }


  sendButton.disabled =
    false;


  sendButton.textContent =
    "enviar";

}


/* =========================================================
   DATA
========================================================= */

function formatarData(value) {

  if (!value) {

    return "";

  }


  try {

    const date =
      new Date(value);


    return date.toLocaleString(
      "pt-BR",
      {
        day:
          "2-digit",

        month:
          "2-digit",

        year:
          "numeric",

        hour:
          "2-digit",

        minute:
          "2-digit"
      }
    );

  } catch {

    return "";

  }

}


/* =========================================================
   TECLA ESC
========================================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key !== "Escape"
    ) {

      return;

    }


    passwordOverlay
      .classList
      .add("hidden");


    letterOverlay
      .classList
      .add("hidden");


    messagesOverlay
      .classList
      .add("hidden");


    archive
      .classList
      .add("hidden");

  }
);


</script>

</body>

</html>
