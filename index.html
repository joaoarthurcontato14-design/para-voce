<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#283b54"
>

<title>para você.</title>


<style>

/* =========================================================
   CONFIGURAÇÕES GERAIS
========================================================= */

:root {

  --blue: #283b54;
  --blue-dark: #1c2a3d;

  --paper: #f7f4ec;
  --paper-dark: #ebe6d9;

  --ink: #252525;

  --white: #ffffff;

}


* {

  box-sizing: border-box;

  margin: 0;
  padding: 0;

}


html,
body {

  width: 100%;
  height: 100%;

  overflow: hidden;

}


body {

  background: var(--blue);

  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

}


/* =========================================================
   APLICAÇÃO
========================================================= */

#app {

  width: 100vw;
  height: 100vh;

  position: relative;

  overflow: hidden;

}


/* =========================================================
   CARREGAMENTO
========================================================= */

.loading {

  position: fixed;

  inset: 0;

  z-index: 9999;

  background: var(--blue);

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;

}


.loader-title {

  font-family: Georgia, serif;

  font-size: clamp(22px, 4vw, 36px);

  letter-spacing: .5px;

  animation: fadeIn 1.4s ease forwards;

}


.loader-sub {

  margin-top: 12px;

  font-size: 13px;

  opacity: .65;

  animation: fadeIn 2s ease forwards;

}


.loader-line {

  width: 90px;

  height: 1px;

  background: rgba(255,255,255,.65);

  margin-top: 25px;

  transform-origin: left;

  animation: loadingLine 5s linear forwards;

}


@keyframes loadingLine {

  from {
    transform: scaleX(0);
  }

  to {
    transform: scaleX(1);
  }

}


@keyframes fadeIn {

  from {
    opacity: 0;
    transform: translateY(6px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}


.hidden {

  display: none !important;

}


/* =========================================================
   INTERFACE PRINCIPAL
========================================================= */

.scene {

  position: absolute;

  inset: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  background: var(--blue);

}


/*
   A interface inteira é mantida na proporção
   da imagem para que os objetos não saiam
   do lugar em diferentes telas.
*/

.interface {

  position: relative;

  width: min(100vw, 177.78vh);

  aspect-ratio: 16 / 9;

  max-height: 100vh;

}


.interface-image {

  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: contain;

  display: block;

  user-select: none;

  -webkit-user-drag: none;

}


/* =========================================================
   ÁREAS CLICÁVEIS
========================================================= */

.hotspot {

  position: absolute;

  border: none;

  padding: 0;

  background: transparent;

  cursor: pointer;

  z-index: 20;

}


.hotspot:hover {

  background: rgba(255,255,255,.025);

}


/* =========================================================
   GLOBO
========================================================= */

.globe-hotspot {

  left: 8%;
  top: 18%;

  width: 21%;
  height: 34%;

}


/* =========================================================
   CALENDÁRIO
========================================================= */

.calendar-hotspot {

  right: 8%;
  top: 12%;

  width: 17%;
  height: 18%;

}


/* =========================================================
   CADILLAC
========================================================= */

.car-hotspot {

  right: 8%;
  bottom: 14%;

  width: 23%;
  height: 20%;

}


/* =========================================================
   LIVRO
========================================================= */

.book-hotspot {

  left: 50%;
  top: 50%;

  width: 27%;
  height: 48%;

  transform:
    translate(-50%, -50%)
    rotate(-2deg);

}


/* =========================================================
   CANETA
========================================================= */

/*
   BOTÃO DA CANETA REDUZIDO.

   Antes ele estava grande demais.
   Agora a área clicável é menor e mais
   concentrada no corpo real da caneta.
*/

.pen-hotspot {

  right: 22.8%;
  bottom: 19.5%;

  width: 15%;
  height: 5.5%;

  transform: rotate(-25deg);

}


/* =========================================================
   MODAL DE SENHA
========================================================= */

.overlay {

  position: fixed;

  inset: 0;

  z-index: 500;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

  background:
    rgba(10,18,28,.88);

  backdrop-filter:
    blur(12px);

}


.modal {

  width:
    min(430px, 92vw);

  background:
    rgba(247,244,236,.98);

  color:
    #202020;

  border-radius:
    24px;

  padding:
    35px;

  text-align:
    center;

  box-shadow:
    0 30px 80px
    rgba(0,0,0,.45);

}


.modal h2 {

  font-family:
    Georgia,
    serif;

  margin-bottom:
    10px;

}


.modal p {

  color:
    #666;

  line-height:
    1.5;

  margin-bottom:
    22px;

}


.modal input {

  width: 100%;

  border:
    1px solid #d5d0c5;

  background:
    #fffdf8;

  color:
    #222;

  border-radius:
    14px;

  padding:
    15px;

  font-size:
    16px;

  outline:
    none;

  margin-bottom:
    14px;

  text-align:
    center;

}


.modal input:focus {

  border-color:
    var(--blue);

}


button {

  border: none;

  border-radius: 999px;

  padding: 13px 22px;

  cursor: pointer;

  background: var(--blue);

  color: white;

  font-size: 15px;

  transition: .2s ease;

}


button:hover {

  transform: translateY(-2px);

  opacity: .9;

}


button:disabled {

  opacity: .4;

  cursor: default;

  transform: none;

}


.secondary {

  background: transparent;

  color: #303030;

  border: 1px solid #ccc5b7;

  margin-left: 8px;

}


.error {

  color: #9b3d3d !important;

  margin-top: 14px;

  margin-bottom: 0 !important;

}


/* =========================================================
   CARTA
========================================================= */

.letter-overlay {

  position: fixed;

  inset: 0;

  z-index: 600;

  background:
    rgba(24,37,54,.97);

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 25px;

}


/*
   IMPORTANTE:

   A carta agora usa quase toda a área disponível,
   mas SEM ultrapassar a altura da tela.

   Isso impede que a página fique cortada.
*/

.letter {

  position: relative;

  width: min(92vw, 900px);

  height: min(88vh, 850px);

  display: flex;

  align-items: center;

  justify-content: center;

}


.letter-page {

  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  /*
     A imagem nunca ultrapassa a caixa.
  */

  width: auto;

  height: auto;

  max-width: 100%;

  max-height: 100%;

  object-fit: contain;

  display: none;

  background: white;

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.55);

}


.letter-page.active {

  display: block;

}


/* =========================================================
   BOTÃO FECHAR CARTA
========================================================= */

.close-button {

  position: fixed;

  top: 20px;

  right: 20px;

  z-index: 700;

  width: 42px;
  height: 42px;

  padding: 0;

  border-radius: 50%;

  background:
    rgba(0,0,0,.65);

  font-size: 22px;

}


/* =========================================================
   CONTROLES DA CARTA
========================================================= */

.letter-controls {

  position: fixed;

  left: 50%;

  bottom: 22px;

  transform:
    translateX(-50%);

  display: flex;

  align-items: center;

  gap: 10px;

  padding: 8px;

  border-radius: 999px;

  background:
    rgba(0,0,0,.75);

  z-index: 700;

}


.letter-controls button {

  width: 38px;
  height: 38px;

  padding: 0;

  display: flex;

  align-items: center;

  justify-content: center;

}


.page-number {

  min-width: 58px;

  text-align: center;

  font-size: 13px;

  color: white;

}


/* =========================================================
   ÚLTIMA PÁGINA
========================================================= */

.last-note {

  position: fixed;

  left: 50%;

  bottom: 85px;

  transform:
    translateX(-50%);

  background:
    rgba(40,59,84,.96);

  color: white;

  padding:
    12px 18px;

  border-radius:
    999px;

  font-size:
    13px;

  text-align:
    center;

  z-index: 700;

  max-width:
    calc(100vw - 40px);

}


/* =========================================================
   MENSAGENS
========================================================= */

.messages-overlay {

  position: fixed;

  inset: 0;

  z-index: 800;

  background:
    var(--blue);

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

}


.paper {

  position: relative;

  width: min(900px, 94vw);

  height: min(82vh, 850px);

  background:
    var(--paper);

  color:
    var(--ink);

  padding:
    50px;

  box-shadow:
    0 30px 90px
    rgba(0,0,0,.45);

}


.paper h1 {

  text-align: center;

  font-family: Georgia, serif;

  font-size: 22px;

  margin-bottom: 25px;

}


.messages {

  height:
    calc(100% - 150px);

  overflow: hidden;

}


.message {

  font-family:
    "Segoe Print",
    "Bradley Hand",
    "Comic Sans MS",
    cursive;

  margin-bottom: 20px;

  line-height: 1.45;

}


.message-name {

  font-weight: bold;

}


.message-text {

  white-space: pre-wrap;

}


.message-date {

  font-family: sans-serif;

  font-size: 10px;

  opacity: .45;

  margin-top: 3px;

}


.message-form {

  position: absolute;

  left: 50%;

  bottom: 18px;

  transform:
    translateX(-50%);

  width: calc(100% - 50px);

  display: flex;

  gap: 8px;

}


.message-form input,
.message-form textarea {

  border:
    1px solid #d5d0c5;

  background:
    #fffdf8;

  border-radius:
    12px;

  padding:
    12px;

}


.message-form input {

  width: 22%;

}


.message-form textarea {

  width: 58%;

  min-height: 45px;

  resize: none;

}


.archive-button {

  position: absolute;

  left: 20px;

  top: 20px;

}


.messages-close {

  position: absolute;

  right: 20px;

  top: 20px;

  width: 40px;
  height: 40px;

  padding: 0;

  border-radius: 50%;

}


/* =========================================================
   ARQUIVO
========================================================= */

.archive {

  position: fixed;

  inset: 0;

  z-index: 900;

  background:
    rgba(24,37,54,.98);

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  padding: 25px;

}


.archive h2 {

  font-family: Georgia, serif;

  margin-bottom: 20px;

}


.archive-list {

  display: flex;

  flex-wrap: wrap;

  justify-content: center;

  gap: 10px;

}


.archive-list button {

  background:
    var(--paper);

  color:
    #222;

}


.archive-close {

  position: absolute;

  right: 20px;

  top: 20px;

}


/* =========================================================
   CELULAR
========================================================= */

@media (max-width: 700px) {


  /*
     A interface permanece inteira visível.
  */

  .interface {

    width: 100vw;

    height: auto;

    aspect-ratio: 16 / 9;

  }


  /*
     CARTA NO CELULAR

     Aumentamos a área disponível verticalmente
     sem deixar a imagem sair da tela.
  */

  .letter-overlay {

    padding:
      65px 12px 75px;

  }


  .letter {

    width: 96vw;

    height: 76vh;

  }


  .letter-page {

    max-width: 96vw;

    max-height: 76vh;

  }


  .letter-controls {

    bottom: 14px;

  }


  .last-note {

    bottom: 68px;

    font-size: 12px;

    padding:
      10px 14px;

  }


  /*
     BOTÃO DA CANETA NO CELULAR

     Menor e mais preciso.
  */

  .pen-hotspot {

    right: 22%;

    bottom: 19%;

    width: 14%;

    height: 5%;

  }


  .paper {

    width: 94vw;

    height: 88vh;

    padding:
      40px 22px;

  }


  .message-form {

    width:
      calc(100% - 30px);

    flex-wrap:
      wrap;

  }


  .message-form input {

    width: 35%;

  }


  .message-form textarea {

    width: 55%;

  }


}


/* =========================================================
   CELULARES MUITO PEQUENOS
========================================================= */

@media (max-width: 400px) {


  .letter {

    width: 97vw;

    height: 73vh;

  }


  .letter-page {

    max-width: 97vw;

    max-height: 73vh;

  }


  .letter-controls {

    bottom: 10px;

  }


  .letter-controls button {

    width: 34px;

    height: 34px;

  }


  .page-number {

    min-width: 50px;

    font-size: 12px;

  }

}

</style>

</head>


<body>


<div id="app">


<!-- =====================================================
     CARREGAMENTO
===================================================== -->

<div
  class="loading"
  id="loading"
>

  <div class="loader-title">
    Um Ano Depois...
  </div>

  <div class="loader-sub">
    Feito por João Arthur.
  </div>

  <div class="loader-line"></div>

</div>


<!-- =====================================================
     CENA PRINCIPAL
===================================================== -->

<div class="scene">

  <div class="interface">

    <img
      class="interface-image"
      src="assets/interface.png"
      alt="Mesa com livro, globo, calendário, Cadillac e caneta"
    >


    <!-- GLOBO -->

    <button
      class="hotspot globe-hotspot"
      id="globeHotspot"
      aria-label="Globo"
    ></button>


    <!-- CALENDÁRIO -->

    <button
      class="hotspot calendar-hotspot"
      id="calendarHotspot"
      aria-label="Calendário"
    ></button>


    <!-- CADILLAC -->

    <button
      class="hotspot car-hotspot"
      id="carHotspot"
      aria-label="Cadillac"
    ></button>


    <!-- LIVRO -->

    <button
      class="hotspot book-hotspot"
      id="book"
      aria-label="Abrir carta"
    ></button>


    <!-- CANETA -->

    <button
      class="hotspot pen-hotspot"
      id="pen"
      aria-label="Escrever mensagem"
    ></button>

  </div>

</div>


<!-- =====================================================
     SENHA
===================================================== -->

<div
  class="overlay hidden"
  id="passwordOverlay"
>

  <div class="modal">

    <h2>
      Teu aniversário
    </h2>

    <p>
      Para continuar, digite a data
      somente com números.
    </p>

    <input
      id="passwordInput"
      type="password"
      inputmode="numeric"
      maxlength="8"
      placeholder="DDMMAAAA"
      autocomplete="off"
    >

    <div>

      <button id="unlockButton">
        abrir
      </button>

      <button
        class="secondary"
        id="cancelPassword"
      >
        cancelar
      </button>

    </div>

    <p
      class="error"
      id="passwordError"
    ></p>

  </div>

</div>


<!-- =====================================================
     CARTA
===================================================== -->

<div
  class="letter-overlay hidden"
  id="letterOverlay"
>


  <button
    class="close-button"
    id="closeLetter"
    aria-label="Fechar carta"
  >
    ×
  </button>


  <div class="letter">


    <!-- PÁGINA 1 -->

    <img
      class="letter-page active"
      src="assets/letter/page-1.png"
      alt="Página 1 da carta"
    >


    <!-- PÁGINA 2 -->

    <img
      class="letter-page"
      src="assets/letter/page-2.png"
      alt="Página 2 da carta"
    >


    <!-- PÁGINA 3 -->

    <img
      class="letter-page"
      src="assets/letter/page-3.png"
      alt="Página 3 da carta"
    >


    <!-- PÁGINA 4 -->

    <img
      class="letter-page"
      src="assets/letter/page-4.png"
      alt="Página 4 da carta"
    >


  </div>


  <!-- CONTROLES -->

  <div class="letter-controls">

    <button
      id="previousPage"
      aria-label="Página anterior"
    >
      ←
    </button>

    <span
      class="page-number"
      id="pageNumber"
    >
      1 / 4
    </span>

    <button
      id="nextPage"
      aria-label="Próxima página"
    >
      →
    </button>

  </div>


  <!-- ÚLTIMA PÁGINA -->

  <div
    class="last-note hidden"
    id="lastNote"
  >
    Deixe uma mensagem ou comentário na caneta encima da mesa
  </div>


</div>


<!-- =====================================================
     MENSAGENS
===================================================== -->

<div
  class="messages-overlay hidden"
  id="messagesOverlay"
>

  <div class="paper">


    <button
      class="archive-button"
      id="archiveButton"
    >
      folhas anteriores
    </button>


    <button
      class="messages-close"
      id="closeMessages"
      aria-label="Fechar mensagens"
    >
      ×
    </button>


    <h1>

      if u have something to say,<br>
      say it here.

    </h1>


    <div
      class="messages"
      id="messages"
    ></div>


    <div class="message-form">

      <input
        id="nameInput"
        maxlength="80"
        placeholder="teu nome"
      >

      <textarea
        id="messageInput"
        maxlength="2000"
        placeholder="escreva aqui..."
      ></textarea>

      <button
        id="sendButton"
      >
        enviar
      </button>

    </div>


  </div>

</div>


<!-- =====================================================
     ARQUIVO
===================================================== -->

<div
  class="archive hidden"
  id="archive"
>

  <button
    class="archive-close"
    id="closeArchive"
  >
    fechar
  </button>

  <h2>
    folhas anteriores
  </h2>

  <div
    class="archive-list"
    id="archiveList"
  ></div>

</div>


</div>


<script>

/* =========================================================
   CONFIGURAÇÕES
========================================================= */

const PASSWORD = "25102008";


const API_URL =
"https://script.google.com/macros/s/AKfycbz7mUY2SZA9sdeXLLVdheKYA4rVh7AbnDojfyLPxEXy204IGUwnARLYkXhh7pr7DWCcaw/exec";


const MESSAGES_PER_SHEET = 6;


/* =========================================================
   ELEMENTOS
========================================================= */

const loading =
  document.getElementById("loading");

const book =
  document.getElementById("book");

const pen =
  document.getElementById("pen");

const passwordOverlay =
  document.getElementById("passwordOverlay");

const passwordInput =
  document.getElementById("passwordInput");

const passwordError =
  document.getElementById("passwordError");

const unlockButton =
  document.getElementById("unlockButton");

const cancelPassword =
  document.getElementById("cancelPassword");

const letterOverlay =
  document.getElementById("letterOverlay");

const closeLetter =
  document.getElementById("closeLetter");

const pages =
  document.querySelectorAll(".letter-page");

const previousPage =
  document.getElementById("previousPage");

const nextPage =
  document.getElementById("nextPage");

const pageNumber =
  document.getElementById("pageNumber");

const lastNote =
  document.getElementById("lastNote");

const messagesOverlay =
  document.getElementById("messagesOverlay");

const closeMessages =
  document.getElementById("closeMessages");

const messagesContainer =
  document.getElementById("messages");

const nameInput =
  document.getElementById("nameInput");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const archiveButton =
  document.getElementById("archiveButton");

const archive =
  document.getElementById("archive");

const archiveList =
  document.getElementById("archiveList");

const closeArchive =
  document.getElementById("closeArchive");


/* =========================================================
   ESTADO
========================================================= */

let unlocked = false;

let currentPage = 0;

let allMessages = [];

let currentMessageSheet = 0;


/* =========================================================
   CARREGAMENTO
========================================================= */

window.addEventListener(
  "load",
  function() {

    setTimeout(
      function() {

        loading.classList.add("hidden");

      },
      5000
    );

  }
);


/* =========================================================
   LIVRO
========================================================= */

book.addEventListener(
  "click",
  function() {

    if (!unlocked) {

      passwordOverlay.classList.remove(
        "hidden"
      );

      passwordInput.focus();

      return;

    }

    abrirCarta();

  }
);


/* =========================================================
   CANETA
========================================================= */

pen.addEventListener(
  "click",
  function() {

    if (!unlocked) {

      passwordOverlay.classList.remove(
        "hidden"
      );

      passwordInput.focus();

      return;

    }

    abrirMensagens();

  }
);


/* =========================================================
   SENHA
========================================================= */

unlockButton.addEventListener(
  "click",
  verificarSenha
);


passwordInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      verificarSenha();

    }

  }
);


function verificarSenha() {

  const value =
    passwordInput.value.trim();


  if (value === PASSWORD) {

    unlocked = true;

    passwordOverlay.classList.add(
      "hidden"
    );

    passwordInput.value = "";

    passwordError.textContent = "";

    abrirCarta();

  } else {

    passwordError.textContent =
      "A senha não está correta.";

    passwordInput.select();

  }

}


cancelPassword.addEventListener(
  "click",
  function() {

    passwordOverlay.classList.add(
      "hidden"
    );

    passwordInput.value = "";

    passwordError.textContent = "";

  }
);


/* =========================================================
   CARTA
========================================================= */

function abrirCarta() {

  currentPage = 0;

  atualizarPagina();

  letterOverlay.classList.remove(
    "hidden"
  );

}


function atualizarPagina() {

  pages.forEach(
    function(page, index) {

      page.classList.toggle(
        "active",
        index === currentPage
      );

    }
  );


  pageNumber.textContent =
    `${currentPage + 1} / ${pages.length}`;


  previousPage.disabled =
    currentPage === 0;


  nextPage.disabled =
    currentPage === pages.length - 1;


  if (
    currentPage ===
    pages.length - 1
  ) {

    lastNote.classList.remove(
      "hidden"
    );

  } else {

    lastNote.classList.add(
      "hidden"
    );

  }

}


/* =========================================================
   PÁGINA ANTERIOR
========================================================= */

previousPage.addEventListener(
  "click",
  function() {

    if (currentPage > 0) {

      currentPage--;

      atualizarPagina();

    }

  }
);


/* =========================================================
   PRÓXIMA PÁGINA
========================================================= */

nextPage.addEventListener(
  "click",
  function() {

    if (
      currentPage <
      pages.length - 1
    ) {

      currentPage++;

      atualizarPagina();

    }

  }
);


/* =========================================================
   FECHAR CARTA
========================================================= */

closeLetter.addEventListener(
  "click",
  function() {

    letterOverlay.classList.add(
      "hidden"
    );

  }
);


/* =========================================================
   MENSAGENS
========================================================= */

async function abrirMensagens() {

  messagesOverlay.classList.remove(
    "hidden"
  );

  await carregarMensagens();

}


closeMessages.addEventListener(
  "click",
  function() {

    messagesOverlay.classList.add(
      "hidden"
    );

  }
);


/* =========================================================
   CARREGAR MENSAGENS
========================================================= */

async function carregarMensagens() {

  try {

    const response =
      await fetch(
        API_URL +
        "?action=messages&time=" +
        Date.now()
      );


    const data =
      await response.json();


    if (
      data.success &&
      Array.isArray(data.messages)
    ) {

      allMessages =
        data.messages;

    } else {

      allMessages = [];

    }

  } catch (error) {

    console.error(error);

    allMessages = [];

  }


  renderizarFolhaAtual();

}


/* =========================================================
   FOLHAS
========================================================= */

function obterFolhas() {

  const sheets = [];


  for (
    let i = 0;
    i < allMessages.length;
    i += MESSAGES_PER_SHEET
  ) {

    sheets.push(
      allMessages.slice(
        i,
        i + MESSAGES_PER_SHEET
      )
    );

  }


  if (sheets.length === 0) {

    sheets.push([]);

  }


  return sheets;

}


/* =========================================================
   FOLHA ATUAL
========================================================= */

function renderizarFolhaAtual() {

  const sheets =
    obterFolhas();


  currentMessageSheet =
    sheets.length - 1;


  renderizarSheet(
    currentMessageSheet
  );


  atualizarArquivo(
    sheets
  );

}


/* =========================================================
   RENDERIZAR FOLHA
========================================================= */

function renderizarSheet(index) {

  const sheets =
    obterFolhas();


  const sheet =
    sheets[index] || [];


  messagesContainer.innerHTML = "";


  if (sheet.length === 0) {

    const empty =
      document.createElement("div");


    empty.style.cssText =
      `
      text-align:center;
      margin-top:100px;
      opacity:.45;
      font-family:Georgia,serif;
      `;


    empty.textContent =
      "ainda não há mensagens.";


    messagesContainer.appendChild(
      empty
    );


    return;

  }


  sheet.forEach(
    function(item) {

      const wrapper =
        document.createElement("div");


      wrapper.className =
        "message";


      const name =
        document.createElement("div");


      name.className =
        "message-name";


      name.textContent =
        item.name;


      const text =
        document.createElement("div");


      text.className =
        "message-text";


      text.textContent =
        item.message;


      const date =
        document.createElement("div");


      date.className =
        "message-date";


      date.textContent =
        formatarData(
          item.timestamp
        );


      wrapper.appendChild(name);

      wrapper.appendChild(text);

      wrapper.appendChild(date);


      messagesContainer.appendChild(
        wrapper
      );

    }
  );

}


/* =========================================================
   ARQUIVO
========================================================= */

function atualizarArquivo(sheets) {

  archiveList.innerHTML = "";


  const oldSheets =
    sheets.length - 1;


  if (oldSheets <= 0) {

    const text =
      document.createElement("p");


    text.style.opacity = ".6";


    text.textContent =
      "Ainda não existem folhas anteriores.";


    archiveList.appendChild(text);


    return;

  }


  for (
    let i = oldSheets - 1;
    i >= 0;
    i--
  ) {

    const button =
      document.createElement("button");


    button.textContent =
      `folha ${i + 1}`;


    button.addEventListener(
      "click",
      function() {

        currentMessageSheet = i;

        renderizarSheet(i);

        archive.classList.add(
          "hidden"
        );

      }
    );


    archiveList.appendChild(
      button
    );

  }

}


archiveButton.addEventListener(
  "click",
  function() {

    const sheets =
      obterFolhas();


    atualizarArquivo(
      sheets
    );


    archive.classList.remove(
      "hidden"
    );

  }
);


closeArchive.addEventListener(
  "click",
  function() {

    archive.classList.add(
      "hidden"
    );

  }
);


/* =========================================================
   ENVIAR MENSAGEM
========================================================= */

sendButton.addEventListener(
  "click",
  enviarMensagem
);


messageInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      enviarMensagem();

    }

  }
);


async function enviarMensagem() {

  const name =
    nameInput.value.trim();


  const message =
    messageInput.value.trim();


  if (!name) {

    alert(
      "Antes de enviar, coloque seu nome."
    );

    nameInput.focus();

    return;

  }


  if (!message) {

    alert(
      "Escreva uma mensagem."
    );

    messageInput.focus();

    return;

  }


  sendButton.disabled = true;

  sendButton.textContent =
    "enviando...";


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify({
              name: name,
              message: message
            })

        }
      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.error ||
        "Erro ao salvar."
      );

    }


    nameInput.value = "";

    messageInput.value = "";


    await carregarMensagens();


    alert(
      "Mensagem guardada."
    );


  } catch (error) {

    console.error(error);

    alert(
      "Não foi possível salvar a mensagem."
    );

  }


  sendButton.disabled = false;

  sendButton.textContent =
    "enviar";

}


/* =========================================================
   DATA
========================================================= */

function formatarData(value) {

  try {

    const date =
      new Date(value);


    return date.toLocaleString(
      "pt-BR",
      {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  } catch {

    return "";

  }

}


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Escape") {

      passwordOverlay.classList.add(
        "hidden"
      );

      letterOverlay.classList.add(
        "hidden"
      );

      messagesOverlay.classList.add(
        "hidden"
      );

      archive.classList.add(
        "hidden"
      );

    }

  }
);

</script>

</body>

</html>
