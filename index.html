<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>para você.</title>

<style>

/* =========================================================
   CONFIGURAÇÕES GERAIS
========================================================= */

:root {

  --blue: #283b54;
  --blue-dark: #1d2c40;

  --paper: #f7f4ec;
  --paper-dark: #ebe6d9;

  --ink: #252525;

  --white: #ffffff;

}


/* =========================================================
   RESET
========================================================= */

* {

  box-sizing: border-box;

  margin: 0;
  padding: 0;

}


html,
body {

  width: 100%;
  height: 100%;

  overflow: hidden;

}


body {

  background: var(--blue);

  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

}


/* =========================================================
   APLICAÇÃO
========================================================= */

#app {

  position: relative;

  width: 100vw;
  height: 100vh;

  overflow: hidden;

}


/* =========================================================
   TELA DE CARREGAMENTO
========================================================= */

.loading {

  position: fixed;

  inset: 0;

  z-index: 9999;

  background: var(--blue);

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  color: white;

  transition:
    opacity 1s ease,
    visibility 1s ease;

}


.loading.hidden {

  opacity: 0;

  visibility: hidden;

  pointer-events: none;

}


.loading-title {

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: clamp(28px, 5vw, 48px);

  letter-spacing: .04em;

  animation:
    loadingPulse 2s ease-in-out infinite;

}


.loading-subtitle {

  margin-top: 12px;

  font-size: 12px;

  letter-spacing: .18em;

  text-transform: uppercase;

  opacity: .55;

}


.loading-line {

  width: 90px;
  height: 1px;

  background: rgba(255,255,255,.55);

  margin-top: 28px;

  transform-origin: left;

  animation:
    loadingLine 2.5s ease-in-out infinite;

}


@keyframes loadingPulse {

  0%,
  100% {

    opacity: .55;

  }

  50% {

    opacity: 1;

  }

}


@keyframes loadingLine {

  0% {

    transform: scaleX(0);

  }

  50% {

    transform: scaleX(1);

  }

  100% {

    transform: scaleX(0);

  }

}


/* =========================================================
   INTERFACE PRINCIPAL
========================================================= */

.interface {

  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  background: var(--blue);

}


/* =========================================================
   IMAGEM PRINCIPAL DA MESA
========================================================= */

.interface-background {

  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  object-position: center center;

  display: block;

  z-index: 1;

  user-select: none;

  -webkit-user-drag: none;

}


/* =========================================================
   ÁREAS CLICÁVEIS
=========================================================

   IMPORTANTE:

   Esses elementos são INVISÍVEIS.

   Eles ficam sobre os objetos da imagem.

========================================================= */


/* -------------------------
   LIVRO
------------------------- */

.book-hotspot {

  position: absolute;

  z-index: 20;

  cursor: pointer;

  background: transparent;

  /*
     POSIÇÃO DO LIVRO
  */

  width: 25%;
  height: 42%;

  left: 37.5%;
  top: 28%;

  border-radius: 12px;

}


/* -------------------------
   CANETA
------------------------- */

.pen-hotspot {

  position: absolute;

  z-index: 21;

  cursor: pointer;

  background: transparent;

  /*
     POSIÇÃO DA CANETA
  */

  width: 20%;
  height: 9%;

  right: 20%;
  bottom: 17%;

  transform: rotate(-30deg);

  border-radius: 999px;

}


/*
   Durante o ajuste da caneta,
   você pode trocar transparent por:

   rgba(255,0,0,.25)

   para enxergar a área clicável.

   Depois volte para transparent.
*/


/* =========================================================
   MODAL
========================================================= */

.overlay {

  position: fixed;

  inset: 0;

  z-index: 1000;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 20px;

  background:
    rgba(12,21,32,.84);

  backdrop-filter:
    blur(14px);

  -webkit-backdrop-filter:
    blur(14px);

}


.modal {

  width: min(440px, 92vw);

  padding: 36px;

  background:
    rgba(247,244,236,.98);

  color: #222;

  border-radius: 24px;

  box-shadow:
    0 30px 80px rgba(0,0,0,.45);

  text-align: center;

  animation:
    modalIn .35s ease;

}


@keyframes modalIn {

  from {

    opacity: 0;

    transform:
      translateY(15px)
      scale(.97);

  }

  to {

    opacity: 1;

    transform:
      translateY(0)
      scale(1);

  }

}


.modal h2 {

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 25px;

  margin-bottom: 12px;

}


.modal p {

  color: #666;

  line-height: 1.5;

  margin-bottom: 24px;

}


input,
textarea {

  width: 100%;

  border:
    1px solid #d5d0c5;

  background:
    #fffdf8;

  color: #222;

  border-radius: 14px;

  padding: 14px 15px;

  font-size: 16px;

  font-family: inherit;

  outline: none;

}


input:focus,
textarea:focus {

  border-color:
    var(--blue);

  box-shadow:
    0 0 0 3px
    rgba(40,59,84,.08);

}


button {

  border: none;

  border-radius: 999px;

  padding: 13px 22px;

  cursor: pointer;

  background: var(--blue);

  color: white;

  font-size: 15px;

  font-family: inherit;

  transition:
    transform .2s ease,
    opacity .2s ease;

}


button:hover {

  transform:
    translateY(-2px);

  opacity: .9;

}


button:disabled {

  opacity: .5;

  cursor: default;

  transform: none;

}


.secondary {

  background: transparent;

  color: #303030;

  border:
    1px solid #ccc5b7;

  margin-left: 8px;

}


.hidden {

  display: none !important;

}


/* =========================================================
   CARTA
========================================================= */

.letter-overlay {

  position: fixed;

  inset: 0;

  z-index: 2000;

  background:
    rgba(24,37,54,.97);

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 18px;

}


.letter {

  position: relative;

  width: min(900px, 94vw);

  height: min(88vh, 900px);

  display: flex;

  align-items: center;
  justify-content: center;

  background: transparent;

  overflow: hidden;

}


/*
   A página sempre será reduzida
   para caber inteira dentro da tela.
*/

.letter-page {

  display: none;

  width: 100%;
  height: 100%;

  object-fit: contain;

  object-position: center center;

  background: white;

  user-select: none;

  -webkit-user-drag: none;

}


.letter-page.active {

  display: block;

}


/* =========================================================
   CONTROLES DA CARTA
========================================================= */

.letter-controls {

  position: absolute;

  left: 50%;
  bottom: 18px;

  transform:
    translateX(-50%);

  display: flex;

  align-items: center;

  gap: 10px;

  padding: 7px;

  background:
    rgba(0,0,0,.72);

  border-radius: 999px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.25);

}


.letter-controls button {

  width: 42px;
  height: 42px;

  padding: 0;

  display: flex;

  align-items: center;
  justify-content: center;

}


.page-number {

  min-width: 58px;

  text-align: center;

  color: white;

  font-size: 13px;

}


.letter-message {

  position: absolute;

  left: 50%;

  bottom: 76px;

  transform:
    translateX(-50%);

  padding:
    11px 18px;

  background:
    rgba(40,59,84,.95);

  color: white;

  border-radius: 999px;

  font-size: 13px;

  white-space: nowrap;

  box-shadow:
    0 10px 30px rgba(0,0,0,.25);

}


/* =========================================================
   FECHAR CARTA
========================================================= */

.close {

  position: absolute;

  top: 18px;
  right: 18px;

  z-index: 10;

  width: 42px;
  height: 42px;

  padding: 0;

  border-radius: 50%;

  background:
    rgba(0,0,0,.65);

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 22px;

}


/* =========================================================
   MENSAGENS
========================================================= */

.messages-overlay {

  position: fixed;

  inset: 0;

  z-index: 3000;

  background:
    rgba(24,37,54,.97);

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 18px;

}


.paper {

  position: relative;

  width: min(900px, 94vw);

  height: min(84vh, 850px);

  background:
    var(--paper);

  color:
    var(--ink);

  padding:
    50px;

  box-shadow:
    0 30px 90px
    rgba(0,0,0,.45);

  overflow: hidden;

  border-radius: 3px;

}


.paper::before {

  content: "";

  position: absolute;

  inset: 25px;

  border:
    1px solid
    rgba(50,50,50,.08);

  pointer-events: none;

}


.paper-title {

  position: relative;

  z-index: 2;

  text-align: center;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 22px;

  margin-bottom: 25px;

}


.messages {

  position: relative;

  height:
    calc(100% - 120px);

  overflow-y: auto;

  padding-right: 10px;

}


.messages::-webkit-scrollbar {

  width: 4px;

}


.messages::-webkit-scrollbar-thumb {

  background: rgba(0,0,0,.15);

  border-radius: 999px;

}


.message {

  font-family:
    "Segoe Print",
    "Bradley Hand",
    "Comic Sans MS",
    cursive;

  margin-bottom: 22px;

  line-height: 1.45;

  transform:
    rotate(var(--rotation));

}


.message-name {

  font-weight: bold;

  font-size: 17px;

}


.message-text {

  white-space: pre-wrap;

  font-size: 16px;

}


.message-date {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  font-size: 10px;

  opacity: .45;

  margin-top: 4px;

}


/* =========================================================
   FORMULÁRIO
========================================================= */

.message-form {

  position: absolute;

  left: 50%;

  bottom: 18px;

  transform:
    translateX(-50%);

  width: calc(100% - 100px);

  display: flex;

  gap: 8px;

}


.message-form input {

  margin: 0;

}


.message-form input:first-child {

  width: 28%;

}


.message-form input:nth-child(2) {

  width: 52%;

}


.message-form button {

  width: 20%;

}


/* =========================================================
   BOTÕES DAS MENSAGENS
========================================================= */

.archive-button {

  position: absolute;

  top: 20px;
  left: 20px;

  z-index: 5;

  background:
    rgba(40,59,84,.95);

}


.close-messages {

  position: absolute;

  top: 20px;
  right: 20px;

  z-index: 5;

  width: 40px;
  height: 40px;

  padding: 0;

  border-radius: 50%;

}


/* =========================================================
   ARQUIVO DE FOLHAS
========================================================= */

.archive {

  position: fixed;

  inset: 0;

  z-index: 4000;

  background:
    rgba(24,37,54,.98);

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  padding: 25px;

}


.archive h2 {

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  margin-bottom: 20px;

}


.archive-list {

  display: flex;

  gap: 10px;

  flex-wrap: wrap;

  justify-content: center;

  max-width: 700px;

}


.archive-list button {

  background:
    #f7f4ec;

  color:
    #222;

}


.archive-close {

  position: absolute;

  right: 20px;
  top: 20px;

}


/* =========================================================
   RESPONSIVO — CELULAR
========================================================= */

@media (max-width: 700px) {


  /* -------------------------
     INTERFACE
  ------------------------- */

  .interface-background {

    object-fit: cover;

  }


  /*
     Ajuste dos hotspots no celular.
  */

  .book-hotspot {

    width: 34%;

    height: 38%;

    left: 33%;

    top: 31%;

  }


  .pen-hotspot {

    width: 27%;

    height: 10%;

    right: 14%;

    bottom: 17%;

  }


  /* -------------------------
     MODAL
  ------------------------- */

  .modal {

    padding: 28px 22px;

    border-radius: 20px;

  }


  .modal h2 {

    font-size: 23px;

  }


  /* -------------------------
     CARTA
  ------------------------- */

  .letter-overlay {

    padding: 8px;

  }


  .letter {

    width: 96vw;

    height: 88vh;

  }


  .letter-page {

    width: 100%;
    height: 100%;

    object-fit: contain;

  }


  .letter-controls {

    bottom: 10px;

    gap: 5px;

    padding: 5px;

  }


  .letter-controls button {

    width: 40px;
    height: 40px;

  }


  .letter-message {

    bottom: 66px;

    max-width: 85vw;

    white-space: normal;

    text-align: center;

    font-size: 11px;

  }


  .close {

    top: 10px;
    right: 10px;

  }


  /* -------------------------
     PAPEL
  ------------------------- */

  .messages-overlay {

    padding: 8px;

  }


  .paper {

    width: 96vw;

    height: 88vh;

    padding: 45px 22px 115px;

  }


  .paper::before {

    inset: 16px;

  }


  .paper-title {

    font-size: 18px;

    margin-bottom: 20px;

  }


  .messages {

    height:
      calc(100% - 100px);

  }


  /* -------------------------
     FORMULÁRIO
  ------------------------- */

  .message-form {

    width:
      calc(100% - 40px);

    flex-wrap: wrap;

    gap: 7px;

  }


  .message-form input:first-child {

    width: 100%;

  }


  .message-form input:nth-child(2) {

    width: calc(100% - 78px);

  }


  .message-form button {

    width: 70px;

    padding-left: 10px;
    padding-right: 10px;

  }


  .archive-button {

    top: 12px;
    left: 12px;

    font-size: 12px;

    padding: 10px 14px;

  }


  .close-messages {

    top: 12px;
    right: 12px;

  }

}


/* =========================================================
   TELAS MUITO PEQUENAS
========================================================= */

@media (max-width: 400px) {

  .letter {

    width: 98vw;

    height: 84vh;

  }


  .letter-message {

    font-size: 10px;

    padding:
      9px 13px;

  }


  .paper {

    height: 90vh;

  }

}


/* =========================================================
   ACESSIBILIDADE
========================================================= */

button:focus-visible,
input:focus-visible,
textarea:focus-visible {

  outline:
    2px solid
    rgba(40,59,84,.7);

  outline-offset: 2px;

}

</style>

</head>

<div id="app">

     CARREGAMENTO

  id="loading"
>

      <input
        id="messageInput"

        placeholder="escreva aqui..."

      <button
        id="sendButton"

        enviar

    </div>


  </div>

</div>


<!-- ======================================================

>

    class="archive-list"

</div>


</div>

========================================================= */

unlockButton.addEventListener(
  "click",
  verificarSenha
);


passwordInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      verificarSenha();

    }

  }
);


function verificarSenha() {

  const value =
    passwordInput.value.trim();


  if (value === PASSWORD) {

    unlocked = true;

    passwordOverlay
      .classList
      .add("hidden");

    passwordInput.value = "";

    passwordError.textContent = "";

    /*
       Depois de desbloquear,
       abrimos o livro.
    */

    abrirCarta();

  } else {

    passwordError.textContent =
      "A senha não está correta.";

    passwordInput.select();

  }

}


cancelPassword.addEventListener(
  "click",
  function() {

    passwordOverlay
      .classList
      .add("hidden");

    passwordInput.value = "";

    passwordError.textContent = "";

  }
);


/* =========================================================
   CARTA
========================================================= */

function abrirCarta() {

  currentPage = 0;

  atualizarPagina();

  letterOverlay
    .classList
    .remove("hidden");

}


function atualizarPagina() {

  pages.forEach(
    function(page, index) {

      page.classList.toggle(
        "active",
        index === currentPage
      );

    }
  );


  pageNumber.textContent =
    `${currentPage + 1} / ${pages.length}`;


  previousPage.disabled =
    currentPage === 0;


  nextPage.disabled =
    currentPage === pages.length - 1;


  if (
    currentPage ===
    pages.length - 1
  ) {

    letterMessage
      .classList
      .remove("hidden");

  } else {

    letterMessage
      .classList
      .add("hidden");

  }

}


previousPage.addEventListener(
  "click",
  function() {

    if (currentPage > 0) {

      currentPage--;

      atualizarPagina();

    }

  }
);


nextPage.addEventListener(
  "click",
  function() {

    if (
      currentPage <
      pages.length - 1
    ) {

      currentPage++;

      atualizarPagina();

    }

  }
);


closeLetter.addEventListener(
  "click",
  function() {

    letterOverlay
      .classList
      .add("hidden");

  }
);


/* =========================================================
   MENSAGENS
========================================================= */

async function abrirMensagens() {

  messagesOverlay
    .classList
    .remove("hidden");

  await carregarMensagens();

}


closeMessages.addEventListener(
  "click",
  function() {

    messagesOverlay
      .classList
      .add("hidden");

  }
);


/* =========================================================
   CARREGAR MENSAGENS
========================================================= */

async function carregarMensagens() {

  try {

    const response =
      await fetch(
        API_URL +
        "?action=messages&time=" +
        Date.now()
      );


    const data =
      await response.json();


    if (
      data.success &&
      Array.isArray(data.messages)
    ) {

      allMessages =
        data.messages;

    } else {

      allMessages = [];

    }

  } catch (error) {

    console.error(
      "Erro ao carregar mensagens:",
      error
    );

    allMessages = [];

  }


  renderizarFolhaAtual();

}


/* =========================================================
   ORGANIZAR FOLHAS
========================================================= */

function obterFolhas() {

  const sheets = [];


  for (
    let i = 0;
    i < allMessages.length;
    i += MESSAGES_PER_SHEET
  ) {

    sheets.push(
      allMessages.slice(
        i,
        i + MESSAGES_PER_SHEET
      )
    );

  }


  if (sheets.length === 0) {

    sheets.push([]);

  }


  return sheets;

}


/* =========================================================
   RENDERIZAR FOLHA ATUAL
========================================================= */

function renderizarFolhaAtual() {

  const sheets =
    obterFolhas();


  currentMessageSheet =
    sheets.length - 1;


  renderizarSheet(
    currentMessageSheet
  );


  atualizarArquivo(
    sheets
  );

}


/* =========================================================
   RENDERIZAR FOLHA
========================================================= */

function renderizarSheet(index) {

  const sheets =
    obterFolhas();


  const sheet =
    sheets[index] || [];


  messagesContainer.innerHTML =
    "";


  if (sheet.length === 0) {

    const empty =
      document.createElement("div");


    empty.style.cssText =
      `
      text-align:center;
      margin-top:100px;
      opacity:.45;
      font-family:Georgia,serif;
      `;


    empty.textContent =
      "ainda não há mensagens.";


    messagesContainer.appendChild(
      empty
    );


    return;

  }


  sheet.forEach(
    function(item) {

      const wrapper =
        document.createElement("div");


      wrapper.className =
        "message";


      const rotation =
        (Math.random() * 2 - 1)
        .toFixed(2);


      wrapper.style.setProperty(
        "--rotation",
        rotation + "deg"
      );


      const name =
        document.createElement("div");


      name.className =
        "message-name";


      name.textContent =
        item.name;


      const text =
        document.createElement("div");


      text.className =
        "message-text";


      text.textContent =
        item.message;


      const date =
        document.createElement("div");


      date.className =
        "message-date";


      date.textContent =
        formatarData(
          item.timestamp
        );


      wrapper.appendChild(name);

      wrapper.appendChild(text);

      wrapper.appendChild(date);


      messagesContainer.appendChild(
        wrapper
      );

    }
  );

}


/* =========================================================
   ARQUIVO
========================================================= */

function atualizarArquivo(sheets) {

  archiveList.innerHTML =
    "";


  const oldSheets =
    sheets.length - 1;


  if (oldSheets <= 0) {

    const text =
      document.createElement("p");


    text.style.opacity =
      ".6";


    text.textContent =
      "Ainda não existem folhas anteriores.";


    archiveList.appendChild(
      text
    );


    return;

  }


  for (
    let i = oldSheets - 1;
    i >= 0;
    i--
  ) {

    const button =
      document.createElement("button");


    button.textContent =
      `folha ${i + 1}`;


    button.addEventListener(
      "click",
      function() {

        currentMessageSheet =
          i;


        renderizarSheet(i);


        archive.classList.add(
          "hidden"
        );

      }
    );


    archiveList.appendChild(
      button
    );

  }

}


archiveButton.addEventListener(
  "click",
  function() {

    const sheets =
      obterFolhas();


    atualizarArquivo(
      sheets
    );


    archive.classList
      .remove("hidden");

  }
);


closeArchive.addEventListener(
  "click",
  function() {

    archive.classList
      .add("hidden");

  }
);


/* =========================================================
   ENVIAR MENSAGEM
========================================================= */

sendButton.addEventListener(
  "click",
  enviarMensagem
);


messageInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      enviarMensagem();

    }

  }
);


async function enviarMensagem() {

  const name =
    nameInput.value.trim();


  const message =
    messageInput.value.trim();


  if (!name) {

    alert(
      "Antes de enviar, coloque seu nome."
    );

    nameInput.focus();

    return;

  }


  if (!message) {

    alert(
      "Escreva uma mensagem."
    );

    messageInput.focus();

    return;

  }


  sendButton.disabled =
    true;


  sendButton.textContent =
    "enviando...";


  try {

    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              name:
                name,

              message:
                message

            })

        }
      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.error ||
        "Erro ao salvar."
      );

    }


    nameInput.value =
      "";


    messageInput.value =
      "";


    await carregarMensagens();


    alert(
      "Mensagem guardada."
    );


  } catch (error) {

    console.error(
      "Erro ao enviar:",
      error
    );


    alert(
      "Não foi possível salvar a mensagem. Verifique o Google Apps Script."
    );

  }


  sendButton.disabled =
    false;


  sendButton.textContent =
    "enviar";

}


/* =========================================================
   DATA
========================================================= */

function formatarData(value) {

  try {

    const date =
      new Date(value);


    return date.toLocaleString(
      "pt-BR",
      {

        day: "2-digit",

        month: "2-digit",

        year: "numeric",

        hour: "2-digit",

        minute: "2-digit"

      }
    );

  } catch {

    return "";

  }

}


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Escape"
    ) {

      passwordOverlay
        .classList
        .add("hidden");


      letterOverlay
        .classList
        .add("hidden");


      messagesOverlay
        .classList
        .add("hidden");


      archive
        .classList
        .add("hidden");

    }

  }
);


/* =========================================================
   NAVEGAÇÃO DA CARTA PELO TECLADO
========================================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      letterOverlay.classList.contains("hidden")
    ) {

      return;

    }


    if (event.key === "ArrowRight") {

      if (
        currentPage <
        pages.length - 1
      ) {

        currentPage++;

        atualizarPagina();

      }

    }


    if (event.key === "ArrowLeft") {

      if (
        currentPage > 0
      ) {

        currentPage--;

        atualizarPagina();

      }

    }

  }
);

</script>

</body>
