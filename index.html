<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#283b54">
<title>para você.</title>
<script src="config.js"></script>
<style>
/* O cenário visual é a imagem em assets/interface.png. */
:root{--blue:#283b54;--blue2:#1d2c40;--paper:#f4f0e5;--ink:#242424;--gold:#d5bd8b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--blue);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}
#app{position:relative;width:100vw;height:100dvh;overflow:hidden;background:var(--blue)}
.loader{position:fixed;inset:0;z-index:9999;background:var(--blue);display:flex;align-items:center;justify-content:center;text-align:center;transition:opacity .8s ease,visibility .8s ease}.loader.hide{opacity:0;visibility:hidden;pointer-events:none}.loader-inner{animation:rise 1.8s ease both}.loader-title{font:400 clamp(28px,5vw,52px)/1.1 Georgia,serif;letter-spacing:.02em}.loader-sub{margin-top:16px;font:400 12px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.14em;text-transform:uppercase;opacity:.55}.loader-line{width:70px;height:1px;background:rgba(255,255,255,.5);margin:28px auto 0;animation:line 5s linear both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes line{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0;background:var(--blue)}.scene-image{width:100%;height:100%;object-fit:contain;object-position:center;display:block;user-select:none;-webkit-user-drag:none}.hotspot{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;z-index:5;touch-action:manipulation}.hotspot:focus-visible{outline:2px solid rgba(255,255,255,.8);outline-offset:4px;border-radius:12px}.book-hotspot{left:36%;top:34%;width:28%;height:49%}.pen-hotspot{left:69%;top:70%;width:25%;height:18%}.calendar-hotspot{left:58%;top:6%;width:24%;height:32%}.globe-hotspot{left:4%;top:4%;width:34%;height:47%}.car-hotspot{left:67%;top:29%;width:30%;height:36%}
.hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.45;pointer-events:none;white-space:nowrap}
.modal-backdrop,.letter-overlay,.messages-overlay{position:fixed;inset:0;z-index:100;background:rgba(18,29,42,.9);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;padding:18px}.hidden{display:none!important}
.modal{width:min(420px,92vw);background:rgba(248,246,239,.98);color:#202020;border-radius:24px;padding:32px;box-shadow:0 30px 100px rgba(0,0,0,.5);text-align:center}.modal h2{font:400 25px Georgia,serif;margin:0 0 9px}.modal p{color:#666;line-height:1.5;font-size:14px;margin:0 0 20px}.modal input,.modal textarea,.message-form input,.message-form textarea{width:100%;border:1px solid #d6d0c4;background:#fffdf8;color:#222;border-radius:13px;padding:13px 14px;font:inherit;outline:none}.modal input:focus,.message-form input:focus,.message-form textarea:focus{border-color:var(--blue)}button{border:0;border-radius:999px;background:var(--blue);color:white;padding:12px 19px;cursor:pointer;font:inherit}button.secondary{background:transparent;color:#333;border:1px solid #cfc7b8;margin-left:6px}.error{color:#a04a4a!important;min-height:20px;margin-top:12px!important;margin-bottom:0!important}
.letter-overlay{z-index:200}.letter-shell{position:relative;width:min(900px,94vw);height:min(88vh,820px);display:flex;align-items:center;justify-content:center}.letter-page{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;background:#fff;box-shadow:0 30px 90px rgba(0,0,0,.55);display:none}.letter-page.active{display:block}.letter-close,.messages-close{position:absolute;right:0;top:0;width:42px;height:42px;padding:0;border-radius:50%;background:rgba(0,0,0,.65);z-index:5;font-size:22px}.letter-controls{position:absolute;left:50%;bottom:-3px;transform:translate(-50%,100%);display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.72);padding:7px;border-radius:999px}.letter-controls button{width:40px;height:40px;padding:0}.page-number{min-width:65px;text-align:center;font-size:12px}.last-note{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(40,59,84,.94);padding:10px 16px;border-radius:999px;font-size:12px;white-space:nowrap}
.messages-overlay{z-index:300}.paper-wrap{position:relative;width:min(900px,94vw);height:min(86vh,820px);display:flex;align-items:center;justify-content:center}.paper{position:relative;width:100%;height:100%;background:linear-gradient(135deg,#f8f5ed,#eee8da);color:var(--ink);box-shadow:0 30px 100px rgba(0,0,0,.55);padding:clamp(28px,5vw,60px);overflow:hidden}.paper:after{content:"";position:absolute;inset:18px;border:1px solid rgba(40,40,40,.08);pointer-events:none}.paper h1{font:400 clamp(20px,3vw,28px) Georgia,serif;text-align:center;margin:0 0 25px}.messages{position:absolute;left:7%;right:7%;top:18%;bottom:27%;overflow:auto;padding-right:8px}.message{font-family:"Segoe Print","Bradley Hand",cursive;margin:0 0 22px;transform:rotate(var(--rot));white-space:pre-wrap}.message-name{font-weight:700;font-size:16px}.message-text{font-size:15px;line-height:1.45}.message-date{font:10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;opacity:.42;margin-top:4px}.message-form{position:absolute;left:7%;right:7%;bottom:5%;display:grid;grid-template-columns:150px 1fr auto;gap:8px;z-index:2}.message-form textarea{height:52px;resize:none}.archive-button{position:absolute;top:18px;left:18px;z-index:4;background:rgba(40,59,84,.92);font-size:12px}.archive{position:fixed;inset:0;z-index:400;background:rgba(18,29,42,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}.archive h2{font:400 25px Georgia,serif;margin:0 0 20px}.archive-list{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:700px}.archive-list button{background:var(--paper);color:#222}.archive-close{position:absolute;right:20px;top:20px}.empty{opacity:.45;text-align:center;margin-top:70px;font-family:Georgia,serif}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:12px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.3s;z-index:1000;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:700px){.scene-image{object-fit:contain}.hint{bottom:9px;font-size:9px}.book-hotspot{left:33%;top:35%;width:34%;height:47%}.pen-hotspot{left:64%;top:66%;width:31%;height:19%}.globe-hotspot{left:2%;top:4%;width:38%;height:45%}.calendar-hotspot{left:57%;top:5%;width:27%;height:31%}.car-hotspot{left:64%;top:28%;width:34%;height:37%}.message-form{grid-template-columns:1fr;bottom:3%}.messages{bottom:31%;top:17%}.paper{height:90vh;padding:28px 22px}.letter-controls{bottom:-8px}.last-note{bottom:15px;font-size:10px}}
</style>
</head>
<body>
<div id="app">
  <div class="scene">
    <img class="scene-image" src="assets/interface.png" alt="Mesa com livro, globo, calendário, carro e caneta">
    <button class="hotspot globe-hotspot" id="globeHotspot" aria-label="Globo"></button>
    <button class="hotspot calendar-hotspot" id="calendarHotspot" aria-label="Calendário"></button>
    <button class="hotspot car-hotspot" id="carHotspot" aria-label="Cadillac"></button>
    <button class="hotspot book-hotspot" id="book" aria-label="Abrir carta"></button>
    <button class="hotspot pen-hotspot" id="pen" aria-label="Escrever mensagem"></button>
    <div class="hint">toque nos objetos</div>
  </div>
  <div class="loader" id="loader"><div class="loader-inner"><div class="loader-title">Um Ano Depois...</div><div class="loader-sub">Feito por João Arthur.</div><div class="loader-line"></div></div></div>
  <div class="modal-backdrop hidden" id="passwordOverlay"><div class="modal"><h2>Teu aniversário</h2><p>Para continuar, digite a data somente com números.</p><input id="passwordInput" type="password" inputmode="numeric" maxlength="8" placeholder="DDMMAAAA" autocomplete="off"><div><button id="unlockButton">abrir</button><button class="secondary" id="cancelPassword">cancelar</button></div><p class="error" id="passwordError"></p></div></div>
  <div class="letter-overlay hidden" id="letterOverlay"><div class="letter-shell"><button class="letter-close" id="closeLetter">×</button><img class="letter-page active" src="assets/letter/page-1.png" alt="Página 1"><img class="letter-page" src="assets/letter/page-2.png" alt="Página 2"><img class="letter-page" src="assets/letter/page-3.png" alt="Página 3"><img class="letter-page" src="assets/letter/page-4.png" alt="Página 4"><div class="letter-controls"><button id="previousPage">←</button><span class="page-number" id="pageNumber">1 / 4</span><button id="nextPage">→</button></div><div class="last-note hidden" id="lastNote">Deixe uma mensagem ou comentário na caneta encima da mesa</div></div></div>
  <div class="messages-overlay hidden" id="messagesOverlay"><div class="paper-wrap"><div class="paper"><button class="archive-button" id="archiveButton">folhas anteriores</button><button class="messages-close" id="closeMessages">×</button><h1>if u have something to say,<br>say it here.</h1><div class="messages" id="messages"></div><div class="message-form"><input id="nameInput" maxlength="80" placeholder="teu nome"><textarea id="messageInput" maxlength="2000" placeholder="escreva aqui..."></textarea><button id="sendButton">enviar</button></div></div></div></div>
  <div class="archive hidden" id="archive"><button class="archive-close" id="closeArchive">fechar</button><h2>folhas anteriores</h2><div class="archive-list" id="archiveList"></div></div>
  <div class="toast" id="toast"></div>
</div>
<script>
const CONFIG={PASSWORD:"25102008",API_URL:window.SITE_CONFIG.API_URL||"",MESSAGES_PER_SHEET:6};
let unlocked=false,currentPage=0,allMessages=[],currentSheet=0,pendingAction=null;
const $=id=>document.getElementById(id);
const pages=[...document.querySelectorAll('.letter-page')];
window.addEventListener('load',()=>setTimeout(()=>$('loader').classList.add('hide'),5000));
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}
function askPassword(action){pendingAction=action;$('passwordOverlay').classList.remove('hidden');$('passwordInput').focus()}
$('book').onclick=()=>unlocked?openLetter():askPassword('letter');
$('pen').onclick=()=>unlocked?openMessages():askPassword('messages');
$('cancelPassword').onclick=()=>{$('passwordOverlay').classList.add('hidden');$('passwordInput').value='';$('passwordError').textContent=''};
$('unlockButton').onclick=verifyPassword;$('passwordInput').onkeydown=e=>{if(e.key==='Enter')verifyPassword()};
function verifyPassword(){if($('passwordInput').value.trim()===CONFIG.PASSWORD){unlocked=true;$('passwordOverlay').classList.add('hidden');$('passwordInput').value='';$('passwordError').textContent='';pendingAction==='letter'?openLetter():openMessages()}else{$('passwordError').textContent='A senha não está correta.';$('passwordInput').select()}}
function openLetter(){currentPage=0;updatePage();$('letterOverlay').classList.remove('hidden')}
function updatePage(){pages.forEach((p,i)=>p.classList.toggle('active',i===currentPage));$('pageNumber').textContent=`${currentPage+1} / ${pages.length}`;$('previousPage').disabled=currentPage===0;$('nextPage').disabled=currentPage===pages.length-1;$('lastNote').classList.toggle('hidden',currentPage!==pages.length-1)}
$('previousPage').onclick=()=>{if(currentPage>0){currentPage--;updatePage()}};$('nextPage').onclick=()=>{if(currentPage<pages.length-1){currentPage++;updatePage()}};$('closeLetter').onclick=()=>$('letterOverlay').classList.add('hidden');
function openMessages(){$('messagesOverlay').classList.remove('hidden');loadMessages()}
$('closeMessages').onclick=()=>$('messagesOverlay').classList.add('hidden');
function sheets(){const a=[];for(let i=0;i<allMessages.length;i+=CONFIG.MESSAGES_PER_SHEET)a.push(allMessages.slice(i,i+CONFIG.MESSAGES_PER_SHEET));return a.length?a:[[]]}
function renderSheet(i){const s=sheets()[i]||[];$('messages').innerHTML='';if(!s.length){$('messages').innerHTML='<div class="empty">ainda não há mensagens.</div>';return}s.forEach(item=>{const w=document.createElement('div');w.className='message';w.style.setProperty('--rot',((Math.random()*2)-1).toFixed(2)+'deg');const n=document.createElement('div');n.className='message-name';n.textContent=item.name;const m=document.createElement('div');m.className='message-text';m.textContent=item.message;const d=document.createElement('div');d.className='message-date';d.textContent=formatDate(item.timestamp);w.append(n,m,d);$('messages').appendChild(w)})}
function refresh(){const ss=sheets();currentSheet=ss.length-1;renderSheet(currentSheet);buildArchive(ss)}
function buildArchive(ss){$('archiveList').innerHTML='';if(ss.length<=1){$('archiveList').innerHTML='<p style="opacity:.6">Ainda não existem folhas anteriores.</p>';return}for(let i=0;i<ss.length-1;i++){const b=document.createElement('button');b.textContent=`folha ${i+1}`;b.onclick=()=>{$('archive').classList.add('hidden');currentSheet=i;renderSheet(i)};$('archiveList').appendChild(b)}}
async function loadMessages(){if(!CONFIG.API_URL){allMessages=[];refresh();return}try{const data=await jsonp('messages');if(data&&data.success)allMessages=Array.isArray(data.messages)?data.messages:[];else allMessages=[]}catch(e){console.error(e);toast('Não foi possível carregar as mensagens.')}refresh()}
function jsonp(action,extra={}){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*9999);const s=document.createElement('script');const params=new URLSearchParams({action,callback:cb,_:Date.now(),...extra});window[cb]=data=>{delete window[cb];s.remove();resolve(data)};s.onerror=()=>{delete window[cb];s.remove();reject(new Error('API indisponível'))};s.src=CONFIG.API_URL+'?'+params.toString();document.body.appendChild(s);setTimeout(()=>{if(window[cb]){delete window[cb];s.remove();reject(new Error('timeout'))}},12000)})}
$('sendButton').onclick=sendMessage;$('messageInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};
async function sendMessage(){const name=$('nameInput').value.trim(),message=$('messageInput').value.trim();if(!name){toast('Coloque seu nome.');$('nameInput').focus();return}if(!message){toast('Escreva uma mensagem.');$('messageInput').focus();return}if(!CONFIG.API_URL){toast('Configure a URL do Apps Script no index.html.');return}$('sendButton').disabled=true;$('sendButton').textContent='enviando...';try{const data=await jsonp('save',{name,message});if(!data||!data.success)throw new Error(data?.error||'erro');$('nameInput').value='';$('messageInput').value='';toast('Mensagem guardada.');await loadMessages()}catch(e){console.error(e);toast('Não foi possível salvar. Verifique a implantação do Apps Script.')}finally{$('sendButton').disabled=false;$('sendButton').textContent='enviar'}}
$('archiveButton').onclick=()=>{$('archive').classList.remove('hidden');buildArchive(sheets())};$('closeArchive').onclick=()=>$('archive').classList.add('hidden');
function formatDate(v){const d=new Date(v);return isNaN(d)?'':d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
$('globeHotspot').onclick=()=>toast('Recife, PE  ·  Cacoal, RO');$('calendarHotspot').onclick=()=>toast('10 de agosto de 2025');$('carHotspot').onclick=()=>toast('Cadillac Escalade');
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.modal-backdrop,.letter-overlay,.messages-overlay,.archive').forEach(x=>x.classList.add('hidden'))}});
</script></body></html>
