<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>para você.</title>

<style>

/* =========================================================
   CONFIGURAÇÕES
========================================================= */

:root {

  --blue: #283b54;
  --blue-dark: #1c2b3e;

  --paper: #f6f1e6;
  --paper-shadow: rgba(0,0,0,.45);

  --ink: #252525;

  --white: #ffffff;

}


/* =========================================================
   RESET
========================================================= */

* {

  box-sizing: border-box;

  margin: 0;

  padding: 0;

}


html,
body {

  width: 100%;
  height: 100%;

}


body {

  overflow: hidden;

  background:
    var(--blue);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color:
    white;

}


/* =========================================================
   APLICAÇÃO
========================================================= */

#app {

  width: 100vw;
  height: 100vh;

  position: relative;

  overflow: hidden;

}


/* =========================================================
   TELA DE CARREGAMENTO
========================================================= */

.loading {

  position: fixed;

  inset: 0;

  z-index: 9999;

  background:
    var(--blue);

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  color: white;

  transition:
    opacity 1s ease,
    visibility 1s ease;

}


.loading.hidden {

  opacity: 0;

  visibility: hidden;

  pointer-events: none;

}


.loading-title {

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(26px, 5vw, 48px);

  letter-spacing:
    .03em;

  margin-bottom:
    15px;

}


.loading-author {

  font-size:
    13px;

  opacity:
    .55;

  letter-spacing:
    .08em;

}


.loading-line {

  width:
    80px;

  height:
    1px;

  background:
    rgba(255,255,255,.5);

  margin-top:
    28px;

  animation:
    loadingLine 1.5s ease-in-out infinite;

}


@keyframes loadingLine {

  0% {

    transform:
      scaleX(.2);

    opacity:
      .2;

  }

  50% {

    transform:
      scaleX(1);

    opacity:
      1;

  }

  100% {

    transform:
      scaleX(.2);

    opacity:
      .2;

  }

}


/* =========================================================
   INTERFACE PRINCIPAL
========================================================= */

.main-interface {

  position: absolute;

  inset: 0;

  background-color:
    var(--blue);

  background-image:
    url("./assets/interface.png");

  background-position:
    center;

  background-repeat:
    no-repeat;

  background-size:
    cover;

}


/*
   Uma camada muito discreta para melhorar
   a leitura e dar profundidade.
*/

.main-interface::after {

  content: "";

  position: absolute;

  inset: 0;

  background:
    radial-gradient(
      circle at center,
      transparent 35%,
      rgba(0,0,0,.16) 100%
    );

  pointer-events:
    none;

}


/* =========================================================
   ÁREAS CLICÁVEIS
========================================================= */

/*
   Essas áreas são invisíveis.

   Elas ficam por cima da imagem da mesa.

   Se precisar mudar a posição posteriormente,
   basta alterar left/top/width/height.
*/


.hotspot {

  position: absolute;

  z-index: 20;

  border: none;

  background: transparent;

  cursor: pointer;

  -webkit-tap-highlight-color:
    transparent;

}


/* LIVRO */

.book-hotspot {

  left: 50%;

  top: 50%;

  width: 27%;

  height: 48%;

  transform:
    translate(-50%, -50%);

}


/* CANETA */

.pen-hotspot {

  left: 68%;

  top: 73%;

  width: 18%;

  height: 13%;

  transform:
    translate(-50%, -50%);

}


/* efeito discreto ao passar o mouse */

.hotspot:hover {

  background:
    rgba(255,255,255,.025);

}


/* =========================================================
   MODAL DE SENHA
========================================================= */

.overlay {

  position: fixed;

  inset: 0;

  z-index: 1000;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

  background:
    rgba(15,25,38,.82);

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);

}


.overlay.hidden {

  display: none;

}


.password-modal {

  width:
    min(420px, 92vw);

  padding:
    38px 30px;

  border-radius:
    26px;

  background:
    rgba(247,244,236,.98);

  color:
    #222;

  text-align:
    center;

  box-shadow:
    0 30px 90px
    rgba(0,0,0,.45);

  animation:
    modalIn .35s ease;

}


@keyframes modalIn {

  from {

    opacity: 0;

    transform:
      translateY(15px)
      scale(.98);

  }

  to {

    opacity: 1;

    transform:
      translateY(0)
      scale(1);

  }

}


.password-modal h2 {

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-weight:
    400;

  font-size:
    25px;

  margin-bottom:
    10px;

}


.password-modal p {

  color:
    #666;

  line-height:
    1.5;

  font-size:
    14px;

  margin-bottom:
    23px;

}


.password-input {

  width: 100%;

  height: 52px;

  border:
    1px solid #d7d0c3;

  border-radius:
    14px;

  background:
    #fffdf8;

  color:
    #222;

  text-align:
    center;

  font-size:
    18px;

  letter-spacing:
    .18em;

  outline:
    none;

  margin-bottom:
    14px;

}


.password-input:focus {

  border-color:
    var(--blue);

}


.primary-button {

  border:
    none;

  border-radius:
    999px;

  padding:
    13px 25px;

  background:
    var(--blue);

  color:
    white;

  cursor:
    pointer;

  font-size:
    14px;

}


.secondary-button {

  border:
    1px solid #d2cabe;

  border-radius:
    999px;

  padding:
    12px 22px;

  background:
    transparent;

  color:
    #333;

  cursor:
    pointer;

  font-size:
    14px;

  margin-left:
    7px;

}


.password-error {

  color:
    #9c3f3f !important;

  margin-top:
    14px;

  margin-bottom:
    0 !important;

  min-height:
    20px;

}


/* =========================================================
   CARTA
========================================================= */

.letter-overlay {

  position: fixed;

  inset: 0;

  z-index: 2000;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

  background:
    rgba(26,39,56,.96);

  backdrop-filter:
    blur(12px);

}


.letter-overlay.hidden {

  display: none;

}


.letter-window {

  position: relative;

  width:
    min(900px, 94vw);

  height:
    min(86vh, 780px);

  display: flex;

  align-items: center;

  justify-content: center;

}


.letter-page {

  display: none;

  max-width:
    100%;

  max-height:
    100%;

  width:
    auto;

  height:
    auto;

  object-fit:
    contain;

  background:
    white;

  box-shadow:
    0 30px 90px
    rgba(0,0,0,.5);

}


.letter-page.active {

  display:
    block;

}


/* =========================================================
   CONTROLES DA CARTA
========================================================= */

.letter-controls {

  position: absolute;

  left: 50%;

  bottom: -5px;

  transform:
    translateX(-50%);

  display: flex;

  align-items: center;

  gap: 12px;

  padding:
    8px;

  border-radius:
    999px;

  background:
    rgba(0,0,0,.72);

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.3);

}


.page-button {

  width:
    38px;

  height:
    38px;

  border:
    none;

  border-radius:
    50%;

  background:
    rgba(255,255,255,.12);

  color:
    white;

  cursor:
    pointer;

  font-size:
    17px;

}


.page-button:disabled {

  opacity:
    .25;

  cursor:
    default;

}


.page-number {

  min-width:
    60px;

  text-align:
    center;

  color:
    white;

  font-size:
    12px;

}


.letter-close {

  position: absolute;

  right: 0;

  top: -5px;

  z-index: 10;

  width:
    42px;

  height:
    42px;

  border:
    none;

  border-radius:
    50%;

  background:
    rgba(0,0,0,.65);

  color:
    white;

  font-size:
    25px;

  cursor:
    pointer;

}


.letter-final-message {

  position: absolute;

  right: 20px;

  bottom: 20px;

  padding:
    11px 17px;

  border-radius:
    999px;

  background:
    rgba(40,59,84,.94);

  color:
    white;

  font-size:
    12px;

  opacity:
    0;

  pointer-events:
    none;

  transition:
    opacity .3s ease;

}


.letter-final-message.visible {

  opacity:
    1;

}


/* =========================================================
   MENSAGENS
========================================================= */

.messages-overlay {

  position: fixed;

  inset: 0;

  z-index: 3000;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

  background:
    rgba(27,42,59,.97);

}


.messages-overlay.hidden {

  display:
    none;

}


.paper {

  position: relative;

  width:
    min(900px, 94vw);

  height:
    min(85vh, 820px);

  padding:
    55px 55px 115px;

  background:
    var(--paper);

  color:
    var(--ink);

  box-shadow:
    0 30px 90px
    var(--paper-shadow);

  overflow:
    hidden;

}


.paper::before {

  content: "";

  position: absolute;

  inset: 22px;

  border:
    1px solid
    rgba(40,40,40,.08);

  pointer-events:
    none;

}


.paper-title {

  position:
    relative;

  text-align:
    center;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    21px;

  line-height:
    1.4;

  margin-bottom:
    28px;

}


.messages {

  position:
    relative;

  height:
    calc(100% - 65px);

  overflow-y:
    auto;

  padding-right:
    10px;

}


.messages::-webkit-scrollbar {

  width:
    4px;

}


.messages::-webkit-scrollbar-thumb {

  background:
    rgba(0,0,0,.2);

}


/* =========================================================
   MENSAGEM INDIVIDUAL
========================================================= */

.message {

  margin-bottom:
    24px;

  padding-bottom:
    16px;

  border-bottom:
    1px dashed
    rgba(0,0,0,.12);

  font-family:
    "Segoe Print",
    "Bradley Hand",
    "Comic Sans MS",
    cursive;

}


.message-name {

  font-size:
    17px;

  font-weight:
    bold;

  margin-bottom:
    4px;

}


.message-text {

  white-space:
    pre-wrap;

  word-break:
    break-word;

  font-size:
    16px;

  line-height:
    1.5;

}


.message-date {

  margin-top:
    6px;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  font-size:
    10px;

  opacity:
    .45;

}


/* =========================================================
   FORMULÁRIO
========================================================= */

.message-form {

  position: absolute;

  left:
    50%;

  bottom:
    22px;

  transform:
    translateX(-50%);

  width:
    calc(100% - 70px);

  display:
    flex;

  gap:
    8px;

}


.message-form input {

  height:
    46px;

  border:
    1px solid #d5cec0;

  border-radius:
    12px;

  padding:
    0 13px;

  background:
    #fffdf8;

  color:
    #222;

  outline:
    none;

}


.name-input {

  width:
    25%;

}


.message-input {

  flex:
    1;

}


.send-button {

  height:
    46px;

  padding:
    0 20px;

  border:
    none;

  border-radius:
    12px;

  background:
    var(--blue);

  color:
    white;

  cursor:
    pointer;

}


.send-button:disabled {

  opacity:
    .5;

  cursor:
    wait;

}


/* =========================================================
   BOTÕES DA FOLHA
========================================================= */

.archive-button {

  position: absolute;

  top:
    20px;

  left:
    20px;

  border:
    none;

  border-radius:
    999px;

  padding:
    9px 14px;

  background:
    var(--blue);

  color:
    white;

  font-size:
    11px;

  cursor:
    pointer;

}


.close-messages {

  position: absolute;

  top:
    18px;

  right:
    18px;

  width:
    38px;

  height:
    38px;

  border:
    none;

  border-radius:
    50%;

  background:
    var(--blue);

  color:
    white;

  font-size:
    21px;

  cursor:
    pointer;

}


/* =========================================================
   ARQUIVO
========================================================= */

.archive {

  position: fixed;

  inset: 0;

  z-index: 4000;

  background:
    rgba(27,42,59,.98);

  display:
    flex;

  flex-direction:
    column;

  align-items:
    center;

  justify-content:
    center;

  padding:
    25px;

}


.archive.hidden {

  display:
    none;

}


.archive h2 {

  font-family:
    Georgia,
    serif;

  font-weight:
    400;

  margin-bottom:
    22px;

}


.archive-list {

  display:
    flex;

  flex-wrap:
    wrap;

  justify-content:
    center;

  gap:
    10px;

  max-width:
    700px;

}


.archive-list button {

  border:
    none;

  border-radius:
    999px;

  padding:
    11px 18px;

  background:
    var(--paper);

  color:
    #222;

  cursor:
    pointer;

}


.archive-close {

  position:
    absolute;

  top:
    20px;

  right:
    20px;

  border:
    none;

  border-radius:
    999px;

  padding:
    10px 17px;

  background:
    var(--paper);

  color:
    #222;

  cursor:
    pointer;

}


/* =========================================================
   RESPONSIVO — CELULAR
========================================================= */

@media (max-width: 700px) {

  .main-interface {

    background-size:
      cover;

    background-position:
      center;

  }


  /*
     Áreas clicáveis maiores no celular.
  */

  .book-hotspot {

    width:
      42%;

    height:
      43%;

    left:
      50%;

    top:
      49%;

  }


  .pen-hotspot {

    width:
      30%;

    height:
      17%;

    left:
      69%;

    top:
      73%;

  }


  .letter-overlay {

    padding:
      10px;

  }


  .letter-window {

    width:
      96vw;

    height:
      86vh;

  }


  .letter-page {

    max-width:
      94vw;

    max-height:
      78vh;

  }


  .letter-controls {

    bottom:
      0;

  }


  .letter-close {

    right:
      3px;

    top:
      -45px;

  }


  .letter-final-message {

    left:
      50%;

    right:
      auto;

    bottom:
      50px;

    transform:
      translateX(-50%);

    white-space:
      nowrap;

  }


  .paper {

    width:
      94vw;

    height:
      88vh;

    padding:
      55px 22px 130px;

  }


  .paper-title {

    font-size:
      18px;

  }


  .message-form {

    width:
      calc(100% - 40px);

    flex-wrap:
      wrap;

  }


  .name-input {

    width:
      100%;

  }


  .message-input {

    width:
      calc(100% - 65px);

    flex:
      none;

  }


  .send-button {

    width:
      57px;

    padding:
      0 8px;

  }

}


/* =========================================================
   MENSAGEM VAZIA
========================================================= */

.empty-message {

  text-align:
    center;

  margin-top:
    100px;

  opacity:
    .45;

  font-family:
    Georgia,
    serif;

}


/* =========================================================
   OCULTO
========================================================= */

.hidden {

  display:
    none !important;

}

</style>

</head>


<body>

<div id="app">


<!-- =====================================================
     CARREGAMENTO
===================================================== -->

<div
  class="loading"
  id="loading"
>

  <div class="loading-title">
    Um Ano Depois...
  </div>

  <div class="loading-author">
    Feito por João Arthur.
  </div>

  <div class="loading-line"></div>

</div>


<!-- =====================================================
     INTERFACE / IMAGEM DA MESA
===================================================== -->

<div
  class="main-interface"
  id="mainInterface"
>


  <!-- LIVRO CLICÁVEL -->

  <button
    class="hotspot book-hotspot"
    id="bookHotspot"
    aria-label="Abrir carta"
  ></button>


  <!-- CANETA CLICÁVEL -->

  <button
    class="hotspot pen-hotspot"
    id="penHotspot"
    aria-label="Escrever uma mensagem"
  ></button>


</div>


<!-- =====================================================
     SENHA
===================================================== -->

<div
  class="overlay hidden"
  id="passwordOverlay"
>

  <div class="password-modal">

    <h2>
      Teu aniversário
    </h2>

    <p>
      Para continuar, digite a data
      somente com números.
    </p>


    <input
      class="password-input"
      id="passwordInput"
      type="password"
      inputmode="numeric"
      autocomplete="off"
      maxlength="8"
      placeholder="DDMMAAAA"
    >


    <div>

      <button
        class="primary-button"
        id="unlockButton"
      >
        abrir
      </button>

      <button
        class="secondary-button"
        id="cancelPassword"
      >
        cancelar
      </button>

    </div>


    <p
      class="password-error"
      id="passwordError"
    ></p>

  </div>

</div>


<!-- =====================================================
     CARTA
===================================================== -->

<div
  class="letter-overlay hidden"
  id="letterOverlay"
>


  <div
    class="letter-window"
    id="letterWindow"
  >

    <button
      class="letter-close"
      id="closeLetter"
    >
      ×
    </button>


    <!--
      AS PÁGINAS SERÃO INSERIDAS AUTOMATICAMENTE
      PELO JAVASCRIPT.

      Ele procura:
      page-1.png
      page-2.png
      page-3.png
      etc.

      Portanto você NÃO precisa colocar
      manualmente cada página aqui.
    -->

    <div
      id="pagesContainer"
    ></div>


    <div
      class="letter-controls"
      id="letterControls"
    >

      <button
        class="page-button"
        id="previousPage"
      >
        ←
      </button>


      <span
        class="page-number"
        id="pageNumber"
      >
        1 / 1
      </span>


      <button
        class="page-button"
        id="nextPage"
      >
        →
      </button>

    </div>


    <div
      class="letter-final-message"
      id="letterFinalMessage"
    >
      Deixe uma mensagem ou comentário na caneta encima da mesa.
    </div>

  </div>

</div>


<!-- =====================================================
     MENSAGENS
===================================================== -->

<div
  class="messages-overlay hidden"
  id="messagesOverlay"
>

  <div class="paper">


    <button
      class="archive-button"
      id="archiveButton"
    >
      folhas anteriores
    </button>


    <button
      class="close-messages"
      id="closeMessages"
    >
      ×
    </button>


    <div class="paper-title">

      if u have something to say,<br>
      say it here.

    </div>


    <div
      class="messages"
      id="messages"
    ></div>


    <div class="message-form">


      <input
        class="name-input"
        id="nameInput"
        type="text"
        maxlength="80"
        placeholder="teu nome"
      >


      <input
        class="message-input"
        id="messageInput"
        type="text"
        maxlength="2000"
        placeholder="escreva aqui..."
      >


      <button
        class="send-button"
        id="sendButton"
      >
        enviar
      </button>


    </div>

  </div>

</div>


<!-- =====================================================
     ARQUIVO DE FOLHAS
===================================================== -->

<div
  class="archive hidden"
  id="archive"
>


  <button
    class="archive-close"
    id="closeArchive"
  >
    fechar
  </button>


  <h2>
    folhas anteriores
  </h2>


  <div
    class="archive-list"
    id="archiveList"
  ></div>


</div>


</div>


<script>

/* =========================================================
   CONFIGURAÇÕES
========================================================= */


/*
   SENHA DO LIVRO E DA CANETA
*/

const PASSWORD = "25102008";


/*
   GOOGLE APPS SCRIPT

   Este é o endereço utilizado para salvar
   as mensagens.

   Se você criou uma nova implantação do Apps Script,
   substitua apenas esta URL.
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbz7mUY2SZA9sdeXLLVdheKYA4rVh7AbnDojfyLPxEXy204IGUwnARLYkXhh7pr7DWCcaw/exec";


/*
   QUANTAS MENSAGENS CABEM EM CADA FOLHA
*/

const MESSAGES_PER_SHEET = 6;


/* =========================================================
   ELEMENTOS
========================================================= */

const loading =
document.getElementById("loading");

const bookHotspot =
document.getElementById("bookHotspot");

const penHotspot =
document.getElementById("penHotspot");

const passwordOverlay =
document.getElementById("passwordOverlay");

const passwordInput =
document.getElementById("passwordInput");

const passwordError =
document.getElementById("passwordError");

const unlockButton =
document.getElementById("unlockButton");

const cancelPassword =
document.getElementById("cancelPassword");

const letterOverlay =
document.getElementById("letterOverlay");

const letterWindow =
document.getElementById("letterWindow");

const closeLetter =
document.getElementById("closeLetter");

const pagesContainer =
document.getElementById("pagesContainer");

const previousPage =
document.getElementById("previousPage");

const nextPage =
document.getElementById("nextPage");

const pageNumber =
document.getElementById("pageNumber");

const letterControls =
document.getElementById("letterControls");

const letterFinalMessage =
document.getElementById("letterFinalMessage");

const messagesOverlay =
document.getElementById("messagesOverlay");

const closeMessages =
document.getElementById("closeMessages");

const messagesContainer =
document.getElementById("messages");

const nameInput =
document.getElementById("nameInput");

const messageInput =
document.getElementById("messageInput");

const sendButton =
document.getElementById("sendButton");

const archiveButton =
document.getElementById("archiveButton");

const archive =
document.getElementById("archive");

const archiveList =
document.getElementById("archiveList");

const closeArchive =
document.getElementById("closeArchive");


/* =========================================================
   ESTADO
========================================================= */

let unlocked = false;

let currentPage = 0;

let pages = [];

let allMessages = [];

let currentMessageSheet = 0;


/* =========================================================
   CARREGAMENTO
========================================================= */

window.addEventListener(
  "load",
  function() {

    setTimeout(
      function() {

        loading.classList.add("hidden");

      },
      5000
    );

    carregarPaginas();

  }
);


/* =========================================================
   CARREGAR PÁGINAS DA CARTA
========================================================= */

/*
   Aqui está uma das principais correções.

   O site tenta encontrar:

   page-1.png
   page-2.png
   page-3.png
   page-4.png
   ...

   Quando encontra uma página, ela entra na carta.

   Quando chega a uma página que não existe,
   ela simplesmente é ignorada.

   Assim você não precisa informar quantas páginas
   existem.
*/

function carregarPaginas() {

  pagesContainer.innerHTML = "";

  pages = [];

  let carregadas = 0;

  let finalizado = false;


  /*
     Tentaremos encontrar até 50 páginas.
  */

  for (
    let number = 1;
    number <= 50;
    number++
  ) {

    const img =
      document.createElement("img");


    img.className =
      "letter-page";


    img.alt =
      "Página " + number;


    img.dataset.page =
      number;


    img.src =
      "./assets/page-" +
      number +
      ".png";


    img.onload =
      function() {

        carregadas++;

        /*
           Ordena as páginas depois que carregam.
        */

        pages =
          Array.from(
            pagesContainer
              .querySelectorAll(
                ".letter-page"
              )
          ).sort(
            function(a,b) {

              return (
                Number(a.dataset.page) -
                Number(b.dataset.page)
              );

            }
          );


        atualizarCarta();

      };


    img.onerror =
      function() {

        /*
           Se o arquivo não existir,
           removemos o elemento.
        */

        img.remove();

        /*
           Depois que já temos algumas páginas,
           atualizamos a interface.
        */

        if (carregadas > 0) {

          atualizarCarta();

        }

      };


    pagesContainer.appendChild(img);

  }


  /*
     Pequeno atraso para garantir que
     as páginas existentes tenham sido
     processadas.
  */

  setTimeout(
    function() {

      pages =
        Array.from(
          pagesContainer
            .querySelectorAll(
              ".letter-page"
            )
        ).sort(
          function(a,b) {

            return (
              Number(a.dataset.page) -
              Number(b.dataset.page)
            );

          }
        );


      atualizarCarta();

    },
    1000
  );

}


/* =========================================================
   ATUALIZAR CARTA
========================================================= */

function atualizarCarta() {

  if (pages.length === 0) {

    pageNumber.textContent =
      "nenhuma página";

    previousPage.disabled =
      true;

    nextPage.disabled =
      true;

    return;

  }


  if (
    currentPage >= pages.length
  ) {

    currentPage =
      pages.length - 1;

  }


  if (
    currentPage < 0
  ) {

    currentPage = 0;

  }


  pages.forEach(
    function(page, index) {

      page.classList.toggle(
        "active",
        index === currentPage
      );

    }
  );


  pageNumber.textContent =
    `${currentPage + 1} / ${pages.length}`;


  previousPage.disabled =
    currentPage === 0;


  nextPage.disabled =
    currentPage ===
    pages.length - 1;


  /*
     Mostra o aviso na última página.
  */

  if (
    currentPage ===
    pages.length - 1
  ) {

    letterFinalMessage
      .classList
      .add("visible");

  } else {

    letterFinalMessage
      .classList
      .remove("visible");

  }

}


/* =========================================================
   ABRIR SENHA
========================================================= */

function abrirSenha() {

  passwordOverlay
    .classList
    .remove("hidden");

  passwordInput.focus();

}


/* =========================================================
   LIVRO
========================================================= */

bookHotspot.addEventListener(
  "click",
  function() {

    if (!unlocked) {

      abrirSenha();

      passwordInput.dataset.action =
        "book";

      return;

    }

    abrirCarta();

  }
);


/* =========================================================
   CANETA
========================================================= */

penHotspot.addEventListener(
  "click",
  function() {

    if (!unlocked) {

      abrirSenha();

      passwordInput.dataset.action =
        "messages";

      return;

    }

    abrirMensagens();

  }
);


/* =========================================================
   SENHA
========================================================= */

unlockButton.addEventListener(
  "click",
  verificarSenha
);


passwordInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      verificarSenha();

    }

  }
);


function verificarSenha() {

  const value =
    passwordInput.value.trim();


  if (
    value === PASSWORD
  ) {

    unlocked = true;

    passwordOverlay
      .classList
      .add("hidden");

    passwordInput.value = "";

    passwordError.textContent = "";


    const action =
      passwordInput.dataset.action;


    if (
      action === "messages"
    ) {

      abrirMensagens();

    } else {

      abrirCarta();

    }


  } else {

    passwordError.textContent =
      "A senha não está correta.";

    passwordInput.select();

  }

}


cancelPassword.addEventListener(
  "click",
  function() {

    passwordOverlay
      .classList
      .add("hidden");

    passwordInput.value = "";

    passwordError.textContent = "";

  }
);


/* =========================================================
   ABRIR CARTA
========================================================= */

function abrirCarta() {

  currentPage = 0;

  atualizarCarta();

  letterOverlay
    .classList
    .remove("hidden");

}


/* =========================================================
   PÁGINA ANTERIOR
========================================================= */

previousPage.addEventListener(
  "click",
  function() {

    if (
      currentPage > 0
    ) {

      currentPage--;

      atualizarCarta();

    }

  }
);


/* =========================================================
   PRÓXIMA PÁGINA
========================================================= */

nextPage.addEventListener(
  "click",
  function() {

    if (
      currentPage <
      pages.length - 1
    ) {

      currentPage++;

      atualizarCarta();

    }

  }
);


/* =========================================================
   FECHAR CARTA
========================================================= */

closeLetter.addEventListener(
  "click",
  function() {

    letterOverlay
      .classList
      .add("hidden");

  }
);


/* =========================================================
   ABRIR MENSAGENS
========================================================= */

async function abrirMensagens() {

  messagesOverlay
    .classList
    .remove("hidden");

  await carregarMensagens();

}


/* =========================================================
   FECHAR MENSAGENS
========================================================= */

closeMessages.addEventListener(
  "click",
  function() {

    messagesOverlay
      .classList
      .add("hidden");

  }
);


/* =========================================================
   CARREGAR MENSAGENS
========================================================= */

async function carregarMensagens() {

  try {

    const response =
      await fetch(
        API_URL +
        "?action=messages&time=" +
        Date.now()
      );


    const data =
      await response.json();


    if (
      data.success &&
      Array.isArray(data.messages)
    ) {

      allMessages =
        data.messages;

    } else {

      allMessages = [];

    }

  } catch (error) {

    console.error(
      "Erro ao carregar mensagens:",
      error
    );

    allMessages = [];

  }


  renderizarFolhaAtual();

}


/* =========================================================
   ORGANIZAR FOLHAS
========================================================= */

function obterFolhas() {

  const sheets = [];


  for (
    let i = 0;
    i < allMessages.length;
    i += MESSAGES_PER_SHEET
  ) {

    sheets.push(
      allMessages.slice(
        i,
        i + MESSAGES_PER_SHEET
      )
    );

  }


  if (
    sheets.length === 0
  ) {

    sheets.push([]);

  }


  return sheets;

}


/* =========================================================
   RENDERIZAR FOLHA ATUAL
========================================================= */

function renderizarFolhaAtual() {

  const sheets =
    obterFolhas();


  currentMessageSheet =
    sheets.length - 1;


  renderizarSheet(
    currentMessageSheet
  );


  atualizarArquivo(
    sheets
  );

}


/* =========================================================
   RENDERIZAR FOLHA
========================================================= */

function renderizarSheet(index) {

  const sheets =
    obterFolhas();


  const sheet =
    sheets[index] || [];


  messagesContainer.innerHTML =
    "";


  if (
    sheet.length === 0
  ) {

    const empty =
      document.createElement("div");


    empty.className =
      "empty-message";


    empty.textContent =
      "ainda não há mensagens.";


    messagesContainer.appendChild(
      empty
    );


    return;

  }


  sheet.forEach(
    function(item) {

      const wrapper =
        document.createElement("div");


      wrapper.className =
        "message";


      const name =
        document.createElement("div");


      name.className =
        "message-name";


      name.textContent =
        item.name || "";


      const text =
        document.createElement("div");


      text.className =
        "message-text";


      text.textContent =
        item.message || "";


      const date =
        document.createElement("div");


      date.className =
        "message-date";


      date.textContent =
        formatarData(
          item.timestamp
        );


      wrapper.appendChild(name);

      wrapper.appendChild(text);

      wrapper.appendChild(date);


      messagesContainer.appendChild(
        wrapper
      );

    }
  );

}


/* =========================================================
   ARQUIVO DE FOLHAS
========================================================= */

function atualizarArquivo(sheets) {

  archiveList.innerHTML =
    "";


  const oldSheets =
    sheets.length - 1;


  if (
    oldSheets <= 0
  ) {

    const text =
      document.createElement("p");


    text.style.opacity =
      ".6";


    text.textContent =
      "Ainda não existem folhas anteriores.";


    archiveList.appendChild(
      text
    );


    return;

  }


  for (
    let i = oldSheets - 1;
    i >= 0;
    i--
  ) {

    const button =
      document.createElement("button");


    button.textContent =
      `folha ${i + 1}`;


    button.addEventListener(
      "click",
      function() {

        currentMessageSheet =
          i;


        renderizarSheet(i);


        archive
          .classList
          .add("hidden");

      }
    );


    archiveList.appendChild(
      button
    );

  }

}


/* =========================================================
   ABRIR ARQUIVO
========================================================= */

archiveButton.addEventListener(
  "click",
  function() {

    const sheets =
      obterFolhas();


    atualizarArquivo(
      sheets
    );


    archive
      .classList
      .remove("hidden");

  }
);


/* =========================================================
   FECHAR ARQUIVO
========================================================= */

closeArchive.addEventListener(
  "click",
  function() {

    archive
      .classList
      .add("hidden");

  }
);


/* =========================================================
   ENVIAR MENSAGEM
========================================================= */

sendButton.addEventListener(
  "click",
  enviarMensagem
);


messageInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      enviarMensagem();

    }

  }
);


async function enviarMensagem() {

  const name =
    nameInput.value.trim();


  const message =
    messageInput.value.trim();


  if (!name) {

    alert(
      "Antes de enviar, coloque seu nome."
    );

    nameInput.focus();

    return;

  }


  if (!message) {

    alert(
      "Escreva uma mensagem."
    );

    messageInput.focus();

    return;

  }


  sendButton.disabled =
    true;


  sendButton.textContent =
    "enviando...";


  try {

    const response =
      await fetch(
        API_URL,
        {
          method:
            "POST",

          headers:
            {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

          body:
            JSON.stringify(
              {
                name:
                  name,

                message:
                  message
              }
            )

        }
      );


    const data =
      await response.json();


    if (
      !data.success
    ) {

      throw new Error(
        data.error ||
        "Erro ao salvar."
      );

    }


    nameInput.value =
      "";

    messageInput.value =
      "";


    await carregarMensagens();


    alert(
      "Mensagem guardada."
    );


  } catch (error) {

    console.error(
      error
    );


    alert(
      "Não foi possível salvar a mensagem. Verifique a publicação do Google Apps Script."
    );

  }


  sendButton.disabled =
    false;


  sendButton.textContent =
    "enviar";

}


/* =========================================================
   DATA
========================================================= */

function formatarData(value) {

  if (!value) {

    return "";

  }


  try {

    const date =
      new Date(value);


    if (
      isNaN(
        date.getTime()
      )
    ) {

      return "";

    }


    return date.toLocaleString(
      "pt-BR",
      {
        day:
          "2-digit",

        month:
          "2-digit",

        year:
          "numeric",

        hour:
          "2-digit",

        minute:
          "2-digit"
      }
    );

  } catch {

    return "";

  }

}


/* =========================================================
   TECLADO
========================================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key !== "Escape"
    ) {

      return;

    }


    passwordOverlay
      .classList
      .add("hidden");


    letterOverlay
      .classList
      .add("hidden");


    messagesOverlay
      .classList
      .add("hidden");


    archive
      .classList
      .add("hidden");

  }
);


/* =========================================================
   SWIPE NO CELULAR
========================================================= */

let touchStartX = 0;


letterWindow.addEventListener(
  "touchstart",
  function(event) {

    touchStartX =
      event.changedTouches[0].screenX;

  },
  {
    passive: true
  }
);


letterWindow.addEventListener(
  "touchend",
  function(event) {

    const touchEndX =
      event.changedTouches[0].screenX;


    const difference =
      touchEndX -
      touchStartX;


    if (
      Math.abs(difference) <
      50
    ) {

      return;

    }


    if (
      difference < 0
    ) {

      if (
        currentPage <
        pages.length - 1
      ) {

        currentPage++;

        atualizarCarta();

      }

    } else {

      if (
        currentPage > 0
      ) {

        currentPage--;

        atualizarCarta();

      }

    }

  },
  {
    passive: true
  }
);

</script>
