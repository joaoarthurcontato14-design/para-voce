<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#283b54"
>

<title>para você.</title>

<script src="config.js"></script>

<style>

/* =========================================================
   CONFIGURAÇÕES
========================================================= */

:root {

  --blue: #283b54;
  --blue-dark: #1d2c40;

  --paper: #f4f0e5;
  --paper-dark: #e9e3d5;

  --ink: #242424;

}


/* =========================================================
   RESET
========================================================= */

* {

  box-sizing: border-box;

  margin: 0;

  padding: 0;

}


html,
body {

  width: 100%;
  height: 100%;

  overflow: hidden;

}


body {

  background:
    var(--blue);

  color:
    white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

}


/* =========================================================
   APP
========================================================= */

#app {

  width: 100vw;
  height: 100dvh;

  overflow: hidden;

  position: relative;

  background:
    var(--blue);

}


/* =========================================================
   CARREGAMENTO
========================================================= */

.loader {

  position: fixed;

  inset: 0;

  z-index: 9999;

  background:
    var(--blue);

  display: flex;

  align-items: center;

  justify-content: center;

  text-align: center;

  transition:
    opacity .8s ease,
    visibility .8s ease;

}


.loader.hide {

  opacity: 0;

  visibility: hidden;

  pointer-events: none;

}


.loader-inner {

  animation:
    loaderAppear 1.5s ease both;

}


.loader-title {

  font:
    400 clamp(28px, 5vw, 52px)
    /1.1 Georgia, serif;

  letter-spacing:
    .02em;

}


.loader-sub {

  margin-top:
    16px;

  font-size:
    12px;

  letter-spacing:
    .14em;

  text-transform:
    uppercase;

  opacity:
    .55;

}


.loader-line {

  width:
    70px;

  height:
    1px;

  background:
    rgba(255,255,255,.55);

  margin:
    28px auto 0;

  animation:
    loaderLine 5s linear both;

}


@keyframes loaderAppear {

  from {

    opacity: 0;

    transform:
      translateY(12px);

  }

  to {

    opacity: 1;

    transform:
      translateY(0);

  }

}


@keyframes loaderLine {

  from {

    transform:
      scaleX(0);

    transform-origin:
      left;

  }

  to {

    transform:
      scaleX(1);

    transform-origin:
      left;

  }

}


/* =========================================================
   CENA PRINCIPAL
========================================================= */

/*
   A cena agora NÃO ocupa 100vw x 100vh diretamente.

   Ela mantém a proporção da imagem.

   Isso é o que faz os objetos clicáveis acompanharem
   exatamente a imagem no celular e no computador.
*/


.scene {

  position:
    absolute;

  inset:
    0;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  background:
    var(--blue);

}


/*
   MOLDURA DA IMAGEM

   Se sua imagem for 16:9, isto funciona perfeitamente.

   A imagem NÃO será esticada.
*/


.scene-frame {

  position:
    relative;

  width:
    min(100vw, 177.7778vh);

  aspect-ratio:
    16 / 9;

  max-width:
    100vw;

  max-height:
    100dvh;

  flex:
    0 0 auto;

}


/*
   A imagem ocupa exatamente a moldura.
*/


.scene-frame img {

  position:
    absolute;

  inset:
    0;

  width:
    100%;

  height:
    100%;

  display:
    block;

  object-fit:
    fill;

  user-select:
    none;

  -webkit-user-drag:
    none;

}


/* =========================================================
   ÁREAS CLICÁVEIS
========================================================= */

.hotspot {

  position:
    absolute;

  display:
    block;

  border:
    0;

  padding:
    0;

  margin:
    0;

  background:
    transparent;

  cursor:
    pointer;

  z-index:
    20;

  touch-action:
    manipulation;

  -webkit-tap-highlight-color:
    transparent;

}


/*
   IMPORTANTE:

   Estes valores agora são relativos à IMAGEM,
   não à tela.

   Se precisar ajustar alguma coisa depois,
   você só mexe aqui.
*/


/* ---------- LIVRO ---------- */

.book-hotspot {

  left:
    35%;

  top:
    33%;

  width:
    30%;

  height:
    49%;

}


/* ---------- CANETA ---------- */

.pen-hotspot {

  left:
    68%;

  top:
    70%;

  width:
    27%;

  height:
    17%;

}


/* ---------- GLOBO ---------- */

.globe-hotspot {

  left:
    3%;

  top:
    3%;

  width:
    35%;

  height:
    48%;

}


/* ---------- CALENDÁRIO ---------- */

.calendar-hotspot {

  left:
    57%;

  top:
    5%;

  width:
    27%;

  height:
    31%;

}


/* ---------- CADILLAC ---------- */

.car-hotspot {

  left:
    66%;

  top:
    28%;

  width:
    32%;

  height:
    38%;

}


/*
   Não aparece no site.

   Serve apenas para mostrar foco
   quando alguém navega pelo teclado.
*/


.hotspot:focus-visible {

  outline:
    2px solid
    rgba(255,255,255,.8);

  outline-offset:
    4px;

  border-radius:
    12px;

}


/* =========================================================
   TEXTO DE AJUDA
========================================================= */

.hint {

  position:
    absolute;

  left:
    50%;

  bottom:
    14px;

  transform:
    translateX(-50%);

  font-size:
    10px;

  letter-spacing:
    .1em;

  text-transform:
    uppercase;

  opacity:
    .35;

  pointer-events:
    none;

  white-space:
    nowrap;

}


/* =========================================================
   MODAL DE SENHA
========================================================= */

.hidden {

  display:
    none !important;

}


.modal-backdrop {

  position:
    fixed;

  inset:
    0;

  z-index:
    500;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  padding:
    18px;

  background:
    rgba(18,29,42,.90);

  backdrop-filter:
    blur(14px);

  -webkit-backdrop-filter:
    blur(14px);

}


.modal {

  width:
    min(420px, 92vw);

  background:
    rgba(248,246,239,.98);

  color:
    #202020;

  border-radius:
    24px;

  padding:
    32px;

  box-shadow:
    0 30px 100px
    rgba(0,0,0,.5);

  text-align:
    center;

}


.modal h2 {

  font:
    400 25px Georgia, serif;

  margin:
    0 0 9px;

}


.modal p {

  color:
    #666;

  line-height:
    1.5;

  font-size:
    14px;

  margin:
    0 0 20px;

}


.modal input {

  width:
    100%;

  height:
    50px;

  border:
    1px solid #d6d0c4;

  background:
    #fffdf8;

  color:
    #222;

  border-radius:
    13px;

  padding:
    0 14px;

  font-size:
    16px;

  outline:
    none;

  text-align:
    center;

  margin-bottom:
    14px;

}


.modal input:focus {

  border-color:
    var(--blue);

}


button {

  border:
    none;

  border-radius:
    999px;

  background:
    var(--blue);

  color:
    white;

  padding:
    12px 19px;

  cursor:
    pointer;

  font:
    inherit;

}


button.secondary {

  background:
    transparent;

  color:
    #333;

  border:
    1px solid #cfc7b8;

  margin-left:
    6px;

}


.error {

  color:
    #a04a4a !important;

  min-height:
    20px;

  margin-top:
    12px !important;

  margin-bottom:
    0 !important;

}


/* =========================================================
   CARTA
========================================================= */

.letter-overlay {

  position:
    fixed;

  inset:
    0;

  z-index:
    700;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  padding:
    12px;

  background:
    rgba(18,29,42,.94);

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);

}


.letter-window {

  position:
    relative;

  width:
    min(90vw, 820px);

  height:
    min(82vh, 720px);

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

}


/*
   A página nunca poderá ultrapassar
   a janela ou a tela.
*/


.letter-page {

  display:
    none;

  max-width:
    100%;

  max-height:
    100%;

  width:
    auto;

  height:
    auto;

  object-fit:
    contain;

  background:
    white;

  box-shadow:
    0 30px 90px
    rgba(0,0,0,.55);

}


.letter-page.active {

  display:
    block;

}


/* ---------- FECHAR ---------- */

.close-button {

  position:
    fixed;

  top:
    18px;

  right:
    18px;

  z-index:
    800;

  width:
    42px;

  height:
    42px;

  padding:
    0;

  border-radius:
    50%;

  background:
    rgba(0,0,0,.65);

  font-size:
    22px;

}


/* ---------- CONTROLES ---------- */

.letter-controls {

  position:
    absolute;

  left:
    50%;

  bottom:
    -58px;

  transform:
    translateX(-50%);

  display:
    flex;

  align-items:
    center;

  gap:
    8px;

  padding:
    7px;

  background:
    rgba(0,0,0,.75);

  border-radius:
    999px;

}


.letter-controls button {

  width:
    40px;

  height:
    40px;

  padding:
    0;

}


.letter-controls button:disabled {

  opacity:
    .25;

  cursor:
    default;

}


.page-number {

  min-width:
    65px;

  text-align:
    center;

  font-size:
    12px;

}


/* ---------- ÚLTIMA PÁGINA ---------- */

.last-note {

  position:
    absolute;

  left:
    50%;

  bottom:
    -105px;

  transform:
    translateX(-50%);

  padding:
    10px 16px;

  border-radius:
    999px;

  background:
    rgba(40,59,84,.95);

  font-size:
    12px;

  white-space:
    nowrap;

}


/* =========================================================
   MENSAGENS
========================================================= */

.messages-overlay {

  position:
    fixed;

  inset:
    0;

  z-index:
    800;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  padding:
    15px;

  background:
    rgba(18,29,42,.94);

  backdrop-filter:
    blur(12px);

}


.paper-wrap {

  width:
    min(900px, 94vw);

  height:
    min(86vh, 820px);

  position:
    relative;

}


.paper {

  position:
    relative;

  width:
    100%;

  height:
    100%;

  background:
    linear-gradient(
      135deg,
      #f8f5ed,
      #eee8da
    );

  color:
    #242424;

  box-shadow:
    0 30px 100px
    rgba(0,0,0,.55);

  padding:
    clamp(28px,5vw,60px);

  overflow:
    hidden;

}


.paper::after {

  content:
    "";

  position:
    absolute;

  inset:
    18px;

  border:
    1px solid
    rgba(40,40,40,.08);

  pointer-events:
    none;

}


.paper h1 {

  position:
    relative;

  z-index:
    2;

  font:
    400 clamp(20px,3vw,28px)
    Georgia, serif;

  text-align:
    center;

  margin:
    0 0 25px;

}


/* =========================================================
   MENSAGENS DENTRO DA FOLHA
========================================================= */

.messages {

  position:
    absolute;

  left:
    7%;

  right:
    7%;

  top:
    18%;

  bottom:
    27%;

  overflow-y:
    auto;

  overflow-x:
    hidden;

  padding-right:
    8px;

}


.message {

  font-family:
    "Segoe Print",
    "Bradley Hand",
    cursive;

  margin:
    0 0 22px;

  transform:
    rotate(var(--rot));

  white-space:
    pre-wrap;

}


.message-name {

  font-weight:
    700;

  font-size:
    16px;

}


.message-text {

  font-size:
    15px;

  line-height:
    1.45;

}


.message-date {

  font:
    10px
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  opacity:
    .42;

  margin-top:
    4px;

}


.empty {

  opacity:
    .45;

  text-align:
    center;

  margin-top:
    70px;

  font-family:
    Georgia, serif;

}


/* =========================================================
   FORMULÁRIO
========================================================= */

.message-form {

  position:
    absolute;

  left:
    7%;

  right:
    7%;

  bottom:
    5%;

  display:
    grid;

  grid-template-columns:
    150px 1fr auto;

  gap:
    8px;

  z-index:
    5;

}


.message-form input,
.message-form textarea {

  width:
    100%;

  border:
    1px solid #d6d0c4;

  background:
    #fffdf8;

  color:
    #222;

  border-radius:
    13px;

  padding:
    13px 14px;

  font:
    inherit;

  outline:
    none;

}


.message-form input:focus,
.message-form textarea:focus {

  border-color:
    var(--blue);

}


.message-form textarea {

  height:
    52px;

  resize:
    none;

}


/* =========================================================
   BOTÕES DA FOLHA
========================================================= */

.archive-button {

  position:
    absolute;

  top:
    18px;

  left:
    18px;

  z-index:
    10;

  background:
    rgba(40,59,84,.92);

  font-size:
    12px;

}


.messages-close {

  position:
    absolute;

  top:
    18px;

  right:
    18px;

  z-index:
    10;

  width:
    42px;

  height:
    42px;

  padding:
    0;

  border-radius:
    50%;

  background:
    rgba(0,0,0,.65);

  font-size:
    22px;

}


/* =========================================================
   ARQUIVO
========================================================= */

.archive {

  position:
    fixed;

  inset:
    0;

  z-index:
    900;

  background:
    rgba(18,29,42,.97);

  display:
    flex;

  flex-direction:
    column;

  align-items:
    center;

  justify-content:
    center;

  padding:
    20px;

}


.archive h2 {

  font:
    400 25px Georgia, serif;

  margin:
    0 0 20px;

}


.archive-list {

  display:
    flex;

  gap:
    10px;

  flex-wrap:
    wrap;

  justify-content:
    center;

  max-width:
    700px;

}


.archive-list button {

  background:
    var(--paper);

  color:
    #222;

}


.archive-close {

  position:
    absolute;

  top:
    20px;

  right:
    20px;

}


/* =========================================================
   TOAST
========================================================= */

.toast {

  position:
    fixed;

  left:
    50%;

  bottom:
    25px;

  transform:
    translateX(-50%)
    translateY(20px);

  background:
    #111;

  color:
    white;

  padding:
    12px 18px;

  border-radius:
    999px;

  opacity:
    0;

  pointer-events:
    none;

  transition:
    .3s;

  z-index:
    1000;

  font-size:
    13px;

}


.toast.show {

  opacity:
    1;

  transform:
    translateX(-50%)
    translateY(0);

}


/* =========================================================
   CELULAR
========================================================= */

@media (max-width: 700px) {

  /*
     A moldura continua proporcional.
     Ela agora nunca ultrapassa a tela.
  */

  .scene-frame {

    width:
      100vw;

    height:
      auto;

    aspect-ratio:
      16 / 9;

  }


  /*
     Se o celular for mais alto que largo,
     a imagem continua inteira no centro.
  */

  .scene {

    overflow:
      hidden;

  }


  .hint {

    bottom:
      8px;

    font-size:
      8px;

  }


  /*
     Hotspots menores no celular.
  */

  .book-hotspot {

    left:
      34%;

    top:
      34%;

    width:
      32%;

    height:
      47%;

  }


  .pen-hotspot {

    left:
      67%;

    top:
      70%;

    width:
      28%;

    height:
      17%;

  }


  .globe-hotspot {

    left:
      3%;

    top:
      3%;

    width:
      35%;

    height:
      48%;

  }


  .calendar-hotspot {

    left:
      57%;

    top:
      5%;

    width:
      27%;

    height:
      31%;

  }


  .car-hotspot {

    left:
      65%;

    top:
      28%;

    width:
      33%;

    height:
      38%;

  }


  /* CARTA */

  .letter-overlay {

    padding:
      8px;

  }


  .letter-window {

    width:
      96vw;

    height:
      78vh;

  }


  .letter-page {

    max-width:
      96vw;

    max-height:
      78vh;

  }


  .letter-controls {

    bottom:
      -55px;

  }


  .last-note {

    bottom:
      -100px;

    font-size:
      10px;

    max-width:
      90vw;

    text-align:
      center;

  }


  /* MENSAGENS */

  .paper-wrap {

    width:
      94vw;

    height:
      90vh;

  }


  .paper {

    padding:
      28px 22px;

  }


  .paper h1 {

    font-size:
      17px;

  }


  .messages {

    top:
      17%;

    bottom:
      31%;

  }


  .message-form {

    left:
      7%;

    right:
      7%;

    bottom:
      3%;

    grid-template-columns:
      1fr;

  }


  .message-form input,
  .message-form textarea,
  .message-form button {

    width:
      100%;

  }


  .message-form textarea {

    height:
      55px;

  }

}


/* =========================================================
   TELAS MUITO PEQUENAS
========================================================= */

@media (max-height: 600px) {

  .letter-window {

    height:
      72vh;

  }


  .letter-page {

    max-height:
      72vh;

  }


  .paper-wrap {

    height:
      88vh;

  }

}


/* =========================================================
   DESATIVAR SELEÇÃO
========================================================= */

button {

  -webkit-tap-highlight-color:
    transparent;

}


button:focus-visible {

  outline:
    2px solid white;

  outline-offset:
    3px;

}

</style>

</head>


<body>

<div id="app">


<!-- =====================================================
     CENA PRINCIPAL
===================================================== -->

<div class="scene">

  <div class="scene-frame">


    <!-- IMAGEM PRINCIPAL -->

    <img
      src="assets/interface.png"
      alt="Mesa com livro, globo, calendário, Cadillac e caneta"
    >


    <!-- =================================================
         GLOBO
    ================================================== -->

    <button
      class="hotspot globe-hotspot"
      id="globeHotspot"
      aria-label="Globo"
      title="Globo"
    ></button>


    <!-- =================================================
         CALENDÁRIO
    ================================================== -->

    <button
      class="hotspot calendar-hotspot"
      id="calendarHotspot"
      aria-label="Calendário"
      title="Calendário"
    ></button>


    <!-- =================================================
         CADILLAC
    ================================================== -->

    <button
      class="hotspot car-hotspot"
      id="carHotspot"
      aria-label="Cadillac"
      title="Cadillac"
    ></button>


    <!-- =================================================
         LIVRO
    ================================================== -->

    <button
      class="hotspot book-hotspot"
      id="book"
      aria-label="Abrir carta"
      title="Abrir carta"
    ></button>


    <!-- =================================================
         CANETA
    ================================================== -->

    <button
      class="hotspot pen-hotspot"
      id="pen"
      aria-label="Escrever mensagem"
      title="Escrever mensagem"
    ></button>


  </div>


  <div class="hint">
    toque nos objetos
  </div>


</div>


<!-- =====================================================
     CARREGAMENTO
===================================================== -->

<div
  class="loader"
  id="loader"
>

  <div class="loader-inner">

    <div class="loader-title">
      Um Ano Depois...
    </div>

    <div class="loader-sub">
      Feito por João Arthur.
    </div>

    <div class="loader-line"></div>

  </div>

</div>


<!-- =====================================================
     SENHA
===================================================== -->

<div
  class="modal-backdrop hidden"
  id="passwordOverlay"
>

  <div class="modal">

    <h2>
      Teu aniversário
    </h2>

    <p>
      Para continuar, digite a data
      somente com números.
    </p>

    <input
      id="passwordInput"
      type="password"
      inputmode="numeric"
      maxlength="8"
      placeholder="DDMMAAAA"
      autocomplete="off"
    >

    <div>

      <button
        id="unlockButton"
      >
        abrir
      </button>

      <button
        class="secondary"
        id="cancelPassword"
      >
        cancelar
      </button>

    </div>

    <p
      class="error"
      id="passwordError"
    ></p>

  </div>

</div>


<!-- =====================================================
     CARTA
===================================================== -->

<div
  class="letter-overlay hidden"
  id="letterOverlay"
>

  <button
    class="close-button"
    id="closeLetter"
    aria-label="Fechar carta"
  >
    ×
  </button>


  <div class="letter-window">


    <!-- PÁGINA 1 -->

    <img
      class="letter-page active"
      src="assets/letter/page-1.png"
      alt="Página 1"
    >


    <!-- PÁGINA 2 -->

    <img
      class="letter-page"
      src="assets/letter/page-2.png"
      alt="Página 2"
    >


    <!-- PÁGINA 3 -->

    <img
      class="letter-page"
      src="assets/letter/page-3.png"
      alt="Página 3"
    >


    <!-- PÁGINA 4 -->

    <img
      class="letter-page"
      src="assets/letter/page-4.png"
      alt="Página 4"
    >


    <!-- CONTROLES -->

    <div class="letter-controls">

      <button
        id="previousPage"
        aria-label="Página anterior"
      >
        ←
      </button>

      <span
        class="page-number"
        id="pageNumber"
      >
        1 / 4
      </span>

      <button
        id="nextPage"
        aria-label="Próxima página"
      >
        →
      </button>

    </div>


    <!-- ÚLTIMA PÁGINA -->

    <div
      class="last-note hidden"
      id="lastNote"
    >
      Deixe uma mensagem ou comentário na caneta encima da mesa
    </div>


  </div>

</div>


<!-- =====================================================
     MENSAGENS
===================================================== -->

<div
  class="messages-overlay hidden"
  id="messagesOverlay"
>

  <div class="paper-wrap">

    <div class="paper">


      <button
        class="archive-button"
        id="archiveButton"
      >
        folhas anteriores
      </button>


      <button
        class="messages-close"
        id="closeMessages"
        aria-label="Fechar mensagens"
      >
        ×
      </button>


      <h1>

        if u have something to say,<br>
        say it here.

      </h1>


      <div
        class="messages"
        id="messages"
      ></div>


      <div class="message-form">

        <input
          id="nameInput"
          maxlength="80"
          placeholder="teu nome"
        >


        <textarea
          id="messageInput"
          maxlength="2000"
          placeholder="escreva aqui..."
        ></textarea>


        <button
          id="sendButton"
        >
          enviar
        </button>

      </div>


    </div>

  </div>

</div>


<!-- =====================================================
     ARQUIVO
===================================================== -->

<div
  class="archive hidden"
  id="archive"
>

  <button
    class="archive-close"
    id="closeArchive"
  >
    fechar
  </button>


  <h2>
    folhas anteriores
  </h2>


  <div
    class="archive-list"
    id="archiveList"
  ></div>

</div>


<!-- =====================================================
     TOAST
===================================================== -->

<div
  class="toast"
  id="toast"
></div>


</div>


<script>

/* =========================================================
   CONFIGURAÇÕES
========================================================= */

const CONFIG = {

  PASSWORD:
    "25102008",

  API_URL:
    window.SITE_CONFIG?.API_URL || "",

  MESSAGES_PER_SHEET:
    6

};


/* =========================================================
   ESTADO
========================================================= */

let unlocked =
  false;

let currentPage =
  0;

let allMessages =
  [];

let currentSheet =
  0;

let pendingAction =
  null;


/* =========================================================
   FUNÇÃO AUXILIAR
========================================================= */

const $ =
  id =>
    document.getElementById(id);


/* =========================================================
   PÁGINAS
========================================================= */

const pages =
  [
    ...document.querySelectorAll(
      ".letter-page"
    )
  ];


/* =========================================================
   CARREGAMENTO
========================================================= */

window.addEventListener(
  "load",
  function() {

    setTimeout(
      function() {

        $("loader")
          .classList
          .add("hide");

      },
      5000
    );

  }
);


/* =========================================================
   TOAST
========================================================= */

function toast(text) {

  $("toast").textContent =
    text;

  $("toast")
    .classList
    .add("show");


  setTimeout(
    function() {

      $("toast")
        .classList
        .remove("show");

    },
    2600
  );

}


/* =========================================================
   SENHA
========================================================= */

function askPassword(
  action
) {

  pendingAction =
    action;

  $("passwordOverlay")
    .classList
    .remove("hidden");

  $("passwordInput")
    .focus();

}


$("book").onclick =
  function() {

    if (unlocked) {

      openLetter();

    } else {

      askPassword(
        "letter"
      );

    }

  };


$("pen").onclick =
  function() {

    if (unlocked) {

      openMessages();

    } else {

      askPassword(
        "messages"
      );

    }

  };


$("cancelPassword").onclick =
  function() {

    $("passwordOverlay")
      .classList
      .add("hidden");

    $("passwordInput")
      .value = "";

    $("passwordError")
      .textContent = "";

  };


$("unlockButton").onclick =
  verifyPassword;


$("passwordInput").onkeydown =
  function(event) {

    if (
      event.key ===
      "Enter"
    ) {

      verifyPassword();

    }

  };


function verifyPassword() {

  const value =
    $("passwordInput")
      .value
      .trim();


  if (
    value ===
    CONFIG.PASSWORD
  ) {

    unlocked =
      true;


    $("passwordOverlay")
      .classList
      .add("hidden");


    $("passwordInput")
      .value = "";


    $("passwordError")
      .textContent = "";


    if (
      pendingAction ===
      "letter"
    ) {

      openLetter();

    } else {

      openMessages();

    }


  } else {

    $("passwordError")
      .textContent =
      "A senha não está correta.";


    $("passwordInput")
      .select();

  }

}


/* =========================================================
   CARTA
========================================================= */

function openLetter() {

  currentPage =
    0;

  updatePage();

  $("letterOverlay")
    .classList
    .remove("hidden");

}


function updatePage() {

  pages.forEach(
    function(page, index) {

      page.classList.toggle(
        "active",
        index === currentPage
      );

    }
  );


  $("pageNumber")
    .textContent =
    `${currentPage + 1} / ${pages.length}`;


  $("previousPage")
    .disabled =
    currentPage === 0;


  $("nextPage")
    .disabled =
    currentPage ===
    pages.length - 1;


  $("lastNote")
    .classList
    .toggle(
      "hidden",
      currentPage !==
      pages.length - 1
    );

}


$("previousPage").onclick =
  function() {

    if (
      currentPage > 0
    ) {

      currentPage--;

      updatePage();

    }

  };


$("nextPage").onclick =
  function() {

    if (
      currentPage <
      pages.length - 1
    ) {

      currentPage++;

      updatePage();

    }

  };


$("closeLetter").onclick =
  function() {

    $("letterOverlay")
      .classList
      .add("hidden");

  };


/* =========================================================
   MENSAGENS
========================================================= */

function openMessages() {

  $("messagesOverlay")
    .classList
    .remove("hidden");

  loadMessages();

}


$("closeMessages").onclick =
  function() {

    $("messagesOverlay")
      .classList
      .add("hidden");

  };


/* =========================================================
   FOLHAS
========================================================= */

function sheets() {

  const result =
    [];


  for (
    let i = 0;
    i <
    allMessages.length;
    i +=
    CONFIG.MESSAGES_PER_SHEET
  ) {

    result.push(
      allMessages.slice(
        i,
        i +
        CONFIG.MESSAGES_PER_SHEET
      )
    );

  }


  if (
    result.length === 0
  ) {

    result.push([]);

  }


  return result;

}


/* =========================================================
   RENDERIZAR FOLHA
========================================================= */

function renderSheet(
  index
) {

  const list =
    sheets();


  const sheet =
    list[index] || [];


  $("messages")
    .innerHTML = "";


  if (
    sheet.length === 0
  ) {

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "empty";


    empty.textContent =
      "ainda não há mensagens.";


    $("messages")
      .appendChild(
        empty
      );


    return;

  }


  sheet.forEach(
    function(item) {

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "message";


      wrapper.style
        .setProperty(
          "--rot",
          (
            Math.random() * 2 -
            1
          ).toFixed(2)
          + "deg"
        );


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "message-name";


      name.textContent =
        item.name;


      const text =
        document.createElement(
          "div"
        );


      text.className =
        "message-text";


      text.textContent =
        item.message;


      const date =
        document.createElement(
          "div"
        );


      date.className =
        "message-date";


      date.textContent =
        formatDate(
          item.timestamp
        );


      wrapper.append(
        name,
        text,
        date
      );


      $("messages")
        .appendChild(
          wrapper
        );

    }
  );

}


/* =========================================================
   ATUALIZAR
========================================================= */

function refresh() {

  const list =
    sheets();


  currentSheet =
    list.length - 1;


  renderSheet(
    currentSheet
  );


  buildArchive(
    list
  );

}


/* =========================================================
   ARQUIVO
========================================================= */

function buildArchive(
  list
) {

  $("archiveList")
    .innerHTML = "";


  if (
    list.length <= 1
  ) {

    const text =
      document.createElement(
        "p"
      );


    text.style.opacity =
      ".6";


    text.textContent =
      "Ainda não existem folhas anteriores.";


    $("archiveList")
      .appendChild(
        text
      );


    return;

  }


  for (
    let i = 0;
    i < list.length - 1;
    i++
  ) {

    const button =
      document.createElement(
        "button"
      );


    button.textContent =
      `folha ${i + 1}`;


    button.onclick =
      function() {

        $("archive")
          .classList
          .add("hidden");


        currentSheet =
          i;


        renderSheet(i);

      };


    $("archiveList")
      .appendChild(
        button
      );

  }

}


$("archiveButton").onclick =
  function() {

    $("archive")
      .classList
      .remove("hidden");


    buildArchive(
      sheets()
    );

  };


$("closeArchive").onclick =
  function() {

    $("archive")
      .classList
      .add("hidden");

  };


/* =========================================================
   CARREGAR MENSAGENS
========================================================= */

async function loadMessages() {

  if (
    !CONFIG.API_URL
  ) {

    allMessages =
      [];

    refresh();

    return;

  }


  try {

    const data =
      await jsonp(
        "messages"
      );


    if (
      data &&
      data.success
    ) {

      allMessages =
        Array.isArray(
          data.messages
        )
          ? data.messages
          : [];

    } else {

      allMessages =
        [];

    }


  } catch (error) {

    console.error(
      error
    );


    toast(
      "Não foi possível carregar as mensagens."
    );

  }


  refresh();

}


/* =========================================================
   JSONP
========================================================= */

function jsonp(
  action,
  extra = {}
) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "cb_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 9999
        );


      const script =
        document.createElement(
          "script"
        );


      const params =
        new URLSearchParams({

          action:
            action,

          callback:
            callbackName,

          _:
            Date.now(),

          ...extra

        });


      window[callbackName] =
        function(data) {

          delete window[
            callbackName
          ];

          script.remove();

          resolve(data);

        };


      script.onerror =
        function() {

          delete window[
            callbackName
          ];

          script.remove();

          reject(
            new Error(
              "API indisponível"
            )
          );

        };


      script.src =
        CONFIG.API_URL +
        "?" +
        params.toString();


      document.body
        .appendChild(
          script
        );


      setTimeout(
        function() {

          if (
            window[
              callbackName
            ]
          ) {

            delete window[
              callbackName
            ];

            script.remove();

            reject(
              new Error(
                "timeout"
              )
            );

          }

        },
        12000
      );

    }
  );

}


/* =========================================================
   ENVIAR MENSAGEM
========================================================= */

$("sendButton").onclick =
  sendMessage;


$("messageInput").onkeydown =
  function(event) {

    if (
      event.key ===
      "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  };


async function sendMessage() {

  const name =
    $("nameInput")
      .value
      .trim();


  const message =
    $("messageInput")
      .value
      .trim();


  if (!name) {

    toast(
      "Coloque seu nome."
    );


    $("nameInput")
      .focus();


    return;

  }


  if (!message) {

    toast(
      "Escreva uma mensagem."
    );


    $("messageInput")
      .focus();


    return;

  }


  if (
    !CONFIG.API_URL
  ) {

    toast(
      "Configure a URL do Apps Script."
    );


    return;

  }


  $("sendButton")
    .disabled =
    true;


  $("sendButton")
    .textContent =
    "enviando...";


  try {

    const data =
      await jsonp(
        "save",
        {
          name:
            name,

          message:
            message
        }
      );


    if (
      !data ||
      !data.success
    ) {

      throw new Error(
        data?.error ||
        "erro"
      );

    }


    $("nameInput")
      .value = "";


    $("messageInput")
      .value = "";


    toast(
      "Mensagem guardada."
    );


    await loadMessages();


  } catch (error) {

    console.error(
      error
    );


    toast(
      "Não foi possível salvar. Verifique a implantação do Apps Script."
    );

  } finally {

    $("sendButton")
      .disabled =
      false;


    $("sendButton")
      .textContent =
      "enviar";

  }

}


/* =========================================================
   DATA
========================================================= */

function formatDate(
  value
) {

  const date =
    new Date(value);


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return "";

  }


  return date.toLocaleString(
    "pt-BR",
    {

      day:
        "2-digit",

      month:
        "2-digit",

      year:
        "numeric",

      hour:
        "2-digit",

      minute:
        "2-digit"

    }
  );

}


/* =========================================================
   OBJETOS DECORATIVOS
========================================================= */

$("globeHotspot").onclick =
  function() {

    toast(
      "Recife, PE  ·  Cacoal, RO"
    );

  };


$("calendarHotspot").onclick =
  function() {

    toast(
      "10 de agosto de 2025"
    );

  };


$("carHotspot").onclick =
  function() {

    toast(
      "Cadillac Escalade"
    );

  };


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key ===
      "Escape"
    ) {

      document
        .querySelectorAll(
          ".modal-backdrop," +
          ".letter-overlay," +
          ".messages-overlay," +
          ".archive"
        )
        .forEach(
          function(element) {

            element
              .classList
              .add("hidden");

          }
        );

    }

  }
);

</script>

</body>
