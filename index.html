<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>para você.</title>

<style>

/* =========================================================
   CONFIGURAÇÕES GERAIS
========================================================= */

:root {
  --blue: #283b54;
  --blue-dark: #1d2c40;

  --paper: #f7f3e9;
  --ink: #242424;

  --white: #ffffff;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
}

body {

  overflow: hidden;

  background: var(--blue);

  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}


/* =========================================================
   APP
========================================================= */

#app {

  width: 100vw;
  height: 100vh;

  position: relative;

  overflow: hidden;

}


/* =========================================================
   TELA INICIAL
========================================================= */

.loading {

  position: fixed;

  inset: 0;

  z-index: 9999;

  background: var(--blue);

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  color: white;

  transition:
    opacity .8s ease,
    visibility .8s ease;

}

.loading.hide {

  opacity: 0;

  visibility: hidden;

}

.loading-title {

  font-family: Georgia, serif;

  font-size: clamp(22px, 4vw, 34px);

  letter-spacing: .5px;

  margin-bottom: 12px;

}

.loading-subtitle {

  font-size: 12px;

  opacity: .55;

}

.loading-line {

  width: 90px;

  height: 1px;

  background: rgba(255,255,255,.4);

  margin-top: 25px;

  overflow: hidden;

}

.loading-line::after {

  content: "";

  display: block;

  width: 40%;

  height: 100%;

  background: white;

  animation:
    loading 1.4s infinite ease-in-out;

}

@keyframes loading {

  0% {
    transform: translateX(-120%);
  }

  100% {
    transform: translateX(350%);
  }

}


/* =========================================================
   INTERFACE PRINCIPAL
========================================================= */

.scene {

  position: absolute;

  inset: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  background: var(--blue);

}


/*
   A imagem inteira fica dentro deste elemento.

   IMPORTANTE:
   Ela nunca ultrapassa a tela.
*/

.scene-image {

  position: relative;

  width: 100vw;

  height: 100vh;

  display: flex;

  align-items: center;
  justify-content: center;

}


/*
   A imagem mantém sua proporção original.

   contain = nunca corta a imagem.
*/

.scene-image > img {

  display: block;

  width: 100%;

  height: 100%;

  object-fit: contain;

  object-position: center;

  user-select: none;

  -webkit-user-drag: none;

}


/* =========================================================
   ÁREAS CLICÁVEIS
========================================================= */

/*
   ATENÇÃO:

   Estas áreas são posicionadas em PORCENTAGEM
   da imagem inteira.

   Assim elas acompanham a imagem quando a tela
   muda de tamanho.
*/


.click-area {

  position: absolute;

  border: none;

  background: transparent;

  cursor: pointer;

  z-index: 20;

  padding: 0;

  margin: 0;

  -webkit-tap-highlight-color: transparent;

}


/*
   Não mostrar nada visualmente.
*/

.click-area:hover {

  background: rgba(255,255,255,0.02);

}


/* =========================================================
   LIVRO
========================================================= */

/*
   AJUSTE ESTAS 4 MEDIDAS CASO NECESSÁRIO.

   left = posição horizontal
   top = posição vertical
   width = largura
   height = altura
*/

#bookButton {

  left: 31%;

  top: 30%;

  width: 38%;

  height: 43%;

}


/* =========================================================
   CANETA
========================================================= */

#penButton {

  left: 63%;

  top: 67%;

  width: 18%;

  height: 10%;

}


/* =========================================================
   MODAL DE SENHA
========================================================= */

.overlay {

  position: fixed;

  inset: 0;

  z-index: 500;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 20px;

  background:
    rgba(10,18,28,.86);

  backdrop-filter:
    blur(14px);

  -webkit-backdrop-filter:
    blur(14px);

}

.hidden {

  display: none !important;

}

.modal {

  width:
    min(420px, 92vw);

  background:
    rgba(247,243,233,.98);

  color:
    #202020;

  border-radius:
    24px;

  padding:
    32px;

  box-shadow:
    0 30px 90px rgba(0,0,0,.5);

  text-align:
    center;

}

.modal h2 {

  font-family:
    Georgia,
    serif;

  font-weight:
    500;

  margin-bottom:
    10px;

}

.modal p {

  color:
    #666;

  line-height:
    1.5;

  font-size:
    14px;

  margin-bottom:
    22px;

}

.modal input {

  width:
    100%;

  height:
    50px;

  border:
    1px solid #d5d0c5;

  background:
    #fff;

  color:
    #222;

  border-radius:
    13px;

  padding:
    0 15px;

  font-size:
    16px;

  outline:
    none;

  text-align:
    center;

  margin-bottom:
    14px;

}

.modal input:focus {

  border-color:
    var(--blue);

}

.modal button {

  border:
    none;

  border-radius:
    999px;

  padding:
    12px 22px;

  background:
    var(--blue);

  color:
    white;

  cursor:
    pointer;

  font-size:
    14px;

}

.modal .secondary {

  background:
    transparent;

  color:
    #333;

  border:
    1px solid #ccc;

  margin-left:
    6px;

}

.error {

  color:
    #a33b3b !important;

  min-height:
    20px;

  margin-top:
    10px;

  margin-bottom:
    0 !important;

}


/* =========================================================
   CARTA
========================================================= */

.letter-overlay {

  position: fixed;

  inset: 0;

  z-index: 700;

  background:
    rgba(24,37,54,.97);

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 18px;

}

.letter-window {

  position: relative;

  width:
    min(90vw, 850px);

  height:
    min(88vh, 760px);

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

}

.letter-page {

  display:
    none;

  max-width:
    100%;

  max-height:
    100%;

  width:
    auto;

  height:
    auto;

  object-fit:
    contain;

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.5);

}

.letter-page.active {

  display:
    block;

}


/* =========================================================
   CONTROLES DA CARTA
========================================================= */

.letter-controls {

  position:
    absolute;

  bottom:
    -4px;

  left:
    50%;

  transform:
    translateX(-50%);

  display:
    flex;

  align-items:
    center;

  gap:
    10px;

  padding:
    7px 9px;

  background:
    rgba(0,0,0,.75);

  border-radius:
    999px;

}

.letter-controls button {

  width:
    36px;

  height:
    36px;

  border:
    none;

  border-radius:
    50%;

  background:
    rgba(255,255,255,.12);

  color:
    white;

  cursor:
    pointer;

}

.letter-controls button:disabled {

  opacity:
    .25;

  cursor:
    default;

}

.page-number {

  min-width:
    55px;

  text-align:
    center;

  font-size:
    12px;

  color:
    white;

}


/* =========================================================
   FECHAR
========================================================= */

.close-button {

  position:
    fixed;

  top:
    18px;

  right:
    18px;

  z-index:
    900;

  width:
    42px;

  height:
    42px;

  border:
    none;

  border-radius:
    50%;

  background:
    rgba(0,0,0,.65);

  color:
    white;

  font-size:
    23px;

  cursor:
    pointer;

}


/* =========================================================
   MENSAGENS
========================================================= */

.messages-overlay {

  position:
    fixed;

  inset:
    0;

  z-index:
    800;

  background:
    var(--blue);

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  padding:
    18px;

}


/* =========================================================
   FOLHA
========================================================= */

.paper {

  position:
    relative;

  width:
    min(850px, 94vw);

  height:
    min(88vh, 850px);

  background:
    var(--paper);

  color:
    var(--ink);

  padding:
    45px;

  box-shadow:
    0 30px 90px
    rgba(0,0,0,.5);

  overflow:
    hidden;

}

.paper::before {

  content:
    "";

  position:
    absolute;

  inset:
    22px;

  border:
    1px solid
    rgba(0,0,0,.07);

  pointer-events:
    none;

}

.paper-title {

  position:
    relative;

  z-index:
    2;

  text-align:
    center;

  font-family:
    Georgia,
    serif;

  font-size:
    20px;

  margin-bottom:
    22px;

}


/* =========================================================
   MENSAGENS
========================================================= */

.messages {

  position:
    relative;

  height:
    calc(100% - 190px);

  overflow-y:
    auto;

  padding:
    5px 10px 20px;

}

.message {

  margin-bottom:
    22px;

  font-family:
    "Segoe Print",
    "Bradley Hand",
    "Comic Sans MS",
    cursive;

  line-height:
    1.5;

}

.message-name {

  font-size:
    16px;

  font-weight:
    bold;

}

.message-text {

  font-size:
    15px;

  white-space:
    pre-wrap;

}

.message-date {

  margin-top:
    4px;

  font-family:
    sans-serif;

  font-size:
    10px;

  opacity:
    .45;

}


/* =========================================================
   FORMULÁRIO
========================================================= */

.message-form {

  position:
    absolute;

  left:
    35px;

  right:
    35px;

  bottom:
    20px;

  display:
    grid;

  grid-template-columns:
    150px 1fr auto;

  gap:
    8px;

  z-index:
    5;

}

.message-form input {

  min-width:
    0;

  height:
    45px;

  border:
    1px solid #d3cec1;

  border-radius:
    10px;

  padding:
    0 12px;

  background:
    #fffdf8;

  outline:
    none;

}

.message-form button {

  height:
    45px;

  padding:
    0 20px;

  border:
    none;

  border-radius:
    999px;

  background:
    var(--blue);

  color:
    white;

  cursor:
    pointer;

}


/* =========================================================
   ARQUIVO
========================================================= */

.archive {

  position:
    fixed;

  inset:
    0;

  z-index:
    900;

  background:
    rgba(24,37,54,.98);

  display:
    flex;

  flex-direction:
    column;

  align-items:
    center;

  justify-content:
    center;

  padding:
    20px;

}

.archive h2 {

  font-family:
    Georgia,
    serif;

  margin-bottom:
    20px;

}

.archive-list {

  display:
    flex;

  flex-wrap:
    wrap;

  justify-content:
    center;

  gap:
    10px;

  max-width:
    700px;

}

.archive-list button {

  border:
    none;

  border-radius:
    999px;

  padding:
    12px 18px;

  background:
    var(--paper);

  color:
    #222;

  cursor:
    pointer;

}

.archive-close {

  position:
    absolute;

  top:
    18px;

  right:
    18px;

  border:
    none;

  border-radius:
    999px;

  padding:
    10px 18px;

  background:
    rgba(255,255,255,.1);

  color:
    white;

  cursor:
    pointer;

}


/* =========================================================
   CELULAR
========================================================= */

@media (max-width: 700px) {

  .scene-image {

    width:
      100vw;

    height:
      100vh;

  }


  /*
     No celular a imagem continua inteira.
     Não fazemos zoom.
  */

  .scene-image > img {

    width:
      100%;

    height:
      100%;

    object-fit:
      contain;

  }


  /*
     Áreas clicáveis menores e proporcionais.
  */

  #bookButton {

    left:
      27%;

    top:
      31%;

    width:
      46%;

    height:
      39%;

  }


  #penButton {

    left:
      57%;

    top:
      67%;

    width:
      27%;

    height:
      12%;

  }


  .letter-overlay {

    padding:
      8px;

  }


  .letter-window {

    width:
      96vw;

    height:
      86vh;

  }


  .letter-page {

    max-width:
      96vw;

    max-height:
      80vh;

  }


  .letter-controls {

    bottom:
      0;

  }


  .paper {

    width:
      94vw;

    height:
      90vh;

    padding:
      30px 20px;

  }


  .paper-title {

    font-size:
      17px;

  }


  .messages {

    height:
      calc(100% - 210px);

  }


  .message-form {

    left:
      20px;

    right:
      20px;

    grid-template-columns:
      1fr;

  }


  .message-form input,
  .message-form button {

    width:
      100%;

  }

}


/* =========================================================
   TELAS MUITO PEQUENAS
========================================================= */

@media (max-height: 600px) {

  .letter-window {

    height:
      82vh;

  }

  .letter-page {

    max-height:
      74vh;

  }

}


/* =========================================================
   ACESSIBILIDADE
========================================================= */

button {

  -webkit-tap-highlight-color:
    transparent;

}

button:focus-visible {

  outline:
    2px solid white;

  outline-offset:
    3px;

}

</style>

</head>

</div>


<!-- =====================================================
     MENSAGENS
===================================================== -->

<div
  class="messages-overlay hidden"
  id="messagesOverlay"
>


  <button
    class="close-button"
    id="closeMessages"
  >
    ×
  </button>


  <div class="paper">


    <button
      class="archive-button"
      id="archiveButton"

      folhas anteriores

      class="messages"

      <input
        id="messageInput"

        placeholder="escreva aqui..."
      >

      <button
        id="sendButton"
      >
        enviar
      </button>

    </div>


  </div>

</div>


<!-- =====================================================
     ARQUIVO
===================================================== -->

<div
  class="archive hidden"
  id="archive"
>

  <button
    class="archive-close"
    id="closeArchive"

    fechar
  </button>

    folhas anteriores
  </h2>


  <div
    class="archive-list"
    id="archiveList"
  ></div>

</div>


</div>

  }

/* =========================================================

========================================================= */

function pedirSenha(purpose) {

  passwordPurpose =
    purpose;

  passwordInput.value = "";

  passwordError.textContent = "";

  if (purpose === "book") {

    passwordTitle.textContent =
      "Teu aniversário";

      "Para escrever uma mensagem, digite a data somente com números.";

  }

  passwordOverlay
    .classList
    .remove("hidden");

  setTimeout(
    function() {

      passwordInput.focus();

    },
    100
  );

}


/* =========================================================
   LIVRO

    }

    abrirMensagens();

  }
);

  verificarSenha
);


passwordInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      verificarSenha();

    }

  }
);


function verificarSenha() {

  const value =
    passwordInput.value.trim();


  if (value === PASSWORD) {

    unlocked = true;

    passwordOverlay
      .classList
      .add("hidden");

    passwordInput.value = "";

    passwordError.textContent = "";


    if (passwordPurpose === "book") {

      abrirCarta();

    } else {

      abrirMensagens();

    }

  } else {

    passwordError.textContent =
      "A senha não está correta.";

    passwordInput.select();

  }

}


cancelPassword.addEventListener(
  "click",
  function() {

    passwordOverlay
      .classList
      .add("hidden");

    passwordInput.value = "";

    passwordError.textContent = "";

  }
);


/* =========================================================
   CARTA
========================================================= */

function abrirCarta() {

  currentPage = 0;

  atualizarPagina();

  letterOverlay
    .classList
    .remove("hidden");

}


function atualizarPagina() {

  pages.forEach(
    function(page, index) {

      page.classList.toggle(
        "active",
        index === currentPage
      );

    }
  );


  pageNumber.textContent =
    `${currentPage + 1} / ${pages.length}`;


  previousPage.disabled =
    currentPage === 0;


  nextPage.disabled =
    currentPage === pages.length - 1;

}


previousPage.addEventListener(
  "click",
  function() {

    if (currentPage > 0) {

      currentPage--;

      atualizarPagina();

    }

  }
);


nextPage.addEventListener(
  "click",
  function() {

    if (
      currentPage <
      pages.length - 1
    ) {

      currentPage++;

      atualizarPagina();

    }

  }
);


closeLetter.addEventListener(
  "click",
  function() {

    letterOverlay
      .classList
      .add("hidden");

  }
);


/* =========================================================
   MENSAGENS
========================================================= */

async function abrirMensagens() {

  messagesOverlay
    .classList
    .remove("hidden");

  await carregarMensagens();

}


closeMessages.addEventListener(
  "click",
  function() {

    messagesOverlay
      .classList
      .add("hidden");

  }
);


/* =========================================================
   CARREGAR MENSAGENS
========================================================= */

async function carregarMensagens() {

  try {

    const response =
      await fetch(
        API_URL +
        "?action=messages&time=" +
        Date.now()
      );


    const data =
      await response.json();


    if (
      data.success &&
      Array.isArray(data.messages)
    ) {

      allMessages =
        data.messages;

    } else {

      allMessages = [];

    }

  } catch (error) {

    console.error(
      "Erro ao carregar mensagens:",
      error
    );

    allMessages = [];

  }


  renderizarFolhaAtual();

}


/* =========================================================
   FOLHAS
========================================================= */

function obterFolhas() {

  const sheets = [];


  for (
    let i = 0;
    i < allMessages.length;
    i += MESSAGES_PER_SHEET
  ) {

    sheets.push(
      allMessages.slice(
        i,
        i + MESSAGES_PER_SHEET
      )
    );

  }


  if (sheets.length === 0) {

    sheets.push([]);

  }


  return sheets;

}


/* =========================================================
   FOLHA ATUAL
========================================================= */

function renderizarFolhaAtual() {

  const sheets =
    obterFolhas();


  currentMessageSheet =
    sheets.length - 1;


  renderizarSheet(
    currentMessageSheet
  );


  atualizarArquivo(
    sheets
  );

}


/* =========================================================
   RENDERIZAR FOLHA
========================================================= */

function renderizarSheet(index) {

  const sheets =
    obterFolhas();


  const sheet =
    sheets[index] || [];


  messagesContainer.innerHTML =
    "";


  if (sheet.length === 0) {

    const empty =
      document.createElement("div");


    empty.style.cssText =
      `
      text-align:center;
      margin-top:80px;
      opacity:.45;
      font-family:Georgia,serif;
      `;


    empty.textContent =
      "ainda não há mensagens.";


    messagesContainer.appendChild(
      empty
    );


    return;

  }


  sheet.forEach(
    function(item) {

      const wrapper =
        document.createElement("div");


      wrapper.className =
        "message";


      const name =
        document.createElement("div");


      name.className =
        "message-name";


      name.textContent =
        item.name;


      const text =
        document.createElement("div");


      text.className =
        "message-text";


      text.textContent =
        item.message;


      const date =
        document.createElement("div");


      date.className =
        "message-date";


      date.textContent =
        formatarData(
          item.timestamp
        );


      wrapper.appendChild(name);

      wrapper.appendChild(text);

      wrapper.appendChild(date);


      messagesContainer.appendChild(
        wrapper
      );

    }
  );

}


/* =========================================================
   ARQUIVO
========================================================= */

function atualizarArquivo(sheets) {

  archiveList.innerHTML =
    "";


  const oldSheets =
    sheets.length - 1;


  if (oldSheets <= 0) {

    const text =
      document.createElement("p");


    text.style.color =
      "rgba(255,255,255,.6)";


    text.textContent =
      "Ainda não existem folhas anteriores.";


    archiveList.appendChild(
      text
    );


    return;

  }


  for (
    let i = oldSheets - 1;
    i >= 0;
    i--
  ) {

    const button =
      document.createElement("button");


    button.textContent =
      `folha ${i + 1}`;


    button.addEventListener(
      "click",
      function() {

        currentMessageSheet =
          i;

        renderizarSheet(i);

        archive
          .classList
          .add("hidden");

      }
    );


    archiveList.appendChild(
      button
    );

  }

}


archiveButton.addEventListener(
  "click",
  function() {

    const sheets =
      obterFolhas();

    atualizarArquivo(
      sheets
    );

    archive
      .classList
      .remove("hidden");

  }
);


closeArchive.addEventListener(
  "click",
  function() {

    archive
      .classList
      .add("hidden");

  }
);


/* =========================================================
   ENVIAR MENSAGEM
========================================================= */

sendButton.addEventListener(
  "click",
  enviarMensagem
);


messageInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      enviarMensagem();

    }

  }
);


async function enviarMensagem() {

  const name =
    nameInput.value.trim();


  const message =
    messageInput.value.trim();


  if (!name) {

    alert(
      "Antes de enviar, coloque seu nome."
    );

    nameInput.focus();

    return;

  }


  if (!message) {

    alert(
      "Escreva uma mensagem."
    );

    messageInput.focus();

    return;

  }


  sendButton.disabled =
    true;


  sendButton.textContent =
    "enviando...";


  try {

    const response =
      await fetch(
        API_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              name:
                name,

              message:
                message

            })

        }
      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.error ||
        "Erro ao salvar."
      );

    }


    nameInput.value =
      "";

    messageInput.value =
      "";


    await carregarMensagens();


    alert(
      "Mensagem guardada."
    );


  } catch (error) {

    console.error(
      error
    );


    alert(
      "Não foi possível salvar a mensagem. Verifique o Google Apps Script."
    );

  }


  sendButton.disabled =
    false;


  sendButton.textContent =
    "enviar";

}


/* =========================================================
   DATA
========================================================= */

function formatarData(value) {

  if (!value) {

    return "";

  }


  try {

    const date =
      new Date(value);


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return "";

    }


    return date.toLocaleString(
      "pt-BR",
      {

        day:
          "2-digit",

        month:
          "2-digit",

        year:
          "numeric",

        hour:
          "2-digit",

        minute:
          "2-digit"

      }
    );

  } catch {

    return "";

  }

}


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key !== "Escape"
    ) {

      return;

    }


    passwordOverlay
      .classList
      .add("hidden");


    letterOverlay
      .classList
      .add("hidden");


    messagesOverlay
      .classList
      .add("hidden");


    archive
      .classList
      .add("hidden");

  }
);

</script>

</body>
