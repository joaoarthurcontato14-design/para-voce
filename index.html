<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#283b54"
>

<title>para você.</title>


<style>

/* =========================================================
   CONFIGURAÇÕES
========================================================= */

:root {

  --blue: #283b54;
  --blue-dark: #1d2c40;

  --paper: #f7f4ec;
  --ink: #252525;

  --white: #ffffff;

}


/* =========================================================
   RESET
========================================================= */

* {

  box-sizing: border-box;

  margin: 0;
  padding: 0;

}


html,
body {

  width: 100%;
  height: 100%;

}


body {

  overflow: hidden;

  background:
    var(--blue);

  color:
    white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

}


/* =========================================================
   APP
========================================================= */

#app {

  width: 100vw;
  height: 100vh;

  position: relative;

  overflow: hidden;

}


/* =========================================================
   LOADING
========================================================= */

.loading {

  position: fixed;

  inset: 0;

  z-index: 9999;

  background:
    var(--blue);

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  transition:
    opacity 1s ease,
    visibility 1s ease;

}


.loading.hidden {

  opacity: 0;

  visibility: hidden;

  pointer-events: none;

}


.loader-title {

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(25px, 4vw, 42px);

  letter-spacing:
    .5px;

  margin-bottom:
    12px;

}


.loader-sub {

  font-family:
    Georgia,
    serif;

  font-size:
    14px;

  opacity:
    .65;

}


.loader-line {

  width:
    100px;

  height:
    1px;

  background:
    rgba(255,255,255,.6);

  margin-top:
    30px;

  animation:
    loadingLine 2s ease-in-out infinite;

}


@keyframes loadingLine {

  0% {

    transform:
      scaleX(.2);

    opacity:
      .2;

  }

  50% {

    transform:
      scaleX(1);

    opacity:
      .9;

  }

  100% {

    transform:
      scaleX(.2);

    opacity:
      .2;

  }

}


/* =========================================================
   CENA
========================================================= */

.scene-wrapper {

  position: absolute;

  inset: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  padding:
    20px;

}


/*
   A imagem inteira fica dentro desta área.

   NÃO usamos "cover".

   Isso é importante porque "cover" poderia cortar
   partes da imagem e fazer os hotspots perderem
   a posição.
*/

.scene {

  position: relative;

  width: min(
    100%,
    1600px
  );

  max-height:
    calc(100vh - 40px);

  display: inline-block;

}


.scene-image {

  display: block;

  width: 100%;

  height: auto;

  max-height:
    calc(100vh - 40px);

  object-fit:
    contain;

  user-select:
    none;

  -webkit-user-drag:
    none;

}


/* =========================================================
   HOTSPOTS
========================================================= */


/*
   Todos os hotspots são transparentes.

   Eles ficam sobre a imagem e servem somente
   para tornar os objetos clicáveis.
*/

.hotspot {

  position: absolute;

  border: none;

  background:
    transparent;

  padding: 0;

  margin: 0;

  cursor: pointer;

  z-index: 20;

  border-radius: 50%;

  appearance: none;

  -webkit-tap-highlight-color:
    transparent;

}


/*
   Ao passar o mouse, não mostramos uma caixa.
*/

.hotspot:hover {

  background:
    rgba(255,255,255,0.025);

}


/* =========================================================
   GLOBO
========================================================= */

.globe-hotspot {

  /*
     posição aproximada do globo
  */

  left: 7%;
  top: 20%;

  width: 21%;
  height: 48%;

}


/* =========================================================
   CALENDÁRIO
========================================================= */

.calendar-hotspot {

  right: 7%;
  top: 7%;

  width: 18%;
  height: 22%;

}


/* =========================================================
   CADILLAC
========================================================= */

.car-hotspot {

  right: 8%;
  bottom: 12%;

  width: 22%;
  height: 20%;

}


/* =========================================================
   LIVRO
========================================================= */

.book-hotspot {

  left: 31%;
  top: 25%;

  width: 38%;
  height: 50%;

}


/* =========================================================
   CANETA
========================================================= */


/*
   IMPORTANTE:

   Este hotspot é propositalmente pequeno.

   Ele não cobre metade da mesa.
   Ele fica somente sobre a caneta.
*/

.pen-hotspot {

  right: 16.5%;

  bottom: 23%;

  width: 13%;

  height: 6%;

  transform:
    rotate(-35deg);

  border-radius:
    999px;

}


/* =========================================================
   MODAL
========================================================= */

.overlay {

  position: fixed;

  inset: 0;

  z-index: 500;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

  background:
    rgba(10,18,28,.88);

  backdrop-filter:
    blur(14px);

  -webkit-backdrop-filter:
    blur(14px);

}


.hidden {

  display:
    none !important;

}


.modal {

  width:
    min(440px, 92vw);

  background:
    rgba(247,244,236,.98);

  color:
    #202020;

  border-radius:
    24px;

  padding:
    35px;

  box-shadow:
    0 30px 80px
    rgba(0,0,0,.45);

  text-align:
    center;

}


.modal h2 {

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-weight:
    500;

  margin-bottom:
    10px;

}


.modal p {

  color:
    #666;

  line-height:
    1.5;

  margin-bottom:
    24px;

}


.modal input {

  width: 100%;

  border:
    1px solid #d5d0c5;

  background:
    #fffdf8;

  color:
    #222;

  border-radius:
    14px;

  padding:
    15px;

  font-size:
    16px;

  outline:
    none;

  margin-bottom:
    14px;

  text-align:
    center;

}


.modal input:focus {

  border-color:
    var(--blue);

}


button {

  border:
    none;

  border-radius:
    999px;

  padding:
    13px 22px;

  cursor:
    pointer;

  background:
    var(--blue);

  color:
    white;

  font-size:
    15px;

  transition:
    transform .2s ease,
    opacity .2s ease;

}


button:hover {

  transform:
    translateY(-2px);

}


button:disabled {

  opacity:
    .45;

  cursor:
    default;

  transform:
    none;

}


.secondary {

  background:
    transparent;

  color:
    #303030;

  border:
    1px solid #ccc5b7;

  margin-left:
    8px;

}


.error {

  color:
    #9b3d3d !important;

  min-height:
    20px;

  margin-top:
    12px;

  margin-bottom:
    0 !important;

}


/* =========================================================
   CARTA
========================================================= */

.letter-overlay {

  position: fixed;

  inset: 0;

  z-index: 600;

  background:
    rgba(24,37,54,.97);

  display: flex;

  align-items: center;

  justify-content: center;

  padding:
    55px 20px 25px;

}


.letter {

  position: relative;

  width:
    min(900px, 94vw);

  height:
    min(
      calc(100vh - 100px),
      800px
    );

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;

  background:
    #fff;

  box-shadow:
    0 30px 80px
    rgba(0,0,0,.5);

}


.letter-page {

  display:
    none;

  width:
    100%;

  height:
    100%;

  object-fit:
    contain;

  object-position:
    center;

  background:
    white;

}


.letter-page.active {

  display:
    block;

}


/* =========================================================
   CONTROLES DA CARTA
========================================================= */

.letter-controls {

  position: absolute;

  left: 50%;

  bottom: 15px;

  transform:
    translateX(-50%);

  display: flex;

  align-items: center;

  gap: 10px;

  background:
    rgba(0,0,0,.78);

  padding:
    7px;

  border-radius:
    999px;

  z-index: 5;

}


.letter-controls button {

  width:
    38px;

  height:
    38px;

  padding:
    0;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

}


.page-number {

  min-width:
    55px;

  text-align:
    center;

  color:
    white;

  font-size:
    13px;

}


/* =========================================================
   ÚLTIMA PÁGINA
========================================================= */

.last-note {

  position: absolute;

  left: 50%;

  bottom: 75px;

  transform:
    translateX(-50%);

  z-index: 10;

  color:
    white;

  background:
    rgba(40,59,84,.94);

  padding:
    11px 18px;

  border-radius:
    999px;

  font-size:
    13px;

  white-space:
    nowrap;

}


.close-button {

  position: absolute;

  right: 20px;

  top: 20px;

  z-index: 20;

  width:
    42px;

  height:
    42px;

  padding:
    0;

  border-radius:
    50%;

  background:
    rgba(0,0,0,.7);

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  font-size:
    22px;

}


/* =========================================================
   MENSAGENS
========================================================= */

.messages-overlay {

  position: fixed;

  inset: 0;

  z-index: 700;

  background:
    var(--blue);

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  padding:
    25px;

}


.paper {

  width:
    min(900px, 94vw);

  height:
    min(850px, 88vh);

  background:
    var(--paper);

  color:
    var(--ink);

  position:
    relative;

  padding:
    50px;

  box-shadow:
    0 30px 90px
    rgba(0,0,0,.45);

  overflow:
    hidden;

}


.paper::before {

  content: "";

  position: absolute;

  inset:
    25px;

  border:
    1px solid
    rgba(50,50,50,.08);

  pointer-events:
    none;

}


.paper h1 {

  text-align:
    center;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    22px;

  font-weight:
    500;

  line-height:
    1.4;

  margin-bottom:
    25px;

}


.messages {

  position:
    relative;

  height:
    calc(100% - 150px);

  overflow:
    hidden;

}


.message {

  font-family:
    "Segoe Print",
    "Bradley Hand",
    "Comic Sans MS",
    cursive;

  margin-bottom:
    20px;

  line-height:
    1.45;

  transform:
    rotate(
      var(--rotation)
    );

}


.message-name {

  font-weight:
    bold;

  font-size:
    17px;

}


.message-text {

  white-space:
    pre-wrap;

  font-size:
    16px;

}


.message-date {

  font-family:
    sans-serif;

  font-size:
    10px;

  opacity:
    .45;

  margin-top:
    3px;

}


/* =========================================================
   FORMULÁRIO
========================================================= */

.message-form {

  position:
    absolute;

  left:
    50%;

  bottom:
    20px;

  transform:
    translateX(-50%);

  width:
    calc(100% - 80px);

  display:
    grid;

  grid-template-columns:
    150px 1fr auto;

  gap:
    8px;

}


.message-form input,
.message-form textarea {

  width:
    100%;

  border:
    1px solid #d5d0c5;

  background:
    #fffdf8;

  color:
    #222;

  border-radius:
    12px;

  padding:
    12px;

  font-size:
    14px;

  outline:
    none;

}


.message-form textarea {

  resize:
    none;

  height:
    48px;

}


.message-form input:focus,
.message-form textarea:focus {

  border-color:
    var(--blue);

}


.message-form button {

  height:
    48px;

}


/* =========================================================
   BOTÕES DA ÁREA DE MENSAGENS
========================================================= */

.archive-button {

  position:
    absolute;

  left:
    20px;

  top:
    20px;

  background:
    rgba(40,59,84,.92);

}


.messages-close {

  position:
    absolute;

  right:
    20px;

  top:
    20px;

  width:
    40px;

  height:
    40px;

  padding:
    0;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

}


/* =========================================================
   ARQUIVO
========================================================= */

.archive {

  position: fixed;

  inset: 0;

  z-index: 800;

  background:
    rgba(24,37,54,.98);

  display:
    flex;

  flex-direction:
    column;

  align-items:
    center;

  justify-content:
    center;

  padding:
    25px;

}


.archive h2 {

  font-family:
    Georgia,
    serif;

  font-weight:
    400;

  margin-bottom:
    20px;

}


.archive-list {

  display:
    flex;

  flex-wrap:
    wrap;

  gap:
    10px;

  justify-content:
    center;

  max-width:
    700px;

}


.archive-list button {

  background:
    var(--paper);

  color:
    #222;

}


.archive-close {

  position:
    absolute;

  right:
    20px;

  top:
    20px;

}


/* =========================================================
   CELULAR
========================================================= */

@media (max-width: 700px) {


  .scene-wrapper {

    padding:
      8px;

  }


  .scene {

    width:
      100%;

  }


  /*
     Hotspots menores no celular.
  */

  .globe-hotspot {

    left:
      6%;

    top:
      19%;

    width:
      23%;

    height:
      46%;

  }


  .calendar-hotspot {

    right:
      6%;

    top:
      7%;

    width:
      20%;

    height:
      20%;

  }


  .car-hotspot {

    right:
      7%;

    bottom:
      11%;

    width:
      24%;

    height:
      19%;

  }


  .book-hotspot {

    left:
      29%;

    top:
      25%;

    width:
      42%;

    height:
      49%;

  }


  /*
     A caneta é deliberadamente pequena.
  */

  .pen-hotspot {

    right:
      15%;

    bottom:
      22%;

    width:
      14%;

    height:
      5%;

  }


  .letter-overlay {

    padding:
      50px 8px 10px;

  }


  .letter {

    width:
      96vw;

    height:
      calc(100vh - 70px);

  }


  .last-note {

    max-width:
      90%;

    text-align:
      center;

    white-space:
      normal;

    bottom:
      65px;

    font-size:
      12px;

  }


  .letter-controls {

    bottom:
      10px;

  }


  .paper {

    width:
      94vw;

    height:
      90vh;

    padding:
      45px 22px 85px;

  }


  .paper::before {

    inset:
      15px;

  }


  .paper h1 {

    font-size:
      19px;

  }


  .message-form {

    width:
      calc(100% - 44px);

    grid-template-columns:
      1fr;

  }


  .message-form input {

    height:
      42px;

  }


  .message-form textarea {

    height:
      55px;

  }


  .message-form button {

    height:
      42px;

  }


}


/* =========================================================
   TELAS MUITO PEQUENAS
========================================================= */

@media (max-height: 650px) {


  .scene-wrapper {

    padding:
      5px;

  }


  .letter {

    height:
      calc(100vh - 60px);

  }


  .last-note {

    display:
      none;

  }

}

</style>

</head>


<body>


<div id="app">


<!-- =======================================================
     TELA DE CARREGAMENTO
======================================================== -->

<div
  class="loading"
  id="loading"
>

  <div class="loader-title">
    Um Ano Depois...
  </div>

  <div class="loader-sub">
    Feito por João Arthur.
  </div>

  <div class="loader-line"></div>

</div>


<!-- =======================================================
     CENA PRINCIPAL
======================================================== -->

<div class="scene-wrapper">

  <div class="scene">


    <!--
      IMPORTANTE:

      interface.png precisa estar diretamente
      dentro da pasta assets.

      Estrutura:

      assets/
        interface.png
        page-1.png
        page-2.png
        page-3.png
        page-4.png
    -->

    <img
      class="scene-image"
      src="assets/interface.png"
      alt="Mesa com livro, globo, calendário, Cadillac e caneta"
      draggable="false"
    >


    <!-- GLOBO -->

    <button
      class="hotspot globe-hotspot"
      id="globeHotspot"
      aria-label="Globo"
      title="Globo"
    ></button>


    <!-- CALENDÁRIO -->

    <button
      class="hotspot calendar-hotspot"
      id="calendarHotspot"
      aria-label="Calendário"
      title="Calendário"
    ></button>


    <!-- CADILLAC -->

    <button
      class="hotspot car-hotspot"
      id="carHotspot"
      aria-label="Cadillac"
      title="Cadillac"
    ></button>


    <!-- LIVRO -->

    <button
      class="hotspot book-hotspot"
      id="book"
      aria-label="Abrir carta"
      title="Abrir carta"
    ></button>


    <!-- CANETA -->

    <button
      class="hotspot pen-hotspot"
      id="pen"
      aria-label="Escrever mensagem"
      title="Escrever mensagem"
    ></button>


  </div>

</div>


<!-- =======================================================
     MODAL DA SENHA
======================================================== -->

<div
  class="overlay hidden"
  id="passwordOverlay"
>

  <div class="modal">

    <h2>
      Teu aniversário
    </h2>

    <p>
      Para continuar, digite a data
      somente com números.
    </p>


    <input
      id="passwordInput"
      type="password"
      inputmode="numeric"
      maxlength="8"
      placeholder="DDMMAAAA"
      autocomplete="off"
    >


    <div>

      <button
        id="unlockButton"
      >
        abrir
      </button>


      <button
        class="secondary"
        id="cancelPassword"
      >
        cancelar
      </button>

    </div>


    <p
      class="error"
      id="passwordError"
    ></p>

  </div>

</div>


<!-- =======================================================
     CARTA
======================================================== -->

<div
  class="letter-overlay hidden"
  id="letterOverlay"
>


  <button
    class="close-button"
    id="closeLetter"
    aria-label="Fechar carta"
  >
    ×
  </button>


  <div class="letter">


    <!-- PÁGINA 1 -->

    <img
      class="letter-page active"
      src="assets/page-1.png"
      alt="Página 1"
    >


    <!-- PÁGINA 2 -->

    <img
      class="letter-page"
      src="assets/page-2.png"
      alt="Página 2"
    >


    <!-- PÁGINA 3 -->

    <img
      class="letter-page"
      src="assets/page-3.png"
      alt="Página 3"
    >


    <!-- PÁGINA 4 -->

    <img
      class="letter-page"
      src="assets/page-4.png"
      alt="Página 4"
    >


    <!-- CONTROLES -->

    <div class="letter-controls">


      <button
        id="previousPage"
        aria-label="Página anterior"
      >
        ←
      </button>


      <span
        class="page-number"
        id="pageNumber"
      >
        1 / 4
      </span>


      <button
        id="nextPage"
        aria-label="Próxima página"
      >
        →
      </button>


    </div>


    <!-- MENSAGEM FINAL -->

    <div
      class="last-note hidden"
      id="lastNote"
    >
      Deixe uma mensagem ou comentário na caneta encima da mesa
    </div>


  </div>

</div>


<!-- =======================================================
     MENSAGENS
======================================================== -->

<div
  class="messages-overlay hidden"
  id="messagesOverlay"
>


  <div class="paper">


    <button
      class="archive-button"
      id="archiveButton"
    >
      folhas anteriores
    </button>


    <button
      class="messages-close"
      id="closeMessages"
      aria-label="Fechar mensagens"
    >
      ×
    </button>


    <h1>

      if u have something to say,<br>
      say it here.

    </h1>


    <div
      class="messages"
      id="messages"
    ></div>


    <div class="message-form">


      <input
        id="nameInput"
        maxlength="80"
        placeholder="teu nome"
        autocomplete="off"
      >


      <textarea
        id="messageInput"
        maxlength="2000"
        placeholder="escreva aqui..."
      ></textarea>


      <button
        id="sendButton"
      >
        enviar
      </button>


    </div>


  </div>

</div>


<!-- =======================================================
     ARQUIVO DE FOLHAS
======================================================== -->

<div
  class="archive hidden"
  id="archive"
>


  <button
    class="archive-close"
    id="closeArchive"
  >
    fechar
  </button>


  <h2>
    folhas anteriores
  </h2>


  <div
    class="archive-list"
    id="archiveList"
  ></div>


</div>


</div>


<script>

/* =========================================================
   CONFIGURAÇÕES
========================================================= */


/*
   SENHA DO LIVRO E DA CANETA
*/

const PASSWORD = "25102008";


/*
   URL DO GOOGLE APPS SCRIPT
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbz7mUY2SZA9sdeXLLVdheKYA4rVh7AbnDojfyLPxEXy204IGUwnARLYkXhh7pr7DWCcaw/exec";


/*
   QUANTAS MENSAGENS CABEM EM CADA FOLHA
*/

const MESSAGES_PER_SHEET = 6;


/* =========================================================
   ELEMENTOS
========================================================= */

const loading =
document.getElementById("loading");

const book =
document.getElementById("book");

const pen =
document.getElementById("pen");

const passwordOverlay =
document.getElementById("passwordOverlay");

const passwordInput =
document.getElementById("passwordInput");

const passwordError =
document.getElementById("passwordError");

const unlockButton =
document.getElementById("unlockButton");

const cancelPassword =
document.getElementById("cancelPassword");

const letterOverlay =
document.getElementById("letterOverlay");

const closeLetter =
document.getElementById("closeLetter");

const pages =
document.querySelectorAll(".letter-page");

const previousPage =
document.getElementById("previousPage");

const nextPage =
document.getElementById("nextPage");

const pageNumber =
document.getElementById("pageNumber");

const lastNote =
document.getElementById("lastNote");

const messagesOverlay =
document.getElementById("messagesOverlay");

const closeMessages =
document.getElementById("closeMessages");

const messagesContainer =
document.getElementById("messages");

const nameInput =
document.getElementById("nameInput");

const messageInput =
document.getElementById("messageInput");

const sendButton =
document.getElementById("sendButton");

const archiveButton =
document.getElementById("archiveButton");

const archive =
document.getElementById("archive");

const archiveList =
document.getElementById("archiveList");

const closeArchive =
document.getElementById("closeArchive");


/* =========================================================
   ESTADO
========================================================= */

let currentPage = 0;

let unlocked = false;

let allMessages = [];

let currentMessageSheet = 0;


/* =========================================================
   CARREGAMENTO
========================================================= */

window.addEventListener(
  "load",
  function() {

    setTimeout(
      function() {

        loading.classList.add("hidden");

      },
      5000
    );

  }
);


/* =========================================================
   LIVRO
========================================================= */

book.addEventListener(
  "click",
  function() {

    if (!unlocked) {

      abrirSenha();

      return;

    }

    abrirCarta();

  }
);


/* =========================================================
   CANETA
========================================================= */

pen.addEventListener(
  "click",
  function() {

    if (!unlocked) {

      abrirSenha();

      return;

    }

    abrirMensagens();

  }
);


/* =========================================================
   SENHA
========================================================= */

function abrirSenha() {

  passwordOverlay
    .classList
    .remove("hidden");

  passwordError.textContent = "";

  passwordInput.value = "";

  setTimeout(
    function() {

      passwordInput.focus();

    },
    100
  );

}


unlockButton.addEventListener(
  "click",
  verificarSenha
);


passwordInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      verificarSenha();

    }

  }
);


function verificarSenha() {

  const value =
    passwordInput.value.trim();


  if (value === PASSWORD) {

    unlocked = true;

    passwordOverlay
      .classList
      .add("hidden");

    passwordInput.value = "";

    passwordError.textContent = "";


    /*
       Depois de desbloquear,
       abre o livro.
    */

    abrirCarta();

  } else {

    passwordError.textContent =
      "A senha não está correta.";

    passwordInput.select();

  }

}


cancelPassword.addEventListener(
  "click",
  function() {

    passwordOverlay
      .classList
      .add("hidden");

    passwordInput.value = "";

    passwordError.textContent = "";

  }
);


/* =========================================================
   CARTA
========================================================= */

function abrirCarta() {

  currentPage = 0;

  atualizarPagina();

  letterOverlay
    .classList
    .remove("hidden");

}


function atualizarPagina() {

  pages.forEach(
    function(page, index) {

      page.classList.toggle(
        "active",
        index === currentPage
      );

    }
  );


  pageNumber.textContent =
    `${currentPage + 1} / ${pages.length}`;


  previousPage.disabled =
    currentPage === 0;


  nextPage.disabled =
    currentPage === pages.length - 1;


  /*
     A mensagem só aparece na última página.
  */

  if (
    currentPage === pages.length - 1
  ) {

    lastNote
      .classList
      .remove("hidden");

  } else {

    lastNote
      .classList
      .add("hidden");

  }

}


/* =========================================================
   PÁGINA ANTERIOR
========================================================= */

previousPage.addEventListener(
  "click",
  function() {

    if (currentPage > 0) {

      currentPage--;

      atualizarPagina();

    }

  }
);


/* =========================================================
   PRÓXIMA PÁGINA
========================================================= */

nextPage.addEventListener(
  "click",
  function() {

    if (
      currentPage <
      pages.length - 1
    ) {

      currentPage++;

      atualizarPagina();

    }

  }
);


/* =========================================================
   FECHAR CARTA
========================================================= */

closeLetter.addEventListener(
  "click",
  function() {

    letterOverlay
      .classList
      .add("hidden");

  }
);


/* =========================================================
   ABRIR MENSAGENS
========================================================= */

async function abrirMensagens() {

  messagesOverlay
    .classList
    .remove("hidden");

  await carregarMensagens();

}


/* =========================================================
   FECHAR MENSAGENS
========================================================= */

closeMessages.addEventListener(
  "click",
  function() {

    messagesOverlay
      .classList
      .add("hidden");

  }
);


/* =========================================================
   CARREGAR MENSAGENS
========================================================= */

async function carregarMensagens() {

  try {

    const response =
      await fetch(
        API_URL +
        "?action=messages&time=" +
        Date.now()
      );


    const data =
      await response.json();


    if (
      data.success &&
      Array.isArray(data.messages)
    ) {

      allMessages =
        data.messages;

    } else {

      allMessages = [];

    }

  } catch (error) {

    console.error(
      "Erro ao carregar mensagens:",
      error
    );

    allMessages = [];

  }


  renderizarFolhaAtual();

}


/* =========================================================
   ORGANIZAR FOLHAS
========================================================= */

function obterFolhas() {

  const sheets = [];


  for (
    let i = 0;
    i < allMessages.length;
    i += MESSAGES_PER_SHEET
  ) {

    sheets.push(
      allMessages.slice(
        i,
        i + MESSAGES_PER_SHEET
      )
    );

  }


  if (sheets.length === 0) {

    sheets.push([]);

  }


  return sheets;

}


/* =========================================================
   FOLHA ATUAL
========================================================= */

function renderizarFolhaAtual() {

  const sheets =
    obterFolhas();


  currentMessageSheet =
    sheets.length - 1;


  renderizarSheet(
    currentMessageSheet
  );


  atualizarArquivo(
    sheets
  );

}


/* =========================================================
   RENDERIZAR FOLHA
========================================================= */

function renderizarSheet(index) {

  const sheets =
    obterFolhas();


  const sheet =
    sheets[index] || [];


  messagesContainer.innerHTML =
    "";


  if (sheet.length === 0) {

    const empty =
      document.createElement("div");


    empty.style.cssText = `
      text-align:center;
      margin-top:100px;
      opacity:.45;
      font-family:Georgia,serif;
    `;


    empty.textContent =
      "ainda não há mensagens.";


    messagesContainer.appendChild(
      empty
    );


    return;

  }


  sheet.forEach(
    function(item) {

      const wrapper =
        document.createElement("div");


      wrapper.className =
        "message";


      const rotation =
        (
          Math.random() * 2 - 1
        ).toFixed(2);


      wrapper.style.setProperty(
        "--rotation",
        rotation + "deg"
      );


      const name =
        document.createElement("div");


      name.className =
        "message-name";


      name.textContent =
        item.name;


      const text =
        document.createElement("div");


      text.className =
        "message-text";


      text.textContent =
        item.message;


      const date =
        document.createElement("div");


      date.className =
        "message-date";


      date.textContent =
        formatarData(
          item.timestamp
        );


      wrapper.appendChild(name);

      wrapper.appendChild(text);

      wrapper.appendChild(date);


      messagesContainer.appendChild(
        wrapper
      );

    }
  );

}


/* =========================================================
   ARQUIVO
========================================================= */

function atualizarArquivo(sheets) {

  archiveList.innerHTML =
    "";


  const oldSheets =
    sheets.length - 1;


  if (oldSheets <= 0) {

    const text =
      document.createElement("p");


    text.style.opacity =
      ".6";


    text.textContent =
      "Ainda não existem folhas anteriores.";


    archiveList.appendChild(
      text
    );


    return;

  }


  for (
    let i = oldSheets - 1;
    i >= 0;
    i--
  ) {

    const button =
      document.createElement("button");


    button.textContent =
      `folha ${i + 1}`;


    button.addEventListener(
      "click",
      function() {

        currentMessageSheet =
          i;


        renderizarSheet(
          i
        );


        archive
          .classList
          .add("hidden");

      }
    );


    archiveList.appendChild(
      button
    );

  }

}


/* =========================================================
   ABRIR ARQUIVO
========================================================= */

archiveButton.addEventListener(
  "click",
  function() {

    const sheets =
      obterFolhas();


    atualizarArquivo(
      sheets
    );


    archive
      .classList
      .remove("hidden");

  }
);


/* =========================================================
   FECHAR ARQUIVO
========================================================= */

closeArchive.addEventListener(
  "click",
  function() {

    archive
      .classList
      .add("hidden");

  }
);


/* =========================================================
   ENVIAR MENSAGEM
========================================================= */

sendButton.addEventListener(
  "click",
  enviarMensagem
);


messageInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      enviarMensagem();

    }

  }
);


async function enviarMensagem() {

  const name =
    nameInput.value.trim();


  const message =
    messageInput.value.trim();


  if (!name) {

    alert(
      "Antes de enviar, coloque seu nome."
    );

    nameInput.focus();

    return;

  }


  if (!message) {

    alert(
      "Escreva uma mensagem."
    );

    messageInput.focus();

    return;

  }


  sendButton.disabled =
    true;


  sendButton.textContent =
    "enviando...";


  try {

    const response =
      await fetch(
        API_URL,
        {
          method:
            "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify({
              name:
                name,

              message:
                message
            })

        }
      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.error ||
        "Erro ao salvar."
      );

    }


    nameInput.value =
      "";

    messageInput.value =
      "";


    await carregarMensagens();


    alert(
      "Mensagem guardada."
    );


  } catch (error) {

    console.error(
      "Erro ao enviar:",
      error
    );


    alert(
      "Não foi possível salvar a mensagem. Verifique a publicação do Google Apps Script."
    );

  }


  sendButton.disabled =
    false;


  sendButton.textContent =
    "enviar";

}


/* =========================================================
   FORMATAR DATA
========================================================= */

function formatarData(value) {

  if (!value) {

    return "";

  }


  try {

    const date =
      new Date(value);


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return "";

    }


    return date.toLocaleString(
      "pt-BR",
      {
        day:
          "2-digit",

        month:
          "2-digit",

        year:
          "numeric",

        hour:
          "2-digit",

        minute:
          "2-digit"

      }
    );

  } catch {

    return "";

  }

}


/* =========================================================
   TECLA ESC
========================================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Escape"
    ) {

      passwordOverlay
        .classList
        .add("hidden");


      letterOverlay
        .classList
        .add("hidden");


      messagesOverlay
        .classList
        .add("hidden");


      archive
        .classList
        .add("hidden");

    }

  }
);


/* =========================================================
   TOQUE / SWIPE NA CARTA
========================================================= */


/*
   No celular, também é possível passar
   a página arrastando o dedo.
*/

let touchStartX = 0;

let touchEndX = 0;


letterOverlay.addEventListener(
  "touchstart",
  function(event) {

    touchStartX =
      event.changedTouches[0].screenX;

  },
  {
    passive: true
  }
);


letterOverlay.addEventListener(
  "touchend",
  function(event) {

    touchEndX =
      event.changedTouches[0].screenX;


    const difference =
      touchEndX - touchStartX;


    if (
      Math.abs(difference) < 50
    ) {

      return;

    }


    if (difference < 0) {

      if (
        currentPage <
        pages.length - 1
      ) {

        currentPage++;

        atualizarPagina();

      }

    } else {

      if (
        currentPage > 0
      ) {

        currentPage--;

        atualizarPagina();

      }

    }

  },
  {
    passive: true
  }
);

</script>

</body>

</html>
